/* =========================================================
   FUTURE UI — PAINEL DE OPERAÇÃO
   Visual aprimorado sem alterar a lógica do bot
   ========================================================= */
.confInicio.running{
  background:radial-gradient(circle at 88% 82%,rgba(0,229,255,.045),transparent 35%),transparent;
}
.confInicio.running .confInicioBox{
  width:500px;
  max-width:min(500px,calc(100vw - 28px));
  padding:14px 15px 15px;
  border:1px solid rgba(0,229,255,.65);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(17,24,39,.97),rgba(5,10,18,.98));
  box-shadow:0 0 0 1px rgba(0,229,255,.08),0 0 28px rgba(0,229,255,.24),0 18px 55px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(14px);
  overflow:hidden;
}
.confInicio.running .confInicioBox:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:18px;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 4px);
  opacity:.45;
}
.confInicio.running .ciHeader{
  position:relative;
  padding:2px 2px 11px;
  margin-bottom:11px;
  border-bottom:1px solid rgba(0,229,255,.16);
}
.confInicio.running .ciHeader:after{
  content:"LIVE";
  margin-left:auto;
  margin-right:7px;
  padding:3px 7px;
  border:1px solid rgba(0,255,150,.35);
  border-radius:999px;
  color:#62ffbd;
  background:rgba(0,255,150,.07);
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 0 12px rgba(0,255,150,.16);
  animation:futurePulse 1.8s infinite;
}
.confInicio.running .ciHeaderTitle{
  color:#dffcff;
  font-size:13px;
  text-shadow:0 0 12px rgba(0,229,255,.55);
}
.confInicio.running .ciHeaderTempo{
  color:#00e5ff;
  text-shadow:0 0 10px rgba(0,229,255,.65);
}
.confInicio.running .ciMini{
  width:29px;height:27px;
  border:1px solid rgba(0,229,255,.22);
  background:rgba(255,255,255,.035);
  color:#bceff5;
  transition:.18s ease;
}
.confInicio.running .ciMini:hover{
  transform:translateY(-1px);
  border-color:#00e5ff;
  color:#fff;
  background:rgba(0,229,255,.10);
  box-shadow:0 0 14px rgba(0,229,255,.28);
}
.confInicio.running .confInicioGrid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  max-height:235px;
  overflow:auto;
  padding:2px 2px 4px;
  scrollbar-width:thin;
}
.confInicio.running .confInicioGrid::-webkit-scrollbar{width:4px}
.confInicio.running .confInicioGrid::-webkit-scrollbar-thumb{background:rgba(0,229,255,.35);border-radius:8px}
.confInicio.running .ciItem{
  position:relative;
  min-height:51px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:10px;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  box-shadow:inset 0 1px rgba(255,255,255,.025);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.confInicio.running .ciItem:hover{
  transform:translateY(-2px);
  border-color:rgba(0,229,255,.42);
  background:linear-gradient(145deg,rgba(0,229,255,.085),rgba(255,255,255,.018));
  box-shadow:0 5px 18px rgba(0,0,0,.25),0 0 15px rgba(0,229,255,.08);
}
.confInicio.running .ciK{
  color:#6f8795;
  font-size:8.5px;
  letter-spacing:.85px;
  margin-bottom:5px;
}
.confInicio.running .ciV{
  color:#f5fbff;
  font-size:12px;
  line-height:1.25;
}
.confInicio.running .ciV .ciCfgInput{
  border:1px solid rgba(0,229,255,.20);
  border-radius:6px;
  background:rgba(0,0,0,.32);
  color:#fff;
  box-shadow:inset 0 0 10px rgba(0,0,0,.2);
  transition:.18s ease;
}
.confInicio.running .ciV .ciCfgInput:hover,
.confInicio.running .ciV .ciCfgInput:focus{
  border-color:#00e5ff;
  outline:none;
  box-shadow:0 0 0 1px rgba(0,229,255,.16),0 0 12px rgba(0,229,255,.13);
}
.confInicio.running .confInicioAviso{
  margin-top:9px;
  padding:9px 10px;
  border:1px solid rgba(255,179,0,.18);
  border-radius:9px;
  background:rgba(255,179,0,.045);
  color:#ffc94f;
  font-size:10.5px;
  border-top:1px solid rgba(255,179,0,.18);
}
.confInicio.running .confInicioLive{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid rgba(0,229,255,.14);
}
.confInicio.running .ciLiveTempo{
  padding:7px 8px 3px;
  border-radius:12px;
  font-size:25px;
  letter-spacing:1px;
  color:#e9feff;
  background:linear-gradient(90deg,rgba(0,229,255,.035),rgba(0,229,255,.11),rgba(0,229,255,.035));
  text-shadow:0 0 16px rgba(0,229,255,.65);
}
.confInicio.running .ciLiveTempo .rot{
  color:#62808d;
  font-size:8px;
  letter-spacing:1.4px;
}
.confInicio.running .ciLiveSub{
  font-size:10px;
  color:#88a5b1;
}
.confInicio.running .ciStatsGrid{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:9px;
}
.confInicio.running .ciStat{
  min-height:45px;
  padding:6px 4px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:9px;
  background:rgba(0,0,0,.24);
  transition:.18s ease;
}
.confInicio.running .ciStat:hover{
  border-color:rgba(0,229,255,.3);
  transform:translateY(-1px);
}
.confInicio.running .ciStatK{font-size:7.5px;color:#637b87;letter-spacing:.65px}
.confInicio.running .ciStatV{font-size:14px;text-shadow:0 0 8px rgba(255,255,255,.08)}
.confInicio.running .ciStatV.pos{text-shadow:0 0 10px rgba(0,255,110,.38)}
.confInicio.running .ciStatV.neg{text-shadow:0 0 10px rgba(255,40,60,.38)}
.confInicio.running .ciStatV.neu{text-shadow:0 0 10px rgba(0,229,255,.38)}
.confInicio.running .ciQc{
  margin-top:9px;
  padding-top:9px;
  border-top:1px solid rgba(0,229,255,.12);
}
.confInicio.running .ciQcTit{
  color:#6e8b97;
  font-size:8px;
  letter-spacing:1px;
  margin:6px 0 5px;
}
.confInicio.running .ciQcRow{gap:5px}
.confInicio.running .ciQv{
  min-width:47px;
  padding:4px 3px;
  border-color:rgba(255,255,255,.075);
  background:rgba(255,255,255,.025);
  transition:.18s ease;
}
.confInicio.running .ciQv:hover{
  transform:translateY(-2px) scale(1.025);
  border-color:rgba(0,229,255,.4);
}
.confInicio.running .ciQv .q{
  width:27px;height:27px;
  box-shadow:0 0 10px rgba(255,255,255,.08);
}
.confInicio.running .ciQv.gale{
  border-color:rgba(255,179,0,.65);
  box-shadow:0 0 13px rgba(255,179,0,.16);
}
.confInicio.running .ciQv.gale .q{animation:futurePulse 1.2s infinite}
.confInicio.running .ciLiveLista{gap:5px;margin-top:8px}
.confInicio.running .ciOp{
  border-color:rgba(255,255,255,.08);
  background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  border-radius:9px;
  transition:.18s ease;
}
.confInicio.running .ciOp:hover{transform:translateX(-2px);border-color:rgba(0,229,255,.35)}
.confInicio.running .ciOp.aberta{
  border-color:rgba(0,229,255,.7);
  background:rgba(0,229,255,.055);
  box-shadow:0 0 17px rgba(0,229,255,.14),inset 3px 0 #00e5ff;
  animation:futureOpen 1.5s infinite;
}
.confInicio.running .ciOp.win{border-color:rgba(0,255,110,.48);background:rgba(0,255,110,.035)}
.confInicio.running .ciOp.loss{border-color:rgba(255,45,65,.48);background:rgba(255,45,65,.035)}
@keyframes futurePulse{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.62;filter:brightness(1.35)}}
@keyframes futureOpen{0%,100%{box-shadow:0 0 12px rgba(0,229,255,.10),inset 3px 0 #00e5ff}50%{box-shadow:0 0 23px rgba(0,229,255,.24),inset 3px 0 #00e5ff}}
@media(max-width:620px){
  .confInicio.running .confInicioBox{right:7px;bottom:7px;max-width:calc(100vw - 14px);width:calc(100vw - 14px)}
  .confInicio.running .confInicioGrid{grid-template-columns:1fr;max-height:210px}
  .confInicio.running .ciStatsGrid{grid-template-columns:repeat(2,1fr)}
}

/* ==============================================================
   NORMALIZAÇÃO DOS JSON (mesma regra para todos os pares)
   O JSON pode vir fora de ordem. O painel SEMPRE trabalha
   em ordem cronológica.
   ============================================================== */
function normalizarDados(json){
  if(!Array.isArray(json)){
    throw new Error(&quot;O JSON não possui uma lista válida de candles.&quot;);
  }
  return json
    .filter(x =&gt; x &amp;&amp; x.time &amp;&amp; x.candle)
    .map(x =&gt; ({
      ...x,
      time: String(x.time).trim(),
      candle: String(x.candle).trim().toUpperCase()
    }))
    .filter(x =&gt; /^[0-9]{4}\.[0-9]{2}\.[0-9]{2} [0-9]{2}:[0-9]{2}/.test(x.time))
    .sort((a,b) =&gt; a.time.localeCompare(b.time));
}

/* Busca (e guarda em cache) os dados de um arquivo/pair. */
async function carregarDadosPar(arquivo){
  if(CACHE_PARES[arquivo]) return CACHE_PARES[arquivo];
  const r = await fetch(arquivo + &quot;?&quot; + Date.now());
  if(!r.ok) throw new Error(&quot;Erro HTTP &quot; + r.status);
  CACHE_PARES[arquivo] = normalizarDados(await r.json());
  return CACHE_PARES[arquivo];
}

/* Monta o intervalo [inicio, fim) de um dia e devolve as velas do dia + contexto. */
function intervaloDoDia(ano, mes, dia){
  const ini = `${ano}.${String(mes).padStart(2,&quot;0&quot;)}.${String(dia).padStart(2,&quot;0&quot;)} 00:00`;
  const fd = new Date(ano, mes - 1, dia);
  fd.setDate(fd.getDate() + 1);
  const fim = `${fd.getFullYear()}.${String(fd.getMonth()+1).padStart(2,&quot;0&quot;)}.${String(fd.getDate()).padStart(2,&quot;0&quot;)} 00:00`;
  return { inicio: ini, fim };
}

/* Filtra um par pela data escolhida (ou usa tudo quando não há data). */
function filtrarDadosPorData(dados, dataFiltro){
  if(!dataFiltro){
    return { globais: dados.slice(), contexto: [] };
  }
  const partes = dataFiltro.split(&quot;-&quot;);
  const faixa = intervaloDoDia(Number(partes[0]), Number(partes[1]), Number(partes[2]));
  return {
    globais: dados.filter(x =&gt; x.time &gt;= faixa.inicio &amp;&amp; x.time &lt; faixa.fim),
    contexto: dados.filter(x =&gt; x.time &lt; faixa.inicio).slice(-2000)
  };
}

/* CARREGAR */
async function carregar(){
  const par = document.getElementById(&quot;par&quot;).value;
  const dataFiltro = document.getElementById(&quot;data&quot;).value;

  CACHE_PARES = {}; // força o RANK DE PARES a buscar dados novos a cada atualização

  try{
    const r = await fetch(par + &quot;?&quot; + Date.now());

    if(!r.ok){
      throw new Error(&quot;Erro HTTP &quot; + r.status);
    }

    let dados = normalizarDados(await r.json());

    DADOS_TODOS = dados;

    /* Último dia que realmente existe nos dados (usado como &quot;HOJE&quot; do painel). */
    ULTIMO_DIA_DADOS = dados.length ? dados[dados.length - 1].time.split(&quot; &quot;)[0] : &quot;&quot;;

    /* =====================================================
       FILTRO DE DIA COMPLETO
       Ex.: 10/09/2026 = 10/09 00:00 até 11/09 00:00
       ===================================================== */
    if(dataFiltro){

      const partes = dataFiltro.split(&quot;-&quot;);

      const ano = Number(partes[0]);
      const mes = Number(partes[1]);
      const dia = Number(partes[2]);

      /* Monta o intervalo [inicio, fim) de um dia. O fim é EXCLUSIVO
         (&lt; fim) para não &quot;vazar&quot; a vela 00:00 do dia seguinte. */
      const intervaloDoDia = (a, m, d) =&gt; {
        const ini = `${a}.${String(m).padStart(2,&quot;0&quot;)}.${String(d).padStart(2,&quot;0&quot;)} 00:00`;
        const fd = new Date(a, m - 1, d);
        fd.setDate(fd.getDate() + 1);
        const f = `${fd.getFullYear()}.${String(fd.getMonth()+1).padStart(2,&quot;0&quot;)}.${String(fd.getDate()).padStart(2,&quot;0&quot;)} 00:00`;
        return { inicio: ini, fim: f };
      };

      let faixa = intervaloDoDia(ano, mes, dia);
      let inicio = faixa.inicio;
      const fim = faixa.fim;

      DADOS_GLOBAIS = dados.filter(x =&gt;
        x.time &gt;= inicio &amp;&amp; x.time &lt; fim
      );

      /* CORREÇÃO DO BUG: se a data escolhida não tem velas (fuso horário,
         mercado fechado ou arquivo ainda não atualizado), o painel ficava
         VAZIO. Agora ele abre automaticamente o último dia que existe nos datos. */
      DIA_SEM_DADOS = false;
      if(DADOS_GLOBAIS.length === 0 &amp;&amp; ULTIMO_DIA_DADOS){
        const u = ULTIMO_DIA_DADOS.split(&quot;.&quot;);
        faixa = intervaloDoDia(Number(u[0]), Number(u[1]), Number(u[2]));
        inicio = faixa.inicio;
        DADOS_GLOBAIS = dados.filter(x =&gt;
          x.time &gt;= faixa.inicio &amp;&amp; x.time &lt; faixa.fim
        );
        DIA_SEM_DADOS = true;
        document.getElementById(&quot;data&quot;).value = `${u[0]}-${u[1]}-${u[2]}`;
      }

      /* Remove horários duplicados para não deslocar as posições. */
      const unicos = [];
      const vistos = new Set();

      for(const item of DADOS_GLOBAIS){
        if(!vistos.has(item.time)){
          vistos.add(item.time);
          unicos.push(item);
        }
      }

      DADOS_GLOBAIS = unicos;

      /* CONTEXTO: guarda as últimas velas ANTES do dia selecionado.
         Isso permite analisar (e exibir) o 1º quadrante do dia, que começa 00:00. */
      DADOS_CONTEXTO = dados.filter(x =&gt; x.time &lt; inicio).slice(-2000);

    }else{
      DADOS_GLOBAIS = [...dados];
      DADOS_CONTEXTO = [];
      DIA_SEM_DADOS = false;
    }

    DADOS_GLOBAIS.sort((a,b) =&gt; a.time.localeCompare(b.time));

    console.log(&quot;======================================&quot;);
    console.log(&quot;PAINEL TRADING PRO MASTER&quot;);
    console.log(&quot;PAR:&quot;, par);
    console.log(&quot;DATA:&quot;, dataFiltro || &quot;TODAS&quot;);
    console.log(&quot;TOTAL:&quot;, DADOS_GLOBAIS.length);

    if(DADOS_GLOBAIS.length){
      console.log(&quot;PRIMEIRO:&quot;, DADOS_GLOBAIS[0].time);
      console.log(&quot;ÚLTIMO:&quot;, DADOS_GLOBAIS[DADOS_GLOBAIS.length - 1].time);
    }

    console.log(&quot;======================================&quot;);

    desenhar();

  }catch(e){

    console.error(&quot;Erro ao carregar dados:&quot;, e);

    const painel = document.getElementById(&quot;painel&quot;);

    if(painel){
      painel.innerHTML = `
        &lt;div style=&quot;
          background:#300;
          color:#fff;
          border:2px solid #f33;
          padding:20px;
          border-radius:10px;
          margin:20px;
          font-weight:bold;
        &quot;&gt;
          ERRO AO CARREGAR O ARQUIVO JSON
          &lt;br&gt;&lt;br&gt;
          ${e.message}
        &lt;/div&gt;
      `;
    }
  }
}



/* ==============================================================
   ESTRATÉGIA MAIORIA DA COR
   - A MAIORIA das cores do bloco (G/V/D) indica a cor prevista.
   - A entrada é feita na 1ª VELA do BLOCO SEGUINTE; se errar, usa
     GALE nas velas seguintes desse mesmo bloco até acertar a cor.
   ============================================================== */
/* A MAIORIA considera APENAS VERDE (G) e VERMELHO (V).
   O D (amarelo) é NEUTRO e não vira sinal. Em caso de empate (G = V),
   vale a cor da última vela G/V do bloco (momento atual). */
function corMaioria(bloco){
  if(!bloco || !bloco.length) return null;
  let g = 0, v = 0, ultimo = null;
  bloco.forEach(x =&gt; {
    if(x.candle === &quot;G&quot;){ g++; ultimo = &quot;G&quot;; }
    else if(x.candle === &quot;V&quot;){ v++; ultimo = &quot;V&quot;; }
  });
  if(g === 0 &amp;&amp; v === 0) return null;
  if(g &gt; v) return &quot;G&quot;;
  if(v &gt; g) return &quot;V&quot;;
  return ultimo || (g &gt; 0 ? &quot;G&quot; : &quot;V&quot;); // empate: cor da última vela G/V
}


function nomeCor(k){
  if(k === &quot;G&quot;) return &quot;VERDE&quot;;
  if(k === &quot;V&quot;) return &quot;VERMELHO&quot;;
  if(k === &quot;D&quot;) return &quot;AMARELO&quot;;
  return &quot;-&quot;;
}

/* Nº de velas de entrada necessárias para DECIDIR um quadrante:
   a entrada olha a 1ª vela e, no máximo, o GALE escolhido — sempre DENTRO
   do bloco (o GALE não acrescenta velas). */
function velasParaDecidir(){
  return Math.min(1 + GALE, QTD_VELAS);
}

/* Decide um par (entrada, anterior) SEM tratar bloco em formação como LOSS.
   Devolve:
     &quot;WIN&quot;      -&gt; a cor prevista apareceu dentro da janela de entrada;
     &quot;LOSS&quot;     -&gt; a janela de entrada terminou (bloco cheio) sem a cor;
     &quot;PENDENTE&quot; -&gt; bloco ainda incompleto e sem a cor (pode virar WIN);
     &quot;SEM_SINAL&quot;-&gt; o bloco anterior não teve maioria G/V. */
function decidirPar(entrada, anterior){
  const cor = corMaioria(anterior);
  if(!cor) return { status:&quot;SEM_SINAL&quot;, gale:-1, cor:null };
  const limite = velasParaDecidir();
  for(let p = 1; p &lt;= limite; p++){
    const atual = entrada[p - 1];
    if(!atual) break;
    if(atual.candle === cor) return { status:&quot;WIN&quot;, gale:p - 1, cor };
  }
  if(entrada.length &gt;= limite) return { status:&quot;LOSS&quot;, gale:-1, cor };
  return { status:&quot;PENDENTE&quot;, gale:-1, cor };
}

/* Estatísticas da estratégia MAIORIA sobre uma lista de pares [atual, anterior].
   Sinal = bloco ANTERIOR; entrada = bloco ATUAL (o exibido).
   pendenteUltimo = true somente no dia ATUAL: o último bloco, se ainda não
   puder ser decidido, NÃO conta como LOSS (isso fazia a sequência &quot;piscar&quot;). */
function estatMaioria(pares, pendenteUltimo){
  let win = 0, aval = 0;
  const galeUsado = {};
  const resultadosSeq = []; // sequência WIN/LOSS (com gale) para simular o LUCRO
  let rachaAtual = 0, maxLossSeguidos = 0;
  let rachaWinAtual = 0, maxWinSeguidos = 0;
  for(let j = 0; j &lt; pares.length; j++){
    const d = decidirPar(pares[j][0], pares[j][1]);
    if(d.status === &quot;SEM_SINAL&quot;) continue;
    if(d.status === &quot;PENDENTE&quot;){
      // Bloco em formação no dia atual: aguarda as próximas velas.
      if(pendenteUltimo) continue;
      // Dia já fechado: mantém o comportamento antigo (conta como LOSS).
    }
    aval++;
    if(d.status === &quot;WIN&quot;){
      galeUsado[d.gale] = (galeUsado[d.gale] || 0) + 1;
      resultadosSeq.push({ status: &quot;WIN&quot;, gale: d.gale });
      win++;
      rachaAtual = 0;
      rachaWinAtual++;
      if(rachaWinAtual &gt; maxWinSeguidos) maxWinSeguidos = rachaWinAtual;
    }
    else {
      resultadosSeq.push({ status: &quot;LOSS&quot;, gale: -1 });
      rachaWinAtual = 0;
      rachaAtual++;
      if(rachaAtual &gt; maxLossSeguidos) maxLossSeguidos = rachaAtual;
    }
  }
  return { win, loss: aval - win, total: aval, galeUsado, maxLossSeguidos, maxWinSeguidos, resultados: resultadosSeq };
}


/* FORMATA O RESULTADO: WIN/LOSS + PADRÃO + LETRA */
function formatarResultadoHTML(res){
  if(res.resultado === &quot;PENDENTE&quot;){
    return &quot;⏳ QUADRANTE EM FORMAÇÃO&lt;br&gt;&lt;br&gt;AGUARDANDO AS PRÓXIMAS VELAS&quot;;
  }
  if(res.resultado !== &quot;WIN&quot;){
    const padrao = res.padrao || &quot;-&quot;;
    const letra  = res.posicao1 || 0;
    return `❌ LOSS&lt;br&gt;&lt;br&gt;🎯 PADRÃO: ${padrao}&lt;br&gt;&lt;br&gt;📈 LETRA ${letra}`;
  }
  let html = &quot;✅ WIN&lt;br&gt;&lt;br&gt;&quot;;
  if(res.gale &gt; 0){
    html += &quot;✅&quot; + res.gale + &quot; GALE&lt;br&gt;&lt;br&gt;&quot;;
  }
  return html + &quot;🎯 PADRÃO: &quot; + res.padrao + &quot;&lt;br&gt;&lt;br&gt;📈 LETRA &quot; + res.posicao1;
}

/* ANALISAR BLOCO — ESTRATÉGIA MAIORIA DA COR */
function analisarBloco(bloco, filtroOverride, blocoAnterior, blocoProximo){
  // A cor prevista vem do bloco ANTERIOR: a MAIORIA das cores (G/V; D é neutro).
  // A entrada é feita no BLOCO ATUAL (o exibido): 1ª vela = WIN; se errar,
  // GALE nas velas seguintes até a cor prevista aparecer.
  const entrada = Array.isArray(blocoProximo) ? blocoProximo : [];
  const cor = corMaioria(blocoAnterior);
  if(!cor){
    return { resultado:&quot;LOSS&quot;, padrao:&quot;MAIORIA DA COR (VELA ANTERIOR -)&quot;, quantidade:0, posicao1:0, posicao2:0, cor:null };
  }
  for(let p = 1; p &lt;= 1 + GALE; p++){
    const atual = entrada[p - 1];
    if(atual &amp;&amp; atual.candle === cor){
      return { resultado:&quot;WIN&quot;, padrao:&quot;MAIORIA DA COR (VELA ANTERIOR &quot; + nomeCor(cor) + &quot;)&quot;, quantidade:0, posicao1:p, posicao2:0, gale:p - 1, cor };
    }
  }
  return { resultado:&quot;LOSS&quot;, padrao:&quot;MAIORIA DA COR (VELA ANTERIOR &quot; + nomeCor(cor) + &quot;)&quot;, quantidade:0, posicao1:0, posicao2:0, cor };
}

/* Formata o uso de gale: &quot;0G:12 · 1G:5 · 2G:2&quot; (nível de gale =&gt; nº de wins) */
function formatarGaleUso(galeUsado){
  const chaves = Object.keys(galeUsado).map(Number).sort((a, b) =&gt; a - b);
  if(!chaves.length) return &quot;0G:0&quot;;
  return chaves.map(k =&gt; `${k}G:${galeUsado[k]}`).join(&quot; · &quot;);
}

/* Monta os pares de quadrantes (bloco ATUAL, bloco ANTERIOR) de uma lista de velas.
   Inclui o 1º bloco do dia (quando existe contexto do dia anterior) e o ÚLTIMO
   bloco parcial, para que o dia apareça COMPLETO de 00:00 até 00:00. */
function montarParesQuadrantes(dados, contexto){
  const janela = QTD_VELAS; // bloco fixo: o GALE não acrescenta velas
  const blocos = [];
  for(let i = 0; i &lt; dados.length; i += janela){
    const b = dados.slice(i, i + janela);
    if(b.length === 0) break;
    blocos.push(b);
  }
  const ctx = (contexto &amp;&amp; contexto.length &gt;= QTD_VELAS) ? contexto.slice(-janela) : null;
  const pares = [];
  let anterior = ctx;
  for(const b of blocos){
    if(anterior === null){ anterior = b; continue; } // 1º bloco absoluto (sem referência)
    pares.push([b, anterior]);
    anterior = b;
  }
  return pares;
}

/* ==============================================================
ESTRATÉGIA EM ALTA — POR DIA
(mesma lógica simples: uma linha por VELA, com QTD DE VELAS
fixa e QTD QUADRANTES igual para todas as linhas do dia)
============================================================== */
function resultadoVelasDoDia(dados, contexto, pendenteUltimo){
  const qtd = QTD_VELAS;                 // tamanho de leitura (Qtd Velas)
  // Quadrantes COMPLETOS do dia (inclui o 1º bloco e o bloco final parcial)
  const pares = montarParesQuadrantes(dados, contexto);
  const totalQuadrantes = pares.length;

  const linhas = [];

  // ── ESTRATÉGIA MAIORIA DA COR ──
  {
    const st = estatMaioria(pares, pendenteUltimo);
    const sim = simularLucroQuadrantes(st.resultados || []);
    linhas.push({
      n: 0,
      padrao: &quot;MAIORIA DA COR&quot;,
      velas: qtd,
      pct: st.total ? (st.win / st.total * 100) : 0,
      win: st.win,
      loss: st.loss,
      total: st.total,
      galeUsado: st.galeUsado,
      maxLossSeguidos: st.maxLossSeguidos,
      maxWinSeguidos: st.maxWinSeguidos,
      lucro: sim.lucro,
      lucroPct: sim.pct
    });
  }

  // Ordena da MAIOR acertividade
  linhas.sort((a, b) =&gt; b.pct - a.pct || a.n - b.n);
  return linhas;
}

function gerarRankingDias(){
  const container = document.getElementById(&quot;rankingDias&quot;);
  if(!container) return;

  // Usa os dados COMPLETOS (DADOS_TODOS), sem depender do filtro de data,

  // Agrupa os dados por dia (YYYY.MM.DD)

        &lt;/tr&gt;`;

    registros.push({

      loss: lin.loss || 0,
      total: lin.total || 0,

      maxWinSeguidos: lin.maxWinSeguidos || 0,
      maxLossSeguidos: lin.maxLossSeguidos || 0,
      lucro: lin.lucro || 0,

      ` (${regFoco.lucroPct &gt;= 0 ? &quot;+&quot; : &quot;-&quot;}${pctTxt} %)&lt;/span&gt;`;

  const clsCard = FILTRA_PAR_ABERTO ? &quot;cardFiltraPar aberto&quot; : &quot;cardFiltraPar&quot;;

  let html = `
    &lt;div class=&quot;${clsCard}&quot;&gt;

        &lt;span&gt;FILTRA PAR : &lt;b&gt;${nomePar}&lt;/b&gt;&lt;/span&gt;
        &lt;span class=&quot;botoesFiltraPar&quot;&gt;
          &lt;button id=&quot;btnFiltraAberto&quot; class=&quot;btnFiltra aber${FILTRA_PAR_ABERTO ? &quot; ativo&quot; : &quot;&quot;}&quot; onclick=&quot;definirFiltraPar(true)&quot;&gt;ABERTO&lt;/button&gt;
          &lt;button id=&quot;btnFiltraFechado&quot; class=&quot;btnFiltra fech${FILTRA_PAR_ABERTO ? &quot;&quot; : &quot; ativo&quot;}&quot; onclick=&quot;definirFiltraPar(false)&quot;&gt;FECHADO&lt;/button&gt;
          &lt;button class=&quot;btnExport&quot; title=&quot;Baixar todos os dias deste par em CSV&quot; onclick=&quot;exportarFiltraPar(&#x27;csv&#x27;)&quot;&gt;⬇ CSV&lt;/button&gt;
          &lt;button class=&quot;btnExport&quot; title=&quot;Baixar todos os dias deste par em JSON&quot; onclick=&quot;exportarFiltraPar(&#x27;json&#x27;)&quot;&gt;⬇ JSON&lt;/button&gt;
        &lt;/span&gt;

          &amp;nbsp;&amp;nbsp;&amp;nbsp;DATA&amp;nbsp;&amp;nbsp;&lt;span&gt;${rotFoco}&lt;/span&gt;
          &amp;nbsp;&amp;nbsp;&amp;nbsp;LUCRO&amp;nbsp;&amp;nbsp;${htmlLucroCab}&lt;/div&gt;
        &lt;table&gt;
          &lt;tr&gt;&lt;th colspan=&quot;13&quot; style=&quot;background:#00e5ff;color:#000;font-size:22px;&quot;&gt;FILTRA PAR — TODOS OS DIAS DO PAR SELECIONADO&lt;/th&gt;&lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;DIA&lt;/th&gt;&lt;th&gt;PAR&lt;/th&gt;&lt;th&gt;RANK&lt;/th&gt;&lt;th&gt;PADRÃO&lt;/th&gt;&lt;th&gt;QTD DE VELAS&lt;/th&gt;

        &lt;td style=&quot;color:#ff1744&quot;&gt;${r.loss}&lt;/td&gt;

  html += `&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;`;

/* ==============================================================
   EXPORTACAO (CSV / JSON) — FILTRA PAR e OPERACOES PASSADAS
   ============================================================== */
function _baixarArquivo(nome, conteudo, mime){
  try{
    var blob = new Blob([conteudo], { type: mime || &quot;text/plain;charset=utf-8&quot; });
    var url = URL.createObjectURL(blob);
    var a = document.createElement(&quot;a&quot;);
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    return true;
  }catch(e){
    console.error(&quot;Falha ao exportar:&quot;, e);
    alert(&quot;Nao foi possivel gerar o arquivo: &quot; + e.message);
    return false;
  }
}

function _csvCampo(v){
  var s = (v === null || v === undefined) ? &quot;&quot; : String(v);
  return /[&quot;;\n\r]/.test(s) ? &#x27;&quot;&#x27; + s.replace(/&quot;/g, &#x27;&quot;&quot;&#x27;) + &#x27;&quot;&#x27; : s;
}
function _paraCSV(cabecalho, linhas){
  var head = cabecalho.map(_csvCampo).join(&quot;;&quot;);
  var body = linhas.map(function(l){ return l.map(_csvCampo).join(&quot;;&quot;); }).join(&quot;\r\n&quot;);
  return &quot;\uFEFF&quot; + head + &quot;\r\n&quot; + body;   // BOM para o Excel abrir acentos certo
}
function _dataHoraArquivo(){
  var d = new Date();
  var p = function(n){ return String(n).padStart(2, &quot;0&quot;); };
  return d.getFullYear() + &quot;-&quot; + p(d.getMonth()+1) + &quot;-&quot; + p(d.getDate()) + &quot;_&quot; +
         p(d.getHours()) + &quot;-&quot; + p(d.getMinutes());
}

/* ---------------- FILTRA PAR ---------------- */
function exportarFiltraPar(formato){
  var registros = window.__filtraParRegistros || [];
  var nomePar = window.__filtraParNome || &quot;PAR&quot;;
  if(!registros.length){ alert(&quot;Sem dados do FILTRA PAR para exportar.&quot;); return; }
  var base = &quot;filtra-par_&quot; + String(nomePar).replace(/[^\w]+/g, &quot;_&quot;) + &quot;_&quot; + _dataHoraArquivo();
  if(formato === &quot;json&quot;){
    _baixarArquivo(base + &quot;.json&quot;,
      JSON.stringify({ par: nomePar, geradoEm: new Date().toISOString(), dias: registros }, null, 2),
      &quot;application/json;charset=utf-8&quot;);
    return;
  }
  var cab = [&quot;DIA&quot;,&quot;PAR&quot;,&quot;RANK&quot;,&quot;PADRAO&quot;,&quot;QTD DE VELAS&quot;,&quot;%&quot;,&quot;WIN&quot;,&quot;LOSS&quot;,
             &quot;QTD WIN SEGUIDOS&quot;,&quot;QTD LOSS SEGUIDOS&quot;,&quot;GALE USADO&quot;,&quot;QTD QUADRANTES&quot;,&quot;LUCROS&quot;,&quot;LUCRO %&quot;];
  var linhas = registros.map(function(r, i){
    var p = r.dia.split(&quot;.&quot;);
    var rot = (i === 0) ? &quot;ATUAL&quot; : p[2] + &quot;/&quot; + p[1];
    return [rot, nomePar, 1, &quot;MAIORIA DA COR&quot;, QTD_VELAS, r.pct.toFixed(1),
            r.win, r.loss, r.maxWinSeguidos, r.maxLossSeguidos,
            formatarGaleUso(r.galeUsado), r.total,
            String(r.lucro).replace(&quot;.&quot;, &quot;,&quot;), String(r.lucroPct).replace(&quot;.&quot;, &quot;,&quot;)];
  });
  _baixarArquivo(base + &quot;.csv&quot;, _paraCSV(cab, linhas), &quot;text/csv;charset=utf-8&quot;);
}

/* ---------------- OPERACOES PASSADAS ---------------- */
function _txt(el){ return el ? el.textContent.replace(/\s+/g, &quot; &quot;).trim() : &quot;&quot;; }
function _num(txt){
  var m = String(txt || &quot;&quot;).replace(/\./g, &quot;&quot;).match(/(-?\d+(?:,\d+)?)/);
  return m ? m[1] : &quot;&quot;;
}
function _coletarOperacoesPassadas(){
  var blocos = Array.prototype.slice.call(document.querySelectorAll(&quot;#painel .bloco&quot;));
  var linhas = [];
  blocos.forEach(function(bloco, bi){
    var resBloco = _txt(bloco.querySelector(&quot;.headerBloco&quot;));
    var dias = bloco.querySelectorAll(&quot;.rodapeOps .opDia&quot;);
    Array.prototype.forEach.call(dias, function(op){
      var data = _txt(op.querySelector(&quot;.opData&quot;));
      var resDia = _txt(op.querySelector(&quot;.opRes&quot;));
      var velas = op.querySelectorAll(&quot;.opVela&quot;);
      if(!velas.length){
        linhas.push({ quadrante: bi + 1, resultadoQuadrante: resBloco, dia: data,
                      resultadoDia: resDia, hora: &quot;&quot;, vela: &quot;&quot;, letra: &quot;&quot;,
                      entrada: &quot;&quot;, lucro: &quot;&quot; });
        return;
      }
      Array.prototype.forEach.call(velas, function(v){
        var timeEl = v.querySelector(&quot;.time&quot;);
        var hora = timeEl ? timeEl.innerHTML.replace(/&lt;br\s*\/?&gt;/gi, &quot; &quot;).replace(/&lt;[^&gt;]+&gt;/g, &quot;&quot;).trim() : &quot;&quot;;
        linhas.push({
          quadrante: bi + 1,
          resultadoQuadrante: resBloco,
          dia: data,
          resultadoDia: resDia,
          hora: hora,
          vela: _txt(v.querySelector(&quot;.numVela&quot;)),
          letra: _txt(v.querySelector(&quot;.quadrado&quot;)),
          entrada: _num(_txt(v.querySelector(&quot;.aposta&quot;))),
          lucro: _num(_txt(v.querySelector(&quot;.apostaLucro&quot;)))
        });
      });
    });
  });
  return linhas;
}
function exportarOperacoesPassadas(formato){
  var linhas = _coletarOperacoesPassadas();
  if(!linhas.length){ alert(&quot;Sem OPERACOES PASSADAS para exportar. Carregue o painel com dados primeiro.&quot;); return; }
  var base = &quot;operacoes-passadas_&quot; + _dataHoraArquivo();
  if(formato === &quot;json&quot;){
    _baixarArquivo(base + &quot;.json&quot;,
      JSON.stringify({ geradoEm: new Date().toISOString(), total: linhas.length, operacoes: linhas }, null, 2),
      &quot;application/json;charset=utf-8&quot;);
    return;
  }
  var cab = [&quot;QUADRANTE&quot;,&quot;RESULTADO DO QUADRANTE&quot;,&quot;DIA&quot;,&quot;RESULTADO DO DIA&quot;,&quot;HORA&quot;,
             &quot;N. VELA&quot;,&quot;LETRA&quot;,&quot;ENTRADA R$&quot;,&quot;LUCRO R$&quot;];
  var rows = linhas.map(function(l){
    return [l.quadrante, l.resultadoQuadrante, l.dia, l.resultadoDia, l.hora,
            l.vela, l.letra, l.entrada, l.lucro];
  });
  _baixarArquivo(base + &quot;.csv&quot;, _paraCSV(cab, rows), &quot;text/csv;charset=utf-8&quot;);
}

/* ==============================================================
🏆 RANK — ESTRATÉGIA EM ALTA POR DIA
(PAR QUE MAIS SAIU COMO MELHOR NA DATA)
Usa o cache do MELHOR PAR POR DIA: conta quantas vezes cada par foi o
1º colocado do dia e agrega os números SOMENTE desses dias.
============================================================== */
function gerarRankingMelhoresParesDia(){
  const container = document.getElementById(&quot;rankingMelhoresParesDia&quot;);
  if(!container) return;

  const mapa = CACHE_MELHOR_PAR_DIA &amp;&amp; CACHE_MELHOR_PAR_DIA.mapa;
  if(!mapa || !Object.keys(mapa).length){
    container.innerHTML = &quot;&quot;;
    return;
  }

  const dias = Object.keys(mapa).sort().reverse(); // mais novo -&gt; mais antigo
  const totalDias = dias.length;

  const info = {}; // nome -&gt; agregados dos dias em que foi 1º
  dias.forEach(d =&gt; {
    const arr = mapa[d];
    if(!arr || !arr.length) return;
    const best = arr[0];
    if(!best) return;

    const nome = best.nome;
    const reg = info[nome] || (info[nome] = {
      nome,
      qtd: 0,
      somaPct: 0,
      melhorPct: -Infinity,
      maxWin: 0,
      maxLoss: 0,
      win: 0,
      loss: 0,
      dias: []
    });

    const pct = Number(best.pct) || 0;
    reg.qtd++;
    reg.somaPct += pct;
    if(pct &gt; reg.melhorPct) reg.melhorPct = pct;
    reg.maxWin = Math.max(reg.maxWin, best.maxWinSeguidos || 0);
    reg.maxLoss = Math.max(reg.maxLoss, best.maxLossSeguidos || 0);
    reg.win += best.win || 0;
    reg.loss += best.loss || 0;

    const p = d.split(&quot;.&quot;);
    reg.dias.push(p[2] + &quot;/&quot; + p[1]);
  });

  const lista = Object.keys(info).map(k =&gt; {
    const r = info[k];
    return {
      nome: r.nome,
      qtd: r.qtd,
      pctMedio: r.qtd ? (r.somaPct / r.qtd) : 0,
      melhorPct: r.melhorPct === -Infinity ? 0 : r.melhorPct,
      maxWin: r.maxWin,
      maxLoss: r.maxLoss,
      win: r.win,
      loss: r.loss,
      dias: r.dias
    };
  });

  // Mais vezes em 1º; empate -&gt; maior MELHOR %; depois % médio; depois mais WIN.
  lista.sort((a, b) =&gt;
    b.qtd - a.qtd ||

  const medalha = (i) =&gt; i === 0 ? &quot;🥇&quot; : i === 1 ? &quot;🥈&quot; : i === 2 ? &quot;🥉&quot; : (i + 1) + &quot;º&quot;;

/* ==============================================================
RANK DE PARES — MELHOR PAR DE MOEDA + MELHOR PADRÃO
Compara TODOS os pares do seletor e ranqueia pelo padrão de maior
assertividade (na data escolhida e com o GALE atual).
============================================================== */
async function gerarRankingPares(){
  const container = document.getElementById(&quot;rankingPares&quot;);
  if(!container) return;
  if(RANK_PARES_EM_ANDAMENTO) return;

  const sel = document.getElementById(&quot;par&quot;);
  const opcoes = Array.from(sel.options).map(o =&gt; ({ arquivo: o.value, nome: o.textContent.trim() }));
  const dataFiltro = document.getElementById(&quot;data&quot;).value;

  RANK_PARES_EM_ANDAMENTO = true;
  container.innerHTML = `&lt;div style=&quot;color:#ffb300;font-weight:bold;margin:15px;font-size:18px;&quot;&gt;🏆 Calculando o melhor par do período…&lt;/div&gt;`;

  const resultados = [];

  // Carrega todos os pares e descobre o dia MAIS RECENTE entre eles: é o único
  // que pode estar &quot;ao vivo&quot; (com bloco em formação).
  const paresCarregados = [];
  let ultimoDiaGlobal = &quot;&quot;;
  for(const op of opcoes){
    try{
      const dados = await carregarDadosPar(op.arquivo);
      paresCarregados.push({ op, dados });
      if(dados.length){
        const d = dados[dados.length - 1].time.split(&quot; &quot;)[0];
        if(d &gt; ultimoDiaGlobal) ultimoDiaGlobal = d;
      }
    }catch(e){
      resultados.push({ nome: op.nome, erro: true });
    }
  }

  const diaAlvo = dataFiltro ? dataFiltro.split(&quot;-&quot;).join(&quot;.&quot;) : &quot;&quot;;
  const pendenteUltimo = !diaAlvo || (diaAlvo === ultimoDiaGlobal);

  for(const { op, dados } of paresCarregados){
    try{
      const { globais, contexto } = filtrarDadosPorData(dados, dataFiltro);
      const linhas = resultadoVelasDoDia(globais, contexto, pendenteUltimo);
      const validas = (linhas || []).filter(l =&gt; l.total &gt; 0);
      if(validas.length){
        const melhor = validas[0]; // já vem ordenado do maior % para o menor
        resultados.push({ nome: op.nome, padrao: melhor.padrao, pct: Number(melhor.pct), win: melhor.win, loss: melhor.loss, total: melhor.total, galeUsado: melhor.galeUsado || {}, maxLossSeguidos: melhor.maxLossSeguidos || 0, maxWinSeguidos: melhor.maxWinSeguidos || 0, lucro: melhor.lucro || 0, lucroPct: melhor.lucroPct || 0 });
      }else{
        resultados.push({ nome: op.nome, semDados: true });
      }
    }catch(e){
      resultados.push({ nome: op.nome, erro: true });
    }
  }

  // Classificação: MELHOR PAR = o que tem MENOS LOSS SEGUIDO.
  // Empate -&gt; maior % de acerto e, depois, mais WIN.
  resultados.sort((a, b) =&gt;
    (a.maxLossSeguidos ?? Infinity) - (b.maxLossSeguidos ?? Infinity) ||
    (b.pct || 0) - (a.pct || 0) ||
    (b.win || 0) - (a.win || 0)
  );

  let html = `
    &lt;table&gt;
      &lt;tr&gt;&lt;th colspan=&quot;11&quot; style=&quot;background:#ffb300;color:#000;font-size:22px;&quot;&gt;🏆 RANK DE PARES — MELHOR PAR (MENOR LOSS SEGUIDO)&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;
        &lt;th&gt;RANK&lt;/th&gt;&lt;th&gt;PAR&lt;/th&gt;&lt;th&gt;MELHOR PADRÃO&lt;/th&gt;&lt;th&gt;QTD DE VELAS&lt;/th&gt;&lt;th&gt;%&lt;/th&gt;&lt;th&gt;WIN&lt;/th&gt;&lt;th&gt;LOSS&lt;/th&gt;&lt;th&gt;QTD WIN SEGUIDOS&lt;/th&gt;&lt;th&gt;QTD LOSS SEGUIDOS&lt;/th&gt;&lt;th&gt;QTD QUADRANTES&lt;/th&gt;&lt;th&gt;LUCROS&lt;/th&gt;
      &lt;/tr&gt;`;

  resultados.forEach((r, i) =&gt; {
    const destaque = (i === 0 &amp;&amp; r.pct &gt; 0) ? &#x27; style=&quot;background:#ffb300;color:#000;font-weight:bold;&quot;&#x27; : &#x27;&#x27;;
    if(r.semDados){
      html += `&lt;tr&gt;&lt;td&gt;${i + 1}º&lt;/td&gt;&lt;td&gt;${r.nome}&lt;/td&gt;&lt;td colspan=&quot;9&quot; style=&quot;color:#888;&quot;&gt;— sem dados no período —&lt;/td&gt;&lt;/tr&gt;`;
    }else if(r.erro){
      html += `&lt;tr&gt;&lt;td&gt;${i + 1}º&lt;/td&gt;&lt;td&gt;${r.nome}&lt;/td&gt;&lt;td colspan=&quot;9&quot; style=&quot;color:#ff1744;&quot;&gt;— arquivo .json não encontrado / erro —&lt;/td&gt;&lt;/tr&gt;`;
    }else{
      html += `&lt;tr${destaque}&gt;
        &lt;td&gt;${i + 1}º&lt;/td&gt;
        &lt;td&gt;${r.nome}&lt;/td&gt;
        &lt;td&gt;${r.padrao}&lt;/td&gt;
        &lt;td&gt;${QTD_VELAS}&lt;/td&gt;
        &lt;td&gt;${r.pct.toFixed(1)}%&lt;/td&gt;
        &lt;td style=&quot;color:#00e676&quot;&gt;${r.win}&lt;/td&gt;
        &lt;td style=&quot;color:#ff1744&quot;&gt;${r.loss}&lt;/td&gt;
        &lt;td style=&quot;color:#00e676;font-weight:bold;&quot;&gt;${r.maxWinSeguidos || 0}&lt;/td&gt;
        &lt;td style=&quot;color:#ff1744;font-weight:bold;&quot;&gt;${r.maxLossSeguidos || 0}&lt;/td&gt;
        &lt;td&gt;${r.total}&lt;/td&gt;
        ${celulaLucro(r.lucro, r.lucroPct)}
      &lt;/tr&gt;`;
    }
  });

  html += `&lt;/table&gt;`;
  container.innerHTML = html;
  RANK_PARES_EM_ANDAMENTO = false;
}

/* ==============================================================
MELHOR PAR DA DATA — compara TODOS os pares do seletor e mostra
qual teve o melhor desempenho em CADA dia (a data escolhida e os
dias anteriores), com o GALE e a Qtd de Velas atuais.
============================================================== */
async function calcularMelhorParPorDia(){
  const base = (DADOS_TODOS &amp;&amp; DADOS_TODOS.length) ? DADOS_TODOS : DADOS_GLOBAIS;
  const sig = QTD_VELAS + &quot;|&quot; + GALE + &quot;|&quot; + base.length + &quot;|&quot; +
    (base.length ? base[0].time : &quot;&quot;) + &quot;|&quot; +
    (base.length ? base[base.length - 1].time : &quot;&quot;);

  if(CACHE_MELHOR_PAR_DIA.sig === sig &amp;&amp; CACHE_MELHOR_PAR_DIA.mapa) return CACHE_MELHOR_PAR_DIA.mapa;
  if(MELHOR_PAR_DIA_EM_ANDAMENTO) return CACHE_MELHOR_PAR_DIA.mapa;

  MELHOR_PAR_DIA_EM_ANDAMENTO = true;

  const sel = document.getElementById(&quot;par&quot;);
  const opcoes = Array.from(sel.options).map(o =&gt; ({ arquivo: o.value, nome: o.textContent.trim() }));
  const mapa = {};

  // 1ª passada: carrega todos os pares (fica no cache) e descobre o dia MAIS
  // RECENTE entre TODOS eles. Esse é o único dia que pode estar &quot;ao vivo&quot;.
  const paresCarregados = [];
  let ultimoDiaGlobal = &quot;&quot;;
  for(const op of opcoes){
    let dados;
    try{
      dados = await carregarDadosPar(op.arquivo);
    }catch(e){
      continue; // par sem arquivo .json: ignora
    }
    paresCarregados.push({ nome: op.nome, dados });
    if(dados.length){
      const d = dados[dados.length - 1].time.split(&quot; &quot;)[0];
      if(d &gt; ultimoDiaGlobal) ultimoDiaGlobal = d;
    }
  }

  // 2ª passada: melhor padrão de cada par em cada dia
  for(const { nome, dados } of paresCarregados){
    // agrupa as velas por dia
    const porDia = {};
    dados.forEach(x =&gt; {
      const d = x.time.split(&quot; &quot;)[0];
      if(!porDia[d]) porDia[d] = [];
      porDia[d].push(x);
    });

    const diasAsc = Object.keys(porDia).sort();
    diasAsc.forEach((d, k) =&gt; {
      // contexto = últimas velas do dia anterior (analisa o 1º quadrante do dia)
      const contexto = (k === 0) ? [] : porDia[diasAsc[k - 1]].slice(-QTD_VELAS);
      // Só o dia mais recente/global pode ter bloco em formação (PENDENTE).
      const linhas = resultadoVelasDoDia(porDia[d], contexto, d === ultimoDiaGlobal);
      const validas = (linhas || []).filter(l =&gt; l.total &gt; 0);
      if(!validas.length) return;
      const melhor = validas[0]; // já vem ordenado do maior % para o menor
      if(!mapa[d]) mapa[d] = [];
      mapa[d].push({
        nome: nome,
        padrao: melhor.padrao,
        pct: Number(melhor.pct),
        win: melhor.win,
        loss: melhor.loss,
        total: melhor.total,
        galeUsado: melhor.galeUsado || {},
        maxLossSeguidos: melhor.maxLossSeguidos || 0,
        maxWinSeguidos: melhor.maxWinSeguidos || 0,
        lucro: melhor.lucro || 0,
        lucroPct: melhor.lucroPct || 0
      });
    });
  }

  // Classificação: MELHOR PAR = o que tem MENOS LOSS SEGUIDO.
  // Empate -&gt; maior % de acerto e, depois, mais WIN.
  Object.keys(mapa).forEach(d =&gt; {
    mapa[d].sort((a, b) =&gt;
      (a.maxLossSeguidos || 0) - (b.maxLossSeguidos || 0) ||
      b.pct - a.pct ||
      b.win - a.win
    );
  });

  CACHE_MELHOR_PAR_DIA = { sig, mapa };
  MELHOR_PAR_DIA_EM_ANDAMENTO = false;
  return mapa;
}

/* Devolve o melhor par de um dia específico (YYYY.MM.DD) */
function melhorParDoDia(dia){
  const mapa = CACHE_MELHOR_PAR_DIA.mapa;
  if(!mapa || !mapa[dia] || !mapa[dia].length) return null;
  return mapa[dia][0];
}

/* ==============================================================
DESTAQUE DE CÉLULA — clicar em WIN, LOSS, QTD WIN SEGUIDOS ou
QTD LOSS SEGUIDOS seleciona a célula e escurece o restante.
============================================================== */
function garantirOverlayEscuro(){
  let ov = document.getElementById(&quot;overlayEscuro&quot;);
  if(!ov){
    ov = document.createElement(&quot;div&quot;);
    ov.id = &quot;overlayEscuro&quot;;
    ov.addEventListener(&quot;click&quot;, limparDestaqueCelula);
    document.body.appendChild(ov);
  }
  return ov;
}

/* Marca/desmarca destaque dos blocos conforme a métrica selecionada.
   A ordem dos blocos renderizados é a ordem das velas no painel. */
function aplicarDestaqueBlocos(){
  const blocos = Array.from(document.querySelectorAll(&quot;#painel .bloco&quot;));
  blocos.forEach(b =&gt; b.classList &amp;&amp; b.classList.remove(&quot;blocoDestaque&quot;));
  if(!DESTAQUE_METRICA || !blocos.length) return;

  const res = blocos.map(b =&gt; (b.dataset &amp;&amp; b.dataset.resultado) || &quot;&quot;);
  const alvo = [];

  if(DESTAQUE_METRICA === &quot;win&quot;){
    blocos.forEach((b, i) =&gt; { if(res[i] === &quot;WIN&quot;) alvo.push(b); });
  } else if(DESTAQUE_METRICA === &quot;loss&quot;){
    blocos.forEach((b, i) =&gt; { if(res[i] === &quot;LOSS&quot;) alvo.push(b); });
  } else if(DESTAQUE_METRICA.indexOf(&quot;pos_&quot;) === 0){
    // Colunas 📈 1..N: destaca os quadrantes cujo WIN terminou nessa posição
    const pos = parseInt(DESTAQUE_METRICA.slice(4), 10);
    blocos.forEach((b, i) =&gt; {
      const p = parseInt((b.dataset &amp;&amp; b.dataset.posicao1) || &quot;0&quot;, 10);
      if(res[i] === &quot;WIN&quot; &amp;&amp; p === pos) alvo.push(b);
    });
  } else if(DESTAQUE_METRICA === &quot;maxwin&quot; || DESTAQUE_METRICA === &quot;maxloss&quot;){
    const tipo = (DESTAQUE_METRICA === &quot;maxwin&quot;) ? &quot;WIN&quot; : &quot;LOSS&quot;;

    // maior sequência da métrica
    let best = 0, cur = 0;
    res.forEach(r =&gt; {
      if(r === tipo){ cur++; if(cur &gt; best) best = cur; }
      else cur = 0;
    });

    // marca todos os blocos que pertencem a uma sequência de tamanho == best
    let i = 0;
    while(i &lt; res.length){
      if(res[i] === tipo){
        let j = i;
        while(j &lt; res.length &amp;&amp; res[j] === tipo) j++;
        if(best &gt; 0 &amp;&amp; (j - i) === best){
          for(let k = i; k &lt; j; k++) alvo.push(blocos[k]);
        }
        i = j;
      } else {
        i++;
      }
    }
  }

  alvo.forEach(b =&gt; b.classList &amp;&amp; b.classList.add(&quot;blocoDestaque&quot;));
}

function aplicarDestaqueCelula(el){
  CELULA_DESTAQUE = el;
  el.classList.add(&quot;celulaDestaque&quot;);
  document.body.classList.add(&quot;modoDestaque&quot;);
  garantirOverlayEscuro().classList.add(&quot;ativo&quot;);
  aplicarDestaqueBlocos();
}

function limparDestaqueCelula(){
  if(CELULA_DESTAQUE){
    CELULA_DESTAQUE.classList.remove(&quot;celulaDestaque&quot;);
    CELULA_DESTAQUE = null;
  }
  DESTAQUE_METRICA = null;
  const ov = document.getElementById(&quot;overlayEscuro&quot;);
  if(ov) ov.classList.remove(&quot;ativo&quot;);
  document.body.classList.remove(&quot;modoDestaque&quot;);
  aplicarDestaqueBlocos();
}

function clicarMetrica(el, metrica){
  // clicar de novo na MESMA métrica desfaz o destaque
  if(DESTAQUE_METRICA === metrica){
    limparDestaqueCelula();
    return;
  }
  limparDestaqueCelula();
  DESTAQUE_METRICA = metrica;
  aplicarDestaqueCelula(el);
}

/* FORMATAR VALOR BRASILEIRO */
function fmtBrl(v){
  return v.toLocaleString(&quot;pt-BR&quot;, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* AJUDA: valor da aposta/ganho de recuperação após um LOSS,
   conforme o MODO selecionado (MULTIPLICADOR ou DIVISOR) */
/* AJUDA: valor da aposta para RECUPERAR uma perda.
   DIV: aposta = perda / (DIVISOR%).  |  MULT: aposta = perda * MULT.
   O DIVISOR controla a MATEMÁTICA; o PAYOUT controla apenas o LUCRO. */
function calcRecuperacao(perda){
  if(MODO === &quot;DIV&quot;){
    // DIVISOR: aposta = perda / (DIVISOR%).
    // Se perder de novo, soma-se a aposta à perda acumulada e divide-se de novo pelo DIVISOR.
    const rec = perda / (DIVISOR / 100);
    return { aposta: rec, ganho: (PAYOUT / 100) * rec };
  }
  // MULTIPLICADOR (padrão): aposta = perda * MULT, ganho = payout * aposta
  const rec = perda * MULT;
  return { aposta: rec, ganho: (PAYOUT / 100) * rec };
}

/* Arredonda valores para 2 casas decimais (precisão em reais) */
function arred(v){ return Math.round(v * 100) / 100; }

/* ==============================================================
LUCRO DA ESTRATÉGIA (simulação da banca / martingale)
Recebe a sequência de resultados dos quadrantes na ordem cronológica
([{status:&quot;WIN&quot;|&quot;LOSS&quot;, gale}]) e aplica a MESMA máquina de dinheiro da
calculadora (PAYOUT, DIVISOR/MULT e GALE atuais), recuperando perdas
acumuladas entre blocos. Devolve o lucro total em R$ e em % da banca.
============================================================== */
function simularLucroQuadrantes(resultados){
  let banca = BANCA;
  let perdaAcumulada = 0;
  const payout = PAYOUT / 100;
  const ladder = ladderEntradas();
  const maxGaleBloco = Math.max(0, Math.min(GALE, QTD_VELAS - 1)); // entrada na vela 1
  const resultadosArr = Array.isArray(resultados) ? resultados : [];

  resultadosArr.forEach(r =&gt; {
    if(r.status === &quot;WIN&quot;){
      if(perdaAcumulada &gt; 0){
        // Recuperação: perde as posições de gale e vence na última, devolvendo a perda.
        const posicoes = (r.gale || 0) + 1;
        for(let p = 1; p &lt;= posicoes; p++){
          const entry = arred(calcRecuperacao(perdaAcumulada).aposta);
          if(p &lt; posicoes){
            banca -= entry;
            perdaAcumulada = arred(perdaAcumulada + entry);
          }else{
            banca += arred(perdaAcumulada);
            perdaAcumulada = 0;
          }
        }
      }else{
        // WIN normal (venceu no nível de gale g)
        const g = r.gale || 0;
        let sumPrev = 0;
        for(let i = 0; i &lt; g; i++){ sumPrev += ladder[i] || 0; banca -= ladder[i] || 0; }
        const entry = ladder[g] || 0;
        banca += payout * entry;
      }
    }else{
      // LOSS: falhou todos os níveis do bloco (entrada na vela 1 + gales)
      if(perdaAcumulada &gt; 0){
        for(let p = 1; p &lt;= maxGaleBloco + 1; p++){
          const entry = arred(calcRecuperacao(perdaAcumulada).aposta);
          banca -= entry;
          perdaAcumulada = arred(perdaAcumulada + entry);
        }
      }else{
        for(let i = 0; i &lt;= maxGaleBloco; i++){
          const e = ladder[i] || 0;
          banca -= e;
          perdaAcumulada = arred(perdaAcumulada + e);
        }
      }
    }
  });

  const lucro = arred(banca - BANCA);
  return { lucro, bancaFinal: arred(banca), pct: BANCA &gt; 0 ? (lucro / BANCA * 100) : 0 };
}

/* Célula HTML da coluna LUCROS (verde no lucro, vermelho no prejuízo) */
function celulaLucro(lucro, pct){
  const l = Number(lucro) || 0;
  const p = Number(pct) || 0;
  const pos = l &gt;= 0;
  const cor = pos ? &quot;#00e676&quot; : &quot;#ff1744&quot;;
  const sinal = pos ? &quot;+&quot; : &quot;-&quot;;
  const sinalPct = p &gt;= 0 ? &quot;+&quot; : &quot;-&quot;;
  const pctTxt = Math.abs(p).toFixed(2).replace(&quot;.&quot;, &quot;,&quot;);
  return `&lt;td style=&quot;color:${cor};font-weight:bold;white-space:nowrap;&quot;&gt;${sinal} R$ ${fmtBrl(Math.abs(l))}&lt;br&gt;&lt;span style=&quot;font-size:12px;opacity:.85;&quot;&gt;(${sinalPct}${pctTxt} %)&lt;/span&gt;&lt;/td&gt;`;
}

/* ESCADA MARTINGALE dentro de um bloco (níveis 0..GALE).
   DIV: cada nível aposta o suficiente para recuperar a perda acumulada
        (perda / DIVISOR%); o PAYOUT só afeta o lucro exibido.
   MULT: entrada * MULT^n. */
function ladderEntradas(){
  const arr = [];
  if(MODO === &quot;DIV&quot;){
    let owed = 0;
    for(let g = 0; g &lt;= GALE; g++){
      const entry = (g === 0) ? ENTRADA : arred(owed / (DIVISOR / 100));
      arr.push(entry);
      owed = arred(owed + entry);
    }
  } else {
    for(let g = 0; g &lt;= GALE; g++) arr.push(ENTRADA * Math.pow(MULT, g));
  }
  return arr;
}

/* RECALCULAR BANCA (valor inicial editável) */
function recalcularBanca(){
  const b = parseFloat(document.getElementById(&quot;calcBanca&quot;).value);
  BANCA = (isNaN(b) || b &lt; 0) ? 0 : b;
  desenhar();
}

/* RECALCULAR CALCULADORA (tabela de níveis) */
function recalcularCalculadora(){
  PAYOUT = parseFloat(document.getElementById(&quot;calcPayout&quot;).value) || 80;
  MULT   = parseFloat(document.getElementById(&quot;calcMult&quot;).value) || 2.5;
  ENTRADA= parseFloat(document.getElementById(&quot;calcEntrada&quot;).value) || 10;
  DIVISOR= parseFloat(document.getElementById(&quot;calcDivisor&quot;).value) || 80;
  MODO   = document.getElementById(&quot;calcModo&quot;).value;

  const ladder = ladderEntradas();   // entradas dos níveis 0..GALE (segue o MODO)
  const somaBase = ladder.reduce((s, e) =&gt; s + e, 0);

  let html = `&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;RESULTADO&lt;/th&gt;&lt;th&gt;ENTRADA&lt;/th&gt;&lt;th&gt;LUCRO&lt;/th&gt;&lt;/tr&gt;`;

  ladder.forEach((entry, g) =&gt; {
    const lucro = (PAYOUT / 100) * entry;   // o PAYOUT define o lucro
    html += `&lt;tr&gt;
      &lt;td&gt;${g === 0 ? &quot;WIN&quot; : &quot;GALE &quot; + g}&lt;/td&gt;
      &lt;td&gt;R$ ${fmtBrl(entry)}&lt;/td&gt;
      &lt;td&gt;R$ ${fmtBrl(lucro)}&lt;/td&gt;
    &lt;/tr&gt;`;
  });

  html += `&lt;tr class=&quot;lossCalc&quot;&gt;
      &lt;td&gt;LOSS&lt;/td&gt;
      &lt;td&gt;R$ ${fmtBrl(somaBase)}&lt;/td&gt;
      &lt;td&gt;—&lt;/td&gt;
    &lt;/tr&gt;`;

  // QUANTIDADE DE LOSS SEGUIDO (recuperação entre blocos)
  html += `&lt;tr&gt;&lt;td colspan=&quot;3&quot; style=&quot;background:#222;font-weight:bold;letter-spacing:1px;&quot;&gt;QUANTIDADE DE LOSS SEGUIDO&lt;/td&gt;&lt;/tr&gt;`;

  // a cada loss a PERDA ACUMULADA cresce somando a aposta perdida;
  // a aposta = perda / DIVISOR% (DIV) ou perda * MULT (MULT);
  // se perder de novo, soma a aposta à perda e recalcula; ganhando, volta ao início.
  let perda = arred(somaBase);
  const nWinLoss = Math.max(1, MAX_LOSS_SEGUIDOS);
  for(let c = 1; c &lt;= nWinLoss; c++){
    const rec = calcRecuperacao(perda);
    const aposta = arred(rec.aposta);
    html += `&lt;tr class=&quot;winCalc&quot;&gt;
      &lt;td&gt;WIN LOSS ${c}&lt;/td&gt;
      &lt;td&gt;R$ ${fmtBrl(aposta)}&lt;/td&gt;
      &lt;td&gt;R$ ${fmtBrl(perda)}&lt;/td&gt;
    &lt;/tr&gt;`;
    perda = arred(perda + aposta);
  }
  html += `&lt;/table&gt;`;

  document.getElementById(&quot;calcTabela&quot;).innerHTML = html;
}

/* DESENHAR */
function desenhar(){
  const painel = document.getElementById(&quot;painel&quot;);
  painel.innerHTML = &quot;&quot;;

  /* AVISO: a data escolhida não tinha velas e o painel abriu o último dia disponível */
  if(DIA_SEM_DADOS){
    const aviso = document.createElement(&quot;div&quot;);
    aviso.style.cssText = &quot;background:#3a2d00;color:#ffd54f;border:1px solid #ffd54f;padding:10px 14px;border-radius:8px;margin:10px auto;max-width:900px;font-weight:bold;line-height:1.5;&quot;;
    aviso.textContent = &quot;A data escolhida não tem velas nos dados (fuso horário, mercado fechado ou arquivo ainda não atualizado). Exibindo o último dia disponível: &quot; + (ULTIMO_DIA_DADOS ? ULTIMO_DIA_DADOS.split(&quot;.&quot;).reverse().join(&quot;/&quot;) : &quot;-&quot;) + &quot;.&quot;;
    painel.appendChild(aviso);
  }

  /* Nenhuma vela em lugar nenhum: evita painel totalmente em branco */
  if(DADOS_GLOBAIS.length === 0 &amp;&amp; DADOS_TODOS.length === 0){
    const vazio = document.createElement(&quot;div&quot;);
    vazio.style.cssText = &quot;background:#300;color:#fff;border:2px solid #f33;padding:20px;border-radius:10px;margin:20px;font-weight:bold;&quot;;
    vazio.innerHTML = &quot;NENHUMA VELA CARREGADA.&lt;br&gt;&lt;br&gt;Verifique se os arquivos .json (EURJPY_blocos.json, EURUSD_blocos.json, etc.) estão na MESMA pasta deste HTML.&quot;;
    painel.appendChild(vazio);
  }

  let total=0, win=0, loss=0;
  let totalGG=0, totalVV=0, totalGV=0, totalVG=0;
  // Maiores sequências (rachas) de WIN e LOSS seguidos, na mesma lógica do painel
  let seqWinAtual=0, maxWinSeg=0, seqLossAtual=0, maxLossSeg=0;
  // Conta por posicao1 real (chave = posicao inicial do par)
  let contagemLetras = {};

  /* ── OPERAÇÕES PASSADAS (rodapé de cada bloco) ──
     Para cada dia anterior mostra: DATA + RESULTADO + TODAS AS VELAS do
     bloco que ocupa OS MESMOS HORÁRIOS do bloco exibido naquele dia. */
  const fonteTodos = (DADOS_TODOS &amp;&amp; DADOS_TODOS.length) ? DADOS_TODOS : DADOS_GLOBAIS;
  const sigResumo = fonteTodos.length + &quot;|&quot; +
    (fonteTodos.length ? fonteTodos[0].time : &quot;&quot;) + &quot;|&quot; +
    (fonteTodos.length ? fonteTodos[fonteTodos.length - 1].time : &quot;&quot;) + &quot;|&quot; +
    QTD_VELAS + &quot;|&quot; + GALE;

  if(CACHE_RESUMO_DIA.sig !== sigResumo){
    const mapa = {};
    const porDiaTmp = {};
    fonteTodos.forEach(x =&gt; {
      const d = x.time.split(&quot; &quot;)[0];
      if(!porDiaTmp[d]) porDiaTmp[d] = [];
      porDiaTmp[d].push(x);
    });
    const diasAsc = Object.keys(porDiaTmp).sort();
    diasAsc.forEach((d, k) =&gt; {
      // contexto = últimas velas do dia anterior (analisa o 1º bloco do dia)
      mapa[d] = {
        velas: porDiaTmp[d],
        contexto: (k === 0) ? [] : porDiaTmp[diasAsc[k - 1]].slice(-QTD_VELAS)
      };
    });
    CACHE_RESUMO_DIA = { sig: sigResumo, mapa };
  }
  const resumoPorDia = CACHE_RESUMO_DIA.mapa || {};

  const diaEmFoco = DADOS_GLOBAIS.length
    ? DADOS_GLOBAIS[0].time.split(&quot; &quot;)[0]
    : (ULTIMO_DIA_DADOS || &quot;&quot;);

  // TODAS as datas anteriores (SEM LIMITE) — da mais nova para a mais antiga
  const diasAntes = Object.keys(resumoPorDia)
    .filter(d =&gt; d &lt; diaEmFoco)
    .sort()
    .reverse();

  /* Monta UMA linha do rodapé: DATA + RESULTADO + VELAS do bloco
     que ocupa OS MESMOS HORÁRIOS do bloco exibido naquele dia.
     ok = true (WIN/GALE) | false (LOSS) | null (sem velas nesse horário) */
  const linhaDiaAnterior = (d, horarios, bets, galePos) =&gt; {
    const info = resumoPorDia[d];
    if(!info) return null;
    const p = d.split(&quot;.&quot;);
    const rotuloData = p[2] + &quot;/&quot; + p[1];

    // indexa as velas do dia por horário (HH:MM)
    const porHora = {};
    info.velas.forEach(v =&gt; {
      const h = v.time.split(&quot; &quot;)[1].slice(0, 5);
      if(porHora[h] === undefined) porHora[h] = v;
    });

    // pega as velas do dia que caem NOS MESMOS HORÁRIOS do bloco exibido
    const velas = horarios.map(h =&gt; porHora[h]).filter(Boolean);

    if(!velas.length){
      return { ok: null, html: `&lt;div class=&quot;opDia neutro&quot;&gt;
          &lt;span class=&quot;opData&quot;&gt;${rotuloData}&lt;/span&gt;
          &lt;span class=&quot;opRes&quot;&gt;—&lt;/span&gt;
          &lt;span class=&quot;opVelas&quot;&gt;—&lt;/span&gt;
        &lt;/div&gt;` };
    }

    // sinal = bloco imediatamente anterior (mesmo dia) ou último bloco do dia anterior
    const idxPrimeira = info.velas.indexOf(velas[0]);
    const sinal = (idxPrimeira &gt;= QTD_VELAS)
      ? info.velas.slice(idxPrimeira - QTD_VELAS, idxPrimeira)
      : (info.contexto &amp;&amp; info.contexto.length &gt;= QTD_VELAS ? info.contexto.slice(-QTD_VELAS) : []);

    // MESMA lógica do painel: sinal = bloco anterior | entrada = este bloco
    let classe = &quot;neutro&quot;, texto = &quot;—&quot;, ok = null;
    const corSinal = corMaioria(sinal);
    if(corSinal){
      const res = analisarBloco(velas, &quot;MAIORIA&quot;, sinal, velas);
      if(res.resultado === &quot;WIN&quot;){
        ok = true;
        if(res.gale &gt; 0){ classe = &quot;gale&quot;; texto = &quot;GALE &quot; + res.gale; }
        else { classe = &quot;win&quot;; texto = &quot;WIN&quot;; }
      } else {
        ok = false; classe = &quot;loss&quot;; texto = &quot;LOSS&quot;;
      }
    }

    /* DETALHE COMPLETO do bloco DAQUELE DIA: cada vela com letra, data, hora,
       numero, ENTRADA R$ e LUCRO R$. Os valores de ENTRADA/LUCRO sao os MESMOS
       do bloco do dia selecionado (bets/galePos recebidos por parametro). */
    const velasHtml = velas.map((v, idx) =&gt; {
      const posV = idx + 1;
      const betV = (bets || []).find(b =&gt; b.pos === posV);
      const corV = betV ? (betV.profit &gt;= 0 ? &quot;win&quot; : &quot;loss&quot;) : &quot;&quot;;
      return `&lt;div class=&quot;opVela${posV === galePos ? &quot; gale&quot; : &quot;&quot;}&quot;&gt;
          &lt;div class=&quot;quadrado ${v.candle}&quot;&gt;${v.candle}&lt;/div&gt;
          &lt;div class=&quot;time&quot;&gt;${formatarData(v.time)}&lt;/div&gt;
          &lt;div class=&quot;numVela&quot;&gt;${posV}&lt;/div&gt;
          ${posV === galePos ? `&lt;div class=&quot;badgeGale&quot;&gt;GALE&lt;/div&gt;` : &quot;&quot;}
          ${betV ? `&lt;div class=&quot;aposta ${corV}&quot;&gt;ENTRADA R$ ${fmtBrl(betV.entry)}&lt;/div&gt;
            &lt;div class=&quot;apostaLucro ${corV}&quot;&gt;LUCRO R$ ${fmtBrl(betV.profit)}&lt;/div&gt;` : &quot;&quot;}
        &lt;/div&gt;`;
    }).join(&quot;&quot;);

    return { ok, html: `&lt;div class=&quot;opDia ${classe}&quot;&gt;
        &lt;span class=&quot;opData&quot;&gt;${rotuloData}&lt;/span&gt;
        &lt;span class=&quot;opRes&quot;&gt;${texto}&lt;/span&gt;
        &lt;div class=&quot;opDetalhe&quot;&gt;${velasHtml}&lt;/div&gt;
      &lt;/div&gt;` };
  };

  // ── MÁQUINA DE DINHEIRO (martingale) ──
  let banca = BANCA;        // saldo atual da banca (começa no valor editável)
  let perdaAcumulada = 0;   // SOMA das perdas consecutivas a recuperar
  let ultimoDinheiro = &quot;&quot;; // texto de dinheiro do último bloco
  let ultimoCalc = null;   // cálculo de dinheiro do último bloco processado (usado no card ÚLTIMO QUADRANTE)
  let ultimoR = null;          // resultado do último bloco exibido
  let ultimoSinalBloco = null; // bloco (sinal) do último cartão exibido
  let ultimoVenceu = false;    // status do último cartão exibido

  // Nº máximo de gale possível para a VELA n: o gale NÃO passa do bloco (Qtd Velas)
  const maxGale = (n) =&gt; Math.max(0, Math.min(GALE, QTD_VELAS - n));

  // Soma base perdida ao falhar os níveis de gale de UM bloco,
  // limitada às posições que cabem no bloco (n .. QTD_VELAS)
  const somaBasePerda = (n) =&gt; {
    const lim = maxGale(n);
    return ladderEntradas().slice(0, lim + 1).reduce((s, e) =&gt; s + e, 0);
  };

  // Número da vela de referência do padrão (ex.: &quot;VELA 2&quot; =&gt; 2)
  // A entrada da MAIORIA DA COR começa sempre na vela 1 do bloco.
  const numeroVela = (r) =&gt; 1;

  // Aposta para recuperar a perda atual (DIV: perda / divisor% | MULT: perda * MULT)
  const recEntry = (perda) =&gt; calcRecuperacao(perda).aposta;

  // Calcula GANHO/PERDA de um bloco (usa/atualiza o estado acima).
  // Retorna { dinheiro, bets (lista de apostas por posição), banca (saldo atual) }
  const calcularDinheiro = (r) =&gt; {
    const payout = PAYOUT / 100;
    const bets = [];
    const n = numeroVela(r);
    const addAposta = (pos, entry, profit) =&gt; { if(pos &gt;= 1) bets.push({ pos, entry, profit }); };
    let dinheiro;

    if(r.resultado === &quot;WIN&quot;){
      if(perdaAcumulada &gt; 0){
        // ── RECUPERAÇÃO (bloco WIN após 1+ LOSS) ──
        // Anda posição a posição n..posicao1: a cada posição tenta recuperar a
        // perda acumulada. Se a posição perder, a perda cresce somando a aposta;
        // na posição vencedora o ganho devolve TODA a perda acumulada.
        for(let p = n; p &lt;= r.posicao1; p++){
          const entry = arred(recEntry(perdaAcumulada));
          if(p &lt; r.posicao1){
            addAposta(p, entry, -entry);
            banca -= entry;
            perdaAcumulada = arred(perdaAcumulada + entry);
          } else {
            const ganho = arred(perdaAcumulada);  // quanto estava devendo (recuperado)
            addAposta(p, entry, ganho);
            banca += ganho;
            perdaAcumulada = 0;
            dinheiro = &quot;WIN LOSS GANHO - R$ &quot; + fmtBrl(ganho);
          }
        }
      } else {
        // ── WIN normal (nível de gale g usado para vencer) ──
        const g = r.gale || 0;
        const ladder = ladderEntradas();
        let sumPrev = 0;
        for(let i = 0; i &lt; g; i++){
          const e = ladder[i];
          sumPrev += e;
          addAposta(n + i, e, -e);        // apostas perdidas antes de vencer
          banca -= e;
        }
        const entry  = ladder[g];
        const profit = payout * entry - sumPrev;
        addAposta(n + g, entry, payout * entry);
        banca += payout * entry;
        dinheiro = &quot;GANHO - R$ &quot; + fmtBrl(profit);
      }
    } else {
      // ── LOSS (falhou todos os níveis de gale do bloco) ──
      if(perdaAcumulada &gt; 0){
        // Bloco de recuperação que também perdeu todas as posições
        for(let p = n; p &lt;= n + maxGale(n); p++){
          const entry = arred(recEntry(perdaAcumulada));
          addAposta(p, entry, -entry);
          banca -= entry;
          perdaAcumulada = arred(perdaAcumulada + entry);
        }
        dinheiro = &quot;PERDA - R$ -&quot; + fmtBrl(perdaAcumulada);
      } else {
        // Perda de um bloco novo: perde a escada de gale até o fim do bloco (segue o MODO)
        const lim = maxGale(n);
        const soma = somaBasePerda(n);
        ladderEntradas().forEach((e, i) =&gt; { if(i &lt;= lim){ addAposta(n + i, e, -e); banca -= e; } });
        perdaAcumulada = soma;
        dinheiro = &quot;PERDA - R$ -&quot; + fmtBrl(soma);
      }
    }
    return { dinheiro, bets, banca };
  };

  /* BLOCOS */
  const janela = QTD_VELAS; // bloco fixo: o GALE não acrescenta velas

  // Referência do dia anterior (permite analisar o 1º quadrante do dia, 00:00).
  // Se não houver contexto (ex.: sem filtro de data), o 1º bloco continua sendo
  // apenas referência e não é exibido, como antes.
  const contextoAnterior = (DADOS_CONTEXTO &amp;&amp; DADOS_CONTEXTO.length &gt;= QTD_VELAS)
    ? DADOS_CONTEXTO.slice(-janela)
    : null;
  let blocoAnterior = contextoAnterior;
  let blocosRenderizados = 0; // garante que o dia nunca fique sem nenhum bloco

  // O dia exibido é o dia ATUAL (ainda recebendo velas)? Só nele o último
  // bloco em formação é tratado como PENDENTE em vez de LOSS.
  const ultimoDiaBase = (DADOS_TODOS &amp;&amp; DADOS_TODOS.length)
    ? DADOS_TODOS[DADOS_TODOS.length - 1].time.split(&quot; &quot;)[0] : &quot;&quot;;
  const diaExibido = DADOS_GLOBAIS.length
    ? DADOS_GLOBAIS[DADOS_GLOBAIS.length - 1].time.split(&quot; &quot;)[0] : &quot;&quot;;
  const ehDiaAtualExibido = (diaExibido !== &quot;&quot; &amp;&amp; diaExibido === ultimoDiaBase);

  for(let i = 0; i &lt; DADOS_GLOBAIS.length; i += janela){
    const bloco = DADOS_GLOBAIS.slice(i, i + janela);
    if(bloco.length === 0) break;

    // ESTRATÉGIA MAIORIA DA COR:
    //   • a cor prevista vem do bloco ANTERIOR (&quot;vela anterior&quot;);
    //   • a ENTRADA é feita NO PRÓPRIO BLOCO EXIBIDO (posições 1, 2, ... conforme o GALE).
    // Assim as velas mostradas, as apostas e o resultado ficam SEMPRE alinhados.
    let r = null;
    let pendente = false;
    if(!blocoAnterior || blocoAnterior.length &lt; 1){
      /* Sem bloco anterior (1º bloco do dia e sem contexto): não há previsão.
         Só aparece como &quot;em formação&quot; quando for o único bloco do dia. */
      if(DADOS_GLOBAIS.length &lt;= janela &amp;&amp; blocosRenderizados === 0){
        pendente = true;
        r = { resultado:&quot;PENDENTE&quot;, padrao:&quot;MAIORIA DA COR (AGUARDANDO)&quot;, quantidade:0, posicao1:0, posicao2:0, gale:0, cor:null };
      }else{
        blocoAnterior = bloco;
        continue;
      }
    }else{
      // Sinal = bloco anterior | Entrada = bloco atual (o que é exibido)
      r = analisarBloco(bloco, &quot;MAIORIA&quot;, blocoAnterior, bloco);
    }

    // Último bloco do dia ATUAL ainda em formação: NÃO decide LOSS antes de
    // ter a janela de entrada completa (evita a sequência de losses &quot;piscar&quot;).
    if(!pendente &amp;&amp; r.resultado !== &quot;WIN&quot; &amp;&amp; ehDiaAtualExibido &amp;&amp;
       (i + janela &gt;= DADOS_GLOBAIS.length) &amp;&amp;
       bloco.length &lt; Math.min(1 + GALE, janela)){
      pendente = true;
      r = { resultado:&quot;PENDENTE&quot;, padrao:&quot;MAIORIA DA COR (EM FORMAÇÃO)&quot;, quantidade:0, posicao1:0, posicao2:0, gale:0, cor:r.cor || null };
    }

    const venceu = !pendente &amp;&amp; r.resultado === &quot;WIN&quot;;
    if(!pendente) total++;
    const calc = pendente ? null : calcularDinheiro(r);
    const dinheiro = pendente ? &quot;⏳ QUADRANTE EM FORMAÇÃO&quot; : calc.dinheiro;
    ultimoDinheiro = dinheiro;
    ultimoCalc = calc;
    ultimoR = r;
    ultimoSinalBloco = bloco;
    ultimoVenceu = venceu;

    const contaPadrao = (p) =&gt; {
      if(p===&quot;GG&quot;) totalGG++;
      if(p===&quot;VV&quot;) totalVV++;
      if(p===&quot;GV&quot;) totalGV++;
      if(p===&quot;VG&quot;) totalVG++;
    };

    if(venceu){
      win++;
      seqWinAtual++;
      if(seqWinAtual &gt; maxWinSeg) maxWinSeg = seqWinAtual;
      seqLossAtual = 0;
      // Conta os padrões da TABELA PRINCIPAL (GG/VV/GV/VG)
      if(r.padroes &amp;&amp; r.padroes.length &gt; 0){
        r.padroes.forEach(p =&gt; contaPadrao(p.padrao));
      } else {
        contaPadrao(r.padrao);
      }
      // TABELA LETRAS: conta SOMENTE a 1ª ocorrência do padrão exibido
      // (posicao1 = início do par, ex.: posicao1 3 =&gt; 📈 3 =&gt; LETRAS 3 e 4)
      if(r.posicao1 &gt; 0){
        contagemLetras[r.posicao1] = (contagemLetras[r.posicao1] || 0) + 1;
      }
    } else if(!pendente){
      loss++;
      seqLossAtual++;
      if(seqLossAtual &gt; maxLossSeg) maxLossSeg = seqLossAtual;
      seqWinAtual = 0;
    }

    const box = document.createElement(&quot;div&quot;);
    box.className = &quot;bloco&quot;;
    // guarda o resultado do quadrante (usado pelo destaque dos blocos)
    box.dataset.resultado = pendente ? &quot;PENDENTE&quot; : (venceu ? &quot;WIN&quot; : &quot;LOSS&quot;);
    // guarda a posição em que o WIN terminou (usado pelo destaque das colunas 📈 1..5)
    box.dataset.posicao1 = pendente ? 0 : (r.posicao1 || 0);

    // Cabeçalho COM PADRÃO / SEM PADRÃO / EM FORMAÇÃO
    const header = document.createElement(&quot;div&quot;);
    header.className = pendente ? &quot;headerBloco pendente&quot; : (venceu ? &quot;headerBloco win&quot; : &quot;headerBloco loss&quot;);
    header.textContent = pendente ? &quot;QUADRANTE EM FORMAÇÃO ⏳&quot; : (venceu ? &quot;COM PADRÃO ✅ WIN&quot; : &quot;SEM PADRÃO ❌ LOSS&quot;);
    box.appendChild(header);

    // Monta uma seção: label + velas numeradas + resultado
    const montarLinha = (velas, label, res, classeLabel, dinheiro, bets, bancaAtual) =&gt; {
      const wrap = document.createElement(&quot;div&quot;);

      const lab = document.createElement(&quot;div&quot;);
      lab.className = classeLabel;
      lab.textContent = label;
      wrap.appendChild(lab);

      const linha = document.createElement(&quot;div&quot;);
      linha.className = &quot;linha&quot;;

      // Vela que INDICA o gale = posição onde o gale venceu (ex.: VELA 1 + GALE 1 =&gt; vela 2)
      const galePos = (res.gale &gt; 0 &amp;&amp; res.posicao1 &gt; 0) ? res.posicao1 : 0;
      velas.forEach((item, idx) =&gt; {
        const pos = idx + 1;
        const ehGale = (pos === galePos);
        const c = document.createElement(&quot;div&quot;);
        c.className = ehGale ? &quot;container gale&quot; : &quot;container&quot;;
        let html = `

        if(ehGale){
          html += `&lt;div class=&quot;badgeGale&quot;&gt;GALE ${res.gale}&lt;/div&gt;`;
        }
        // Mostra a aposta (ENTRADA + LUCRO) da posição, se existir
        const bet = bets ? bets.find(b =&gt; b.pos === pos) : null;
        if(bet){
          const cor = bet.profit &gt;= 0 ? &quot;win&quot; : &quot;loss&quot;;
          html += `
            &lt;div class=&quot;aposta ${cor}&quot;&gt;ENTRADA R$ ${fmtBrl(bet.entry)}&lt;/div&gt;
            &lt;div class=&quot;apostaLucro ${cor}&quot;&gt;LUCRO R$ ${fmtBrl(bet.profit)}&lt;/div&gt;`;
        }
        c.innerHTML = html;
        linha.appendChild(c);
      });
      wrap.appendChild(linha);

      const txt = document.createElement(&quot;div&quot;);
      txt.className = res.resultado === &quot;WIN&quot; ? &quot;win&quot; : (res.resultado === &quot;PENDENTE&quot; ? &quot;&quot; : &quot;loss&quot;);
      txt.innerHTML = formatarResultadoHTML(res);
      wrap.appendChild(txt);

      const din = document.createElement(&quot;div&quot;);
      din.className = res.resultado === &quot;WIN&quot; ? &quot;dinheiro winD&quot; : (res.resultado === &quot;PENDENTE&quot; ? &quot;dinheiro&quot; : &quot;dinheiro lossD&quot;);
      if(res.resultado === &quot;PENDENTE&quot;) din.style.color = &quot;#ffd54f&quot;;
      din.innerHTML = dinheiro;
      wrap.appendChild(din);

      const bd = document.createElement(&quot;div&quot;);
      bd.className = &quot;dinheiro&quot;;
      bd.style.marginTop = &quot;6px&quot;;
      bd.innerHTML = &quot;LUCRO ATUAL R$ &quot; + fmtBrl(bancaAtual);
      wrap.appendChild(bd);

      return wrap;
    };

    // Exibe TODAS as velas do bloco (leitura + gale), para não &quot;pular&quot; nenhum horário
    box.appendChild(montarLinha(bloco, &quot;LETRAS REAL ➡&quot;, r, &quot;labelReal&quot;, dinheiro, pendente ? [] : calc.bets, pendente ? banca : calc.banca));

    /* RODAPÉ — TODAS AS DATAS + VELAS no MESMO horário.
       % DE ACERTO DESTE BLOCO = (total de datas − LOSS) / total de datas. */
    const horariosBloco = bloco.map(v =&gt; v.time.split(&quot; &quot;)[1].slice(0, 5));
    /* Mesmos valores de ENTRADA/LUCRO do bloco do dia selecionado, usados no
       detalhe de cada dia anterior em OPERACOES PASSADAS. */
    const galePosOps = (!pendente &amp;&amp; r.gale &gt; 0 &amp;&amp; r.posicao1 &gt; 0) ? r.posicao1 : 0;
    const betsOps = pendente ? [] : (calc &amp;&amp; calc.bets ? calc.bets : []);
    const linhasAntes = diasAntes.map(d =&gt; linhaDiaAnterior(d, horariosBloco, betsOps, galePosOps)).filter(Boolean);
    const validas = linhasAntes.filter(l =&gt; l.ok !== null);
    const acertos = validas.filter(l =&gt; l.ok === true).length;
    const pctAcum = validas.length ? (acertos / validas.length * 100) : 0;
    const rodape = document.createElement(&quot;div&quot;);
    rodape.className = &quot;rodapeOps&quot;;
    rodape.innerHTML = linhasAntes.map(l =&gt; l.html).join(&quot;&quot;) +
      `&lt;div class=&quot;pctAcum&quot;&gt;${pctAcum.toFixed(1)} %&lt;/div&gt;`;
    box.appendChild(rodape);

    painel.appendChild(box);
    blocosRenderizados++;

  }

  /* ULTIMO QUADRANTE (usa o último bloco/sinal analisado no laço principal) */
  let htmlUltimos = &#x27;&#x27;;

  if(ultimoSinalBloco &amp;&amp; ultimoR){

      const galePos = (res.gale &gt; 0 &amp;&amp; res.posicao1 &gt; 0) ? res.posicao1 : 0;

        &lt;div class=&quot;resultadoUltimo ${pendenteRes ? &quot;&quot; : (res.resultado === &quot;WIN&quot; ? &quot;win&quot; : &quot;loss&quot;)}&quot; ${pendenteRes ? &#x27;style=&quot;color:#ffd54f&quot;&#x27; : &#x27;&#x27;}&gt;

    const pendenteUltimo = ultimoR &amp;&amp; ultimoR.resultado === &quot;PENDENTE&quot;;

  /* ULTIMAS 5 VELAS */
  const ultimas5 = DADOS_GLOBAIS.slice(-5);
  let htmlVelas = `

  /* ULTIMA VELA */
  let htmlUltima = &#x27;&#x27;;
  const ultimaVelaReal = DADOS_GLOBAIS[DADOS_GLOBAIS.length - 1];

  if(ultimaVelaReal){
    htmlUltima = `
      &lt;div class=&quot;cardUltima&quot;&gt;
        &lt;div class=&quot;tituloUltima&quot;&gt;ULTIMA VELA&lt;/div&gt;
        &lt;div class=&quot;boxUltima&quot;&gt;
          &lt;div class=&quot;itemUltima&quot;&gt;
            &lt;div class=&quot;q ${ultimaVelaReal.candle}&quot;&gt;${ultimaVelaReal.candle}&lt;/div&gt;

          &lt;/div&gt;

      &lt;/div&gt;`;

  document.getElementById(&quot;ultimaVela&quot;).innerHTML = htmlUltima;

  /* QUANTIDADE QUE FALTA */
  let restante = janela - (DADOS_GLOBAIS.length % janela);
  if(restante === janela) restante = 0;

  document.getElementById(&quot;quantidadeQuadrante&quot;).innerHTML = `

      &lt;div class=&quot;valorQuantidade&quot;&gt;${restante}&lt;/div&gt;

  /* ASSERTIVIDADE */
  let pct = total ? ((win / total) * 100).toFixed(1) : 0;

  /* TABELA LETRAS — pares posicao1 e posicao2 */

  // Descobre o maior valor para destacar
  const maxContagem = Math.max(...Object.values(contagemLetras));

  /* TABELA LETRAS — sempre mostra as colunas de POSIÇÃO: &quot;📈 1&quot;, &quot;📈 2&quot;, ... &quot;📈 QTD_VELAS&quot;

  const limite = janela;

    optsPar.find(o =&gt; o.value === selParEl.value) ||

  /* ── LUCROS DO DIA (mesma máquina de dinheiro dos blocos) ──
     banca = saldo da banca ao fim do dia exibido; o lucro é a diferença

  const lucroDia = arred(banca - BANCA);

  const htmlLucroDia =
    `&lt;span class=&quot;${classeLucroDia}&quot;&gt;${lucroDia &gt;= 0 ? &quot;+&quot; : &quot;-&quot;} R$ ${fmtBrl(Math.abs(lucroDia))}` +
    ` (${lucroDiaPct &gt;= 0 ? &quot;+&quot; : &quot;-&quot;}${Math.abs(lucroDiaPct).toFixed(2).replace(&quot;.&quot;, &quot;,&quot;)} %)&lt;/span&gt;`;

  let htmlTabela = `
    &lt;div class=&quot;tituloTabelaPar&quot;&gt;PAR&amp;nbsp;&amp;nbsp;&lt;span&gt;${nomeParAtual}&lt;/span&gt;
      &amp;nbsp;&amp;nbsp;&amp;nbsp;DATA&amp;nbsp;&amp;nbsp;&lt;span&gt;${dataFocoRotulo}&lt;/span&gt;
      &amp;nbsp;&amp;nbsp;&amp;nbsp;LUCROS&amp;nbsp;&amp;nbsp;${htmlLucroDia}&lt;/div&gt;
    &lt;table&gt;
    &lt;tr&gt;
      &lt;th&gt;TOTAL&lt;/th&gt;&lt;th&gt;WIN&lt;/th&gt;&lt;th&gt;LOSS&lt;/th&gt;&lt;th&gt;ASSERTIVIDADE&lt;/th&gt;&lt;th&gt;QTD WIN SEGUIDOS&lt;/th&gt;&lt;th&gt;QTD LOSS SEGUIDOS&lt;/th&gt;`;

  for(let p = 1; p &lt;= limite; p++){

    htmlTabela += `&lt;th id=&quot;thPos${p}&quot; class=&quot;clicavel&quot;${destaque} onclick=&quot;clicarMetrica(this,&#x27;pos_${p}&#x27;)&quot;&gt;📈 ${rotuloColuna(p)}&lt;/th&gt;`;
  }

  htmlTabela += `&lt;/tr&gt;&lt;tr&gt;
    &lt;td&gt;${total}&lt;/td&gt;

    &lt;td id=&quot;celLoss&quot; class=&quot;clicavel&quot; style=&quot;color:#ff1744&quot; onclick=&quot;clicarMetrica(this,&#x27;loss&#x27;)&quot;&gt;${loss}&lt;/td&gt;
    &lt;td&gt;${pct}%&lt;/td&gt;
    &lt;td id=&quot;celMaxWin&quot; class=&quot;clicavel&quot; style=&quot;color:#00e676;font-weight:bold;&quot; onclick=&quot;clicarMetrica(this,&#x27;maxwin&#x27;)&quot;&gt;${maxWinSeg}&lt;/td&gt;
    &lt;td id=&quot;celMaxLoss&quot; class=&quot;clicavel&quot; style=&quot;color:#ff1744;font-weight:bold;&quot; onclick=&quot;clicarMetrica(this,&#x27;maxloss&#x27;)&quot;&gt;${maxLossSeg}&lt;/td&gt;`;

  for(let p = 1; p &lt;= limite; p++){

  }

  htmlTabela += `&lt;/tr&gt;&lt;/table&gt;`;
  document.getElementById(&quot;rankingLetras&quot;).innerHTML = htmlTabela;

  // Reaplica o destaque da célula selecionada após redesenhar a tabela
  if(DESTAQUE_METRICA){
    const idsMetrica = { win:&quot;celWin&quot;, loss:&quot;celLoss&quot;, maxwin:&quot;celMaxWin&quot;, maxloss:&quot;celMaxLoss&quot; };
    const idDest = (DESTAQUE_METRICA.indexOf(&quot;pos_&quot;) === 0)
      ? (&quot;celPos&quot; + DESTAQUE_METRICA.slice(4))
      : (idsMetrica[DESTAQUE_METRICA] || &quot;&quot;);
    const elDest = document.getElementById(idDest);
    if(elDest) aplicarDestaqueCelula(elDest);
  }

  gerarRankingDias();
  gerarFiltraPar();
  gerarRankingPares();
  atualizarMelhorParPorDia();

  // Atualiza o LUCRO ATUAL DA BANCA na calculadora
  const lucroEl = document.getElementById(&quot;calcLucroAtual&quot;);
  if(lucroEl) lucroEl.textContent = &quot;R$ &quot; + fmtBrl(banca);

  // Calcula a MAIOR sequência real de LOSS seguidos nos dados atuais
  // e refresca a tabela da calculadora com essa quantidade de linhas WIN LOSS
  MAX_LOSS_SEGUIDOS = calcularMaxLossSeguidos();
  recalcularCalculadora();
}

/* CALCULA A MAIOR SEQUÊNCIA REAL DE LOSS SEGUIDOS (mesma lógica do painel) */
function calcularMaxLossSeguidos(){
  const janela = QTD_VELAS; // bloco fixo: o GALE não acrescenta velas
  let rachaAtual = 0, maxRacha = 0;

  // Só o dia ATUAL pode estar recebendo velas; nos dias fechados o bloco
  // final parcial continua contando como antes.
  const ehDiaAtual = (DADOS_GLOBAIS.length &gt; 0) &amp;&amp;
    (DADOS_GLOBAIS[DADOS_GLOBAIS.length - 1].time.split(&quot; &quot;)[0] === ULTIMO_DIA_DADOS);

  // ESTRATÉGIA MAIORIA DA COR: sinal = bloco anterior; entrada = bloco atual
  let anterior = (DADOS_CONTEXTO &amp;&amp; DADOS_CONTEXTO.length &gt;= QTD_VELAS)
    ? DADOS_CONTEXTO.slice(-janela)
    : null;
  for(let i = 0; i &lt; DADOS_GLOBAIS.length; i += janela){
    const entrada = DADOS_GLOBAIS.slice(i, i + janela);
    if(entrada.length === 0) break;
    if(!anterior){ anterior = entrada; continue; }
    const d = decidirPar(entrada, anterior);
    if(d.status === &quot;SEM_SINAL&quot;){ anterior = entrada; continue; }
    // Bloco em formação no dia atual NÃO entra na contagem (evita o &quot;piscar&quot;).
    if(d.status === &quot;PENDENTE&quot; &amp;&amp; ehDiaAtual){ anterior = entrada; continue; }
    if(d.status === &quot;WIN&quot;){ rachaAtual = 0; }
    else { rachaAtual++; if(rachaAtual &gt; maxRacha) maxRacha = rachaAtual; }
    anterior = entrada;
  }
  return maxRacha;
}
