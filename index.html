function cancelarAssinaturas(){
  try { if (subIdCandles) enviar({ forget: subIdCandles }); } catch(e){}
  try { if (subIdTicks) enviar({ forget: subIdTicks }); } catch(e){}
  subIdCandles = null; subIdTicks = null;
}

/* ---------- Velas ---------- */
function aoHistoricoVelas(lista){
  if (!Array.isArray(lista)) return;
  subIdCandles = lista.length ? (lista[0].id || null) : null;
  // Deduplica por horário — mesma regra do painel (&quot;remove horários
  // duplicados para não deslocar as posições&quot;).
  {
    const vistos = new Set();
    unidades = lista.map(c =&gt; ({
      epoch: Number(c.epoch),
      open: Number(c.open),
      close: Number(c.close)
    })).filter(c =&gt; {
      if (!isFinite(c.epoch) || vistos.has(c.epoch)) return false;
      vistos.add(c.epoch);
      return true;
    });
  }
  if (unidades.length){
    // COR DE CADA VELA DO HISTORICO -----------------------------------
    // O historico entrava em `unidades` SEM `cor`. Como o sinal da entrada
    // e a MAIORIA DO QUADRANTE ANTERIOR, e `coresDoBloco()` le exatamente
    // esses objetos, `corMaioria()` recebia velas sem cor e devolvia null:
    // o bot imprimia &quot;sem sinal (quadrante anterior sem maioria)&quot; e deixava
    // a VELA 1 passar SEM OPERAR, mesmo com o quadrante anterior mostrando
    // uma maioria clara na tela (a tela recalcula a cor, o motor nao).
    unidades.forEach((u, i) =&gt; { u.cor = corDaUnidade(u, i &gt; 0 ? unidades[i-1] : null); });
    ancoraEpoch = Math.floor(unidades[0].epoch / 86400) * 86400; // 00:00 UTC
    unidadeAtual = null;
    reconstruirSinalDeAbertura();
    logBot(unidades.length + &quot; velas carregadas. Última: &quot; + horaDe(unidades[unidades.length-1].epoch), &quot;ok&quot;);
    renderBlocos();
  }
}

function aoOHLC(o){
  const epoch = Number(o.open_time || o.epoch);
  const nova = { epoch: epoch, open: Number(o.open), close: Number(o.close) };

  if (!unidadeAtual || unidadeAtual.epoch !== epoch){
    // vela anterior fechou
    if (unidadeAtual) fecharUnidade({
      epoch: unidadeAtual.epoch, open: unidadeAtual.open, close: unidadeAtual.close
    });
    unidadeAtual = nova;
    aposAbrirUnidade();
  } else {
    unidadeAtual.close = nova.close;
  }
  renderBlocos();
  atualizarUI();
}

/* ---------- Ticks / Digits ---------- */
function aoTick(t){
  const quote = String(t.quote);
  const digit = Number(quote.slice(-1));
  const unidade = { epoch: Number(t.epoch), digit: digit, price: Number(t.quote) };
  if (ultimoTick) fecharUnidade(ultimoTick);
  ultimoTick = unidade;
  aposAbrirUnidade();
  renderBlocos();
  atualizarUI();
}

/* =====================================================================
   ÍNDICE DE BLOCO
   ===================================================================== */
/* PADRAO DO PAINEL: os quadrantes NAO sao montados pelo relogio, e sim
   por POSICAO. O painel pega as velas DO DIA (00:00 UTC -&gt; 00:00 UTC), em
   ordem, e fatia de &lt;bloco&gt; em &lt;bloco&gt;. Ou seja: 1a vela, 2a vela, 3a...
   e o dia recomeca no item 1. Se faltar uma vela, o quadrante NAO pula.

   Efeito pratico: a ENTRADA cai sempre na VELA 1 (ii 0) do quadrante novo,
   no instante em que o quadrante anterior termina e o novo comeca; e o 1o
   quadrante do dia usa o ULTIMO quadrante do dia anterior (mesmo incompleto)
   como referencia - exatamente como o painel. */
let BLOCO_POS = new Map();   // epoch da vela -&gt; { bi, ii }
let BLOCO_ULT = null;        // ultimo { epoch, bi, ii } atribuido
let BLOCO_DIA = null;        // dia UTC (00:00) da ultima vela atribuida
let BLOCO_POS_DIA = 0;       // posicao da ultima vela DENTRO do dia UTC (0-based)

/* POSICIONAL COMO O PAINEL — FONTE UNICA DE VERDADE.
   O painel NAO usa a grade do relogio: ele pega as velas do DIA (00:00 UTC),
   remove horarios duplicados, ordena e fatia de &lt;bloco&gt; em &lt;bloco&gt; A PARTIR
   DA 1a VELA DO DIA. Ou seja, o inicio do quadrante e a POSICAO da vela no
   dia, nao o minuto do relogio.

   Enquanto a grade do relogio era usada aqui, bastava o dia comecar num
   minuto fora do grid (ex.: o historico so tinha velas a partir de 01:11)
   para o bot entrar ~4 velas antes/depois do painel. Agora o bot fatia
   exatamente igual ao painel, entao a entrada cai sempre na VELA 1 do
   quadrante que o espelho do painel mostra. */
function atribuirIndiceBloco(epoch, cfg){
  const e = Number(epoch);
  const dia = Math.floor(e / 86400) * 86400;

  // vela ja indexada? devolve o indice existente (nao reatribui posicao)
  if (BLOCO_POS.has(e)) return BLOCO_POS.get(e);

  // ANCORA NO INICIO DO DIA DO PAINEL: se o JSON do painel comeca depois de
  // 00:00 (ex.: so tem velas desde 01:15), a grade do painel comeca ali.
  // O bot ignora as velas anteriores desse dia e conta a partir da MESMA
  // 1a vela — assim a VELA 1 do quadrante e a mesma nos dois.
  const diaIniE = (cfg.ancora === &quot;dia&quot; &amp;&amp; window.__painelDiaInicio)
    ? epochDeTimePainel(window.__painelDiaInicio) : null;
  if (diaIniE != null &amp;&amp; Math.floor(diaIniE / 86400) * 86400 === dia &amp;&amp; e &lt; diaIniE) return null;

  let bi, ii;
  if (!BLOCO_ULT){                                  // 1a vela conhecida
    bi = 0; ii = 0; BLOCO_POS_DIA = 0;
  } else if (cfg.ancora === &quot;sessao&quot;){              // sessao: contagem continua
    ii = (BLOCO_ULT.ii + 1) % cfg.bloco;
    bi = BLOCO_ULT.bi + (ii === 0 ? 1 : 0);
  } else {                                          // 00:00 UTC (igual painel)
    if (dia !== BLOCO_DIA){                         // 1a vela do dia = posicao 0
      BLOCO_POS_DIA = 0; bi = BLOCO_ULT.bi + 1;
    } else {                                        // proxima vela do mesmo dia
      BLOCO_POS_DIA = BLOCO_POS_DIA + 1;
      bi = BLOCO_ULT.bi + (BLOCO_POS_DIA % cfg.bloco === 0 ? 1 : 0);
    }
    ii = BLOCO_POS_DIA % cfg.bloco;
  }
  BLOCO_DIA = dia;
  BLOCO_ULT = { epoch: e, bi: bi, ii: ii };
  BLOCO_POS.set(e, { bi: bi, ii: ii });
  return { bi: bi, ii: ii };
}

/* Reatribui os indices de TODA a lista (ao carregar o historico). */
function reconstruirIndicesBloco(cfg){
  BLOCO_POS = new Map(); BLOCO_ULT = null; BLOCO_DIA = null; BLOCO_POS_DIA = 0;
  unidades.forEach(u =&gt; atribuirIndiceBloco(u.epoch, cfg));
}

function indiceDeBlocoPelaEpoch(epoch){
  const cfg = lerConfig();
  if (cfg.modo !== &quot;risefall&quot;) return null;
  const e = Number(epoch);
  if (BLOCO_POS.has(e)) return BLOCO_POS.get(e);
  return atribuirIndiceBloco(e, cfg);
}

/* Consulta SEM criar indice (usada só para exibir na tela). */
function indiceDeBlocoSeConhecido(epoch){
  const e = Number(epoch);
  return BLOCO_POS.has(e) ? BLOCO_POS.get(e) : null;
}

function indiceDeBlocoSessao(indice){
  const cfg = lerConfig();
  if (indiceSessao === null) indiceSessao = indice;
  const n = indice - indiceSessao;
  return { bi: Math.floor(n / cfg.bloco), ii: ((n % cfg.bloco) + cfg.bloco) % cfg.bloco };
}

/* =====================================================================
   MOTOR DA ESTRATÉGIA
   ===================================================================== */
function corMaioria(bloco){
  if (!bloco || !bloco.length) return null;
  let g = 0, v = 0, ultimo = null;
  bloco.forEach(x =&gt; {
    if (x.cor === &quot;G&quot;){ g++; ultimo = &quot;G&quot;; }
    else if (x.cor === &quot;V&quot;){ v++; ultimo = &quot;V&quot;; }
  });
  if (g === 0 &amp;&amp; v === 0) return null;
  if (g &gt; v) return &quot;G&quot;;
  if (v &gt; g) return &quot;V&quot;;
  return ultimo || (g &gt; 0 ? &quot;G&quot; : &quot;V&quot;);
}

/* Cores de TODAS as velas ja fechadas de um quadrante (bi).
   Usado para tirar a MAIORIA exatamente do bloco anterior, do mesmo jeito
   que o painel — inclusive quando o bloco do dia anterior ficou incompleto.
   Funciona nos dois modos: velas (BLOCO_POS) e ticks (indice de sessao). */
/* Lista das unidades GARANTINDO `cor` em todas — inclusive nas velas que
   vieram do historico (elas entravam sem cor e zeravam a maioria do
   quadrante anterior). E a fonte unica usada pelo motor da estrategia. */
function unidadesComCor(){
  return unidades.map((u, i) =&gt; {
    if (u.cor) return u;
    const c = corDaUnidade(u, i &gt; 0 ? unidades[i-1] : null);
    u.cor = c;                       // memoriza: na proxima chamada e O(1)
    return u;
  });
}

function coresDoBloco(bi){
  const out = [];
  if (bi === null || bi === undefined) return out;
  const cfg = lerConfig();
  const todas = unidadesComCor();
  if (cfg.modo !== &quot;risefall&quot;){
    const base = (indiceSessao === null) ? 0 : indiceSessao;
    todas.forEach((u, i) =&gt; {
      const b = Math.floor((i - base) / cfg.bloco);
      if (b === bi) out.push(u);
    });
    return out;
  }
  todas.forEach(u =&gt; {
    const p = BLOCO_POS.get(Number(u.epoch));
    if (p &amp;&amp; p.bi === bi) out.push(u);
  });
  return out;
}

function corDaUnidade(u, anterior){
  const cfg = lerConfig();
  const f = familiaAtual(cfg);

  // Contratos de DIREÇÃO (CALL/PUT) usam SEMPRE a Maioria da Cor,
  // em velas E em ticks — a regra de dígito não se aplica a eles.
  const usaMaioria = f.direcao || (cfg.estrategia !== &quot;digito&quot;) || !f.corDigito;

  // Regra de dígito: só quando o usuário escolheu &quot;Dígito do contrato&quot;,
  // o contrato é de dígitos e o bloco está em ticks.
  if (!usaMaioria &amp;&amp; cfg.modo === &quot;digits&quot;){
    if (f.corDigito === &quot;even&quot;)  return (u.digit % 2 === 0) ? &quot;G&quot; : &quot;V&quot;;
    if (f.corDigito === &quot;match&quot;){
      const b = parseInt(cfg.barreira, 10);
      if (!isNaN(b)) return (u.digit === b) ? &quot;G&quot; : &quot;V&quot;;
    }
    return u.digit &gt;= 5 ? &quot;G&quot; : &quot;V&quot;;
  }

  // MAIORIA DA COR: a cor de cada unidade é a direção do preço.
  // - bloco em TICKS: compara o preço do tick com o do tick anterior
  // - bloco em VELAS: compara fechamento com abertura
  if (cfg.modo === &quot;digits&quot;){
    const p  = (u &amp;&amp; u.price != null) ? Number(u.price) : NaN;
    const pa = (anterior &amp;&amp; anterior.price != null) ? Number(anterior.price) : NaN;
    if (!isFinite(p) || !isFinite(pa) || p === pa) return &quot;D&quot;;
    return p &gt; pa ? &quot;G&quot; : &quot;V&quot;;
  }
  if (u.close &gt; u.open) return &quot;G&quot;;
  if (u.close &lt; u.open) return &quot;V&quot;;
  return &quot;D&quot;;
}

/* Recalcula o sinal a partir das últimas velas já fechadas (ao carregar o histórico) */
function reconstruirSinalDeAbertura(){
  const cfg = lerConfig();
  if (cfg.modo !== &quot;risefall&quot;) return;
  if (!unidades.length) return;
  // Mesmo corte posicional do painel, aplicado a todo o historico.
  reconstruirIndicesBloco(cfg);
  unidadesComCor();   // garante `cor` em TODAS as velas (historico incluso)
  // So existe sinal para o proximo quadrante quando o ULTIMO do historico
  // esta COMPLETO. Se o dia acabou no meio do bloco, a virada de dia (em
  // aposAbrirUnidade) monta a referencia - igual ao painel.
  const info = indiceDeBlocoPelaEpoch(unidades[unidades.length - 1].epoch);
  if (!info || info.ii !== cfg.bloco - 1) return;
  const cor = corMaioria(coresDoBloco(info.bi));
  if (cor) sinalPendente = { cor: cor, blockIndex: info.bi + 1 };
}

/* Chamado quando uma unidade é finalizada */
function fecharUnidade(u){
  const cfg = lerConfig();
  const ultima = unidades.length ? unidades[unidades.length - 1] : null;

  // TRAVA DE POSIÇÃO (padrão do painel): o painel remove horários duplicados
  // &quot;para não deslocar as posições&quot;. O bot precisa da MESMA trava, senão o
  // quadrante anda 1 vela para trás a cada vela repetida.
  // A repetição acontece sozinha: a última vela do histórico volta na 1ª
  // mensagem &#x27;ohlc&#x27; ao vivo e era fechada/empurrada de novo.
  if (ultima &amp;&amp; Number(ultima.epoch) &gt;= Number(u.epoch)) return;

  const anterior = ultima;
  const cor = corDaUnidade(u, anterior);
  unidades.push({ epoch: u.epoch, open: u.open, close: u.close, digit: u.digit, price: u.price, cor: cor });

  let info = null;
  if (cfg.modo === &quot;risefall&quot;) info = indiceDeBlocoPelaEpoch(u.epoch);
  else info = indiceDeBlocoSessao(unidades.length - 1);
  if (!info) return;

  // resolve operação de SIMULAÇÃO
  if (tradeAtivo &amp;&amp; tradeAtivo.sim &amp;&amp; tradeAtivo.blockIndex === info.bi &amp;&amp; tradeAtivo.index === info.ii){
    const ganhou = cor === tradeAtivo.cor;
    aplicarResultado(ganhou, tradeAtivo, &quot;SIM&quot;);
    tradeAtivo = null;
  }

  // bloco completo? gera sinal para o próximo (maioria do bloco que FECHOU)
  if (info.ii === cfg.bloco - 1 &amp;&amp; unidades.length &gt;= cfg.bloco){
    const c = corMaioria(coresDoBloco(info.bi));
    if (c) sinalPendente = { cor: c, blockIndex: info.bi + 1 };
  }
}

/* Chamado quando uma nova unidade começa */
function aposAbrirUnidade(){
  if (!rodando) return;
  const cfg = lerConfig();
  const galeMax = Math.min(cfg.gale, cfg.bloco - 1);

  let info;
  if (cfg.modo === &quot;risefall&quot;){
    if (!unidadeAtual) return;
    info = indiceDeBlocoPelaEpoch(unidadeAtual.epoch);
  } else {
    info = indiceDeBlocoSessao(unidades.length);
  }
  if (!info) return;

  // A referência do 1º quadrante do dia agora é o bloco bi-1 (coresDoBloco),
  // que cobre tanto o fim do dia anterior quanto um bloco parcial — idêntico
  // ao painel, que usa o último bloco do dia anterior como contexto.

  // Trava de seguran\u00e7a: se um contrato real nunca voltar com resultado,
  // libera a sequ\u00eancia em vez de travar o bot para sempre.
  if (tradeAtivo &amp;&amp; !tradeAtivo.sim){
    const idadeMs = Date.now() - (tradeAtivo.inicioTs || Date.now());
    const limiteMs = duracaoMs(cfg) + 90000;   // duração do contrato + 90s de folga
    if (idadeMs &gt; limiteMs){
      logBot(&quot;Contrato &quot; + (tradeAtivo.contratoId || &quot;&quot;) + &quot; sem resultado após &quot; +
             fmtDuracao(idadeMs) + &quot; — liberando a sequência.&quot;, &quot;err&quot;);
      try { if (tradeAtivo.contratoId) enviar({ forget: tradeAtivo.contratoId }); } catch(e){}
      tradeAtivo = null; colocando = false; seq = null;
    }
  }
  // n\u00e3o d\u00e1 para ter duas opera\u00e7\u00f5es abertas ao mesmo tempo
  if (tradeAtivo || colocando) return;

  // 1) CONTINUA\u00c7\u00c3O DE GALE — entra no \u00edndice ATUAL do mesmo bloco.
  //    (antes exigia seq.nextIndex === info.ii; com dura\u00e7\u00e3o &gt; 1 unidade o
  //     resultado chega atrasado e o \u00edndice nunca batia, matando o GALE.)
  if (seq &amp;&amp; seq.blockIndex === info.bi &amp;&amp; seq.galeUsado &lt;= galeMax){
    // GALE AUTOMÁTICO: perdeu a vela -&gt; entra JÁ na vela seguinte do MESMO
    // bloco (vela 1 = entrada, vela 2 = GALE 1, vela 3 = GALE 2...).
    // Descartar o GALE quando a vela seguinte já abriu (resultado atrasado)
    // deixava o bot &quot;sem gale&quot;. Agora ele entra na PRIMEIRA vela disponível
    // do mesmo quadrante, respeitando o nível escolhido em GALE máximo.
    if (info.ii &lt; seq.nextIndex){          // só se algo saiu de ordem
      descartarSequencia(&quot;índice fora de ordem no GALE (idx &quot; + info.ii + &quot; &lt; &quot; + seq.nextIndex + &quot;)&quot;);
      return;
    }
    const atrasado = info.ii &gt; seq.nextIndex;
    logBot(&quot;GALE &quot; + seq.galeUsado + &quot; · bloco &quot; + info.bi +
           &quot; · vela &quot; + (info.ii + 1) + &quot; de &quot; + cfg.bloco +
           (atrasado ? &quot; (a vela &quot; + (seq.nextIndex + 1) + &quot; já tinha passado — entrando na primeira disponível)&quot; : &quot;&quot;) +
           &quot; · &quot; + rotuloStake(cfg, seq.galeUsado), &quot;&quot;);
    executarOperacao(info.bi, info.ii, seq.galeUsado, seq.cor, seq.base, seq.devido);
    return;
  }

  // 2) BLOCO NOVO: entrada SEMPRE na vela 1 (idx 0), 1 entrada por bloco.
  //    SINAL = MAIORIA DO QUADRANTE ANTERIOR (bi - 1), exatamente como o
  //    painel. Se o painel publicou o PLANO do quadrante (grade posicional
  //    exata), o sinal do painel tem prioridade — assim a entrada fica
  //    IDÊNTICA ao espelho e ao log.
  if (info.ii === 0){
    let cor = null, fonteSinal = &quot;&quot;;
    const plano = (typeof planoPainelDaVela === &quot;function&quot;)
      ? planoPainelDaVela(unidadeAtual ? unidadeAtual.epoch : null) : null;
    if (plano &amp;&amp; plano.cor){ cor = plano.cor; fonteSinal = &quot; · sinal do painel&quot;; }
    else {
      const c = corMaioria(coresDoBloco(info.bi - 1));
      if (c){ cor = c; fonteSinal = &quot; · maioria do quadrante anterior&quot;; }
    }

    if (!cor){
      // 1º quadrante sem contexto (igual ao painel: bloco absoluto sem referência)
      logBot(&quot;Bloco &quot; + info.bi + &quot;: sem sinal (quadrante anterior sem maioria). Vela 1 aguardando.&quot;,
             &quot;&quot;);
      if (seq &amp;&amp; seq.blockIndex === info.bi) descartarSequencia(&quot;sem sinal para o quadrante&quot;);
      if (sinalPendente &amp;&amp; sinalPendente.blockIndex &lt; info.bi) sinalPendente = null;
      return;
    }

    const base = stakeBase();
    if (seq) descartarSequencia(seq.blockIndex === info.bi ? &quot;sinal novo no mesmo bloco&quot; : &quot;bloco novo come\u00e7ou&quot;);
    seq = { cor: cor, blockIndex: info.bi, nextIndex: 0, galeUsado: 0, base: base,
            idxInicial: 0, devido: devidoDaBase() };
    sinalPendente = null;

    // Aviso ANTES de perder: quantos gales cabem daqui ate o fim do bloco?
    // Cada entrada ocupa `passo` itens, a partir do item onde a sequencia comecou.
    {
      const passo = passoGale(cfg);
      const sobra = cfg.bloco - 1;   // entrada sempre no item 0 do bloco
      const cabiam = Math.floor(sobra / passo);
      if (cabiam &lt; galeMax){
        logBot(&quot;\u26a0\ufe0f Aten\u00e7\u00e3o: neste bloco s\u00f3 cabem &quot; + cabiam + &quot; gale(s) a partir do item &quot; +
               info.ii + &quot; (cada entrada ocupa &quot; + passo + &quot; itens, e o bloco vai at\u00e9 o item &quot; + (cfg.bloco - 1) + &quot;). &quot; +
               &quot;O GALE &quot; + galeMax + &quot; \u2014 que voc\u00ea configurou \u2014 n\u00e3o vai conseguir entrar. &quot; +
               &quot;Para alcan\u00e7\u00e1-lo: bloco \u2265 &quot; + (passo * galeMax + 1) +
               (info.ii &gt; 0 ? &quot; E com a entrada come\u00e7ando no item 0&quot; : &quot;&quot;) +
               (temPassoMedido(cfg)
                 ? &quot; (a sugest\u00e3o de dura\u00e7\u00e3o n\u00e3o vale aqui: o passo real medido \u00e9 &quot; + passo + &quot;)&quot;
                 : &quot;, ou dura\u00e7\u00e3o \u2264 &quot; + Math.max(1, Math.floor(sobra / Math.max(1, galeMax)) - 1) + &quot; &quot; + cfg.duracaoUnidade) +
               &quot;, ou marcar \ud83d\udd12 travar dura\u00e7\u00e3o em 1.&quot;, &quot;err&quot;);
      }
    }
    logBot(&quot;\u25b6 ENTRADA \u00b7 bloco &quot; + info.bi + &quot; \u00b7 vela 1 de &quot; + cfg.bloco +
           &quot; (quadrante anterior: &quot; + (seq.cor === &quot;G&quot; ? &quot;VERDE&quot; : &quot;VERMELHO&quot;) + &quot;)&quot; + fonteSinal +
           (seq.devido &gt; 0
             ? &quot; \u00b7 \ud83d\udd01 recuperando R$ &quot; + fmt(seq.devido) +
               &quot; (\u00f7 payout &quot; + cfg.payout + &quot;%)&quot;
             : &quot;&quot;) +
           &quot; \u00b7 &quot; + rotuloStake(cfg, 0), &quot;ok&quot;);
    executarOperacao(info.bi, 0, 0, seq.cor, base, seq.devido);
    return;
  }

  // descarta sinal/sequencia de blocos que ja passaram
  if (sinalPendente &amp;&amp; sinalPendente.blockIndex &lt; info.bi) sinalPendente = null;
  if (seq &amp;&amp; seq.blockIndex &lt; info.bi) descartarSequencia(&quot;bloco terminou&quot;);
}

/* ---------- Cálculo de stake ---------- */
function stakeBase(){
  const cfg = lerConfig();
  if (!cfg.recuperar || perdaAcumulada &lt;= 0) return cfg.entrada;
  let rec;
  // RECUPERAÇÃO (padrão do painel):
  //   DIV: aposta = perda acumulada ÷ DIVISOR% (mesma conta da escada de GALE).
  //        Ex.: perdeu 22,50 com divisor 80% -&gt; entrada 28,13.
  //   MAS: aposta = perda ÷ payout%.   MULT: aposta = perda x multiplicador.
  if (cfg.money === &quot;DIV&quot;) rec = perdaAcumulada / (cfg.divisor / 100);
  else if (cfg.money === &quot;MAS&quot;) rec = perdaAcumulada / (cfg.payout / 100);
  else rec = perdaAcumulada * cfg.mult;
  return Math.max(r2(rec), cfg.entrada);
}

function masProb(N, W, odd){
  N = Math.max(1, Math.min(500, Math.floor(N) || 1));
  W = Math.max(0, Math.min(N, Math.floor(W) || 0));
  if (W &lt;= 0) return 1;
  var p = 1 / odd, q = 1 - p;
  if (!(p &gt; 0)) return 0;
  if (!(q &gt; 0)) return 1;
  var lf = new Array(N + 1); lf[0] = 0;
  for (var i = 1; i &lt;= N; i++) lf[i] = lf[i-1] + Math.log(i);
  var lp = Math.log(p), lq = Math.log(q), best = -Infinity, lw = new Array(N + 1);
  for (var k = 0; k &lt;= N; k++){
    lw[k] = lf[N] - lf[k] - lf[N-k] + k * lp + (N-k) * lq;
    if (lw[k] &gt; best) best = lw[k];
  }
  var tot = 0, cauda = 0;
  for (var j = 0; j &lt;= N; j++){
    var w = Math.exp(lw[j] - best); tot += w;
    if (j &gt;= W) cauda += w;
  }
  return Math.max(cauda / tot, 1e-12);
}
/* ---- ESTADO DO CICLO MASANIELLO ------------------------------------
   O ciclo controla quantas das N operacoes ja foram feitas e quantas das W
   vitorias ja sairam. A banca do ciclo SOBE no WIN e CAI no LOSS, e a stake e
   recalculada a cada entrada.
   (Antes o calculo partia sempre da banca inicial com W vitorias restantes,
   entao a stake ficava travada no mesmo valor e N/W eram ignorados.) */
let masCiclo = null;
function masAlvoDe(){
  const cfg = lerConfig();
  const N = Math.max(1, cfg.masN);
  const W = Math.min(Math.max(1, cfg.masW), N);
  return cfg.masBanca / masProb(N, W, cfg.masOdd);
}
function masReset(){
  const cfg = lerConfig();
  masCiclo = { base: cfg.masBanca, banca: cfg.masBanca, wins: 0, ops: 0,
               alvo: masAlvoDe(), ciclos: 0, lucroTotal: 0, motivo: null, concluido: false };
  return masCiclo;
}
function masPasso(ganhou, stake){
  const cfg = lerConfig();
  if (!masCiclo) masReset();
  if (masCiclo.concluido) return;   // ciclo ja terminou: nao conta mais nada
  const N = Math.max(1, cfg.masN);
  const W = Math.min(Math.max(1, cfg.masW), N);
  stake = r2(stake);
  if (ganhou) { masCiclo.banca = r2(masCiclo.banca + stake * (cfg.masOdd - 1)); masCiclo.wins++; }
  else        { masCiclo.banca = r2(masCiclo.banca - stake); }
  if (masCiclo.banca &lt; 0) masCiclo.banca = 0;
  masCiclo.ops++;
  let motivo = null;
  if (masCiclo.banca &lt;= 0) motivo = &quot;banca do ciclo zerada&quot;;
  else if (masCiclo.wins &gt;= W) motivo = &quot;meta de &quot; + W + &quot; vitórias atingida&quot;;
  else if (masCiclo.ops &gt;= N) motivo = &quot;N = &quot; + N + &quot; operações concluídas&quot;;
  if (motivo){
    // FIM DO CICLO: para o bot (nao recomeça sozinho).
    masCiclo.concluido = true;
    masCiclo.motivo = motivo;
    masCiclo.ciclos++;
    masCiclo.lucroTotal = r2((masCiclo.lucroTotal || 0) + (masCiclo.banca - masCiclo.base));
    logBot(&quot;MASANIELLO — CICLO CONCLUÍDO (&quot; + motivo + &quot;): &quot; + masCiclo.wins + &quot;/&quot; + W +
           &quot; vitórias em &quot; + masCiclo.ops + &quot;/&quot; + N + &quot; entradas · banca do ciclo &quot; +
           fmt(masCiclo.banca) + &quot; · bot parado.&quot;, &quot;ok&quot;);
    pararBot(&quot;Masaniello concluído — &quot; + motivo);
  }
}
/* Escada Masaniello (Efraim Traders): usa os campos proprios
   BANCA, OPERACOES (N), VITORIAS ALVO (W), PAYOUT (ODD) e % A REINVESTIR.
   A PRIMEIRA entrada ja e a stake calculada pelo Masaniello. */
function masEscada(galeMax){
  const cfg = lerConfig();
  if (!masCiclo) masReset();
  const N = Math.max(1, cfg.masN);
  const W = Math.min(Math.max(1, cfg.masW), N);
  const odd = cfg.masOdd;
  const reinv = cfg.masReinv / 100;
  const alvo = masCiclo.alvo;
  const restam = Math.max(0, W - masCiclo.wins);   // vitorias que ainda faltam no ciclo
  const out = [];
  let banca = masCiclo.banca;
  if (cfg.recuperar &amp;&amp; perdaAcumulada &gt; 0) banca = Math.max(0, banca - perdaAcumulada);
  for (let g = 0; g &lt;= galeMax; g++){
    let stake = 0;
    if (restam &gt; 0 &amp;&amp; banca &gt; 0){
      const dist = alvo - banca;
      if (dist &gt; 0) stake = (dist / ((odd - 1) * restam)) * reinv;
      stake = Math.max(0, Math.min(stake, banca));
    }
    out.push(r2(stake));
    banca = r2(banca - stake);
  }
  return out;
}

/* ---------------------------------------------------------------------
   ENTRADA ATUAL e PRÓXIMA ENTRADA (mostradas no card 4 · Resultados)
   ---------------------------------------------------------------------
   Atual  = valor da ordem que está em operação agora (se não houver ordem
            em andamento, mostra o nível que o bloco está usando).
   Próxima= valor da próxima ordem que o bot vai enviar:
            - com perda acumulada e a entrada atual perdendo -&gt; o GALE seguinte;
            - se não cabe mais GALE -&gt; a entrada do próximo bloco já
              recuperando a perda (ou a entrada base, sem recuperação);
            - sem sequência ativa -&gt; a entrada do próximo bloco.
   --------------------------------------------------------------------- */
function baseDeBloco(perdaTotal){
  const cfg = lerConfig();
  if (!cfg.recuperar || !(perdaTotal &gt; 0)) return cfg.entrada;
  if (cfg.money === &quot;MULT&quot;) return Math.max(r2(perdaTotal * cfg.mult), cfg.entrada);
  if (cfg.money === &quot;DIV&quot;) return Math.max(r2(perdaTotal / (cfg.divisor / 100)), cfg.entrada);
  return Math.max(r2(perdaTotal / (cfg.payout / 100)), cfg.entrada);   // MAS
}

function entradaAtualValor(){
  const cfg = lerConfig();
  if (tradeAtivo) return r2(tradeAtivo.stake);                     // ordem em operação
  if (seq) return r2(stakeDoNivel(seq.base, seq.galeUsado, seq.devido));
  if (logs.length) return r2(logs[logs.length - 1].stake);         // última ordem enviada
  return r2(baseDeBloco(perdaAcumulada));
}

function proximaEntradaValor(){
  const cfg = lerConfig();
  const galeMax = Math.min(cfg.gale, cfg.bloco - 1);
  if (tradeAtivo){
    const nivel = tradeAtivo.gale + 1;
    // ainda cabe GALE neste bloco? então a próxima é o GALE desse nível
    if (seq &amp;&amp; nivel &lt;= galeMax) return r2(stakeDoNivel(seq.base, nivel, seq.devido));
    // não cabe mais GALE: a próxima é a entrada do bloco seguinte, já
    // recuperando a perda acumulada + esta ordem (se ela perder)
    return r2(baseDeBloco(r2(perdaAcumulada + tradeAtivo.stake)));
  }
  if (seq) return r2(stakeDoNivel(seq.base, seq.galeUsado, seq.devido));
  return r2(baseDeBloco(perdaAcumulada));
}

/* Perda carregada que entra na recuperacao (0 quando nao ha recuperacao). */
function devidoDaBase(){
  const cfg = lerConfig();
  if (!cfg.recuperar || perdaAcumulada &lt;= 0) return 0;
  return r2(perdaAcumulada);
}

/* Escada de stake do nivel g.
   `devido` = perda carregada (recuperacao entre blocos); 0 = bloco limpo.
   PADRAO DO PAINEL (DIVISOR) — o acumulado COMECA na perda carregada:
     nivel 0: devido &gt; 0 ? devido/divisor : ENTRADA
     nivel n: (acumulado ate n-1) / divisor
   Escada limpa:  10,00 -&gt; 12,50 -&gt; 28,13 -&gt; 63,29 -&gt; 142,40 -&gt; 256,32
   Escada com perda 22,50: 28,13 -&gt; 63,29 -&gt; 142,40
   (antes o bot zerava o acumulado e apostava 35,15 no 2o nivel) */
function stakeDoNivel(base, g, devido){
  const cfg = lerConfig();
  const d0 = Math.max(0, Number(devido) || 0);
  if (cfg.money === &quot;MAS&quot;){
    if (g &lt; 0) g = 0;
    return masEscada(g)[g];
  }
  if (cfg.money === &quot;DIV&quot;){
    // nível 0 SEM perda carregada = ENTRADA; COM perda carregada = perda/DIVISOR.
    // Todos os níveis dividem o acumulado pelo DIVISOR, igual ao painel
    // (o bloco que perde soma a perda e divide a % para recuperar no próximo).
    let owed = d0, e = (owed &gt; 0) ? r2(owed / (cfg.divisor / 100)) : r2(base);
    for (let i = 0; i &lt; g; i++){ owed = r2(owed + e); e = r2(owed / (cfg.divisor / 100)); }
    return e;
  }
  // MULTIPLICADOR: bloco limpo = base * mult^g; com perda carregada o painel
  // tambem recupera o acumulado a cada nivel.
  if (d0 &lt;= 0) return (g &lt;= 0) ? r2(base) : r2(base * Math.pow(cfg.mult, g));
  let owed = d0, e = r2(owed * cfg.mult);
  for (let i = 0; i &lt; g; i++){ owed = r2(owed + e); e = r2(owed * cfg.mult); }
  return e;
}

/* ---------- Execução ---------- */
async function executarOperacao(bi, ii, galeNivel, cor, base, devido){
  const cfg = lerConfig();
  fecharAvisoVenc();
  colocando = true;
  const stake = stakeDoNivel(base, galeNivel, devido);
  const dir = cor === &quot;G&quot; ? &quot;rise&quot; : &quot;fall&quot;;

  // Mede o passo REAL entre entradas da mesma sequencia (e o que decide se o
  // GALE cabe no bloco). Medir pelo atraso do resultado subestima o espacamento.
  if (seq){
    if (galeNivel &gt; 0 &amp;&amp; seq.uUltima != null &amp;&amp; unidades.length &gt; seq.uUltima){
      const passo = unidades.length - seq.uUltima;
      if (passo &gt; 1) passoGaleReal = { duracao: cfg.duracao, passo: passo };
    }
    seq.uUltima = unidades.length;
  }

  tradeAtivo = { sim: cfg.sim, blockIndex: bi, index: ii, gale: galeNivel, cor: cor, stake: stake,
                 tickInicio: unidades.length,
                 inicioTs: Date.now(), duracaoCfg: cfg.duracao, unidadeCfg: cfg.duracaoUnidade };
  // Fim previsto: no REAL é a duração do contrato; no SIM o motor avalia no fecho da vela atual.
  tradeAtivo.expiraTs = cfg.sim
    ? ((unidadeAtual ? (Number(unidadeAtual.epoch) + (Number(cfg.velaMin) || 1) * 60)
                     : Math.floor(Date.now() / 1000)) * 1000)
    : (tradeAtivo.inicioTs + duracaoMs(cfg));

  if (cfg.sim){
    colocando = false;
    logBot(&quot;SIM · bloco &quot; + bi + &quot; idx &quot; + ii + &quot; · &quot; + (cor === &quot;G&quot; ? &quot;VERDE&quot; : &quot;VERMELHO&quot;) +
           &quot; · gale &quot; + galeNivel + &quot; · &quot; + fmt(stake) + &quot; &quot; + (conta ? conta.currency : &quot;&quot;));
    anunciarInicioOperacao(tradeAtivo, cfg);
    atualizarUI();
    return;
  }

  // validação conta real
  if (conta &amp;&amp; !conta.is_virtual &amp;&amp; !cfg.allowReal){
    logBot(&quot;Conta REAL detectada. Marque &#x27;autorizo operar em conta REAL&#x27; para enviar ordens.&quot;, &quot;err&quot;);
    tradeAtivo = null; colocando = false;
    return;
  }
  if (!autorizado){
    logBot(&quot;Não autorizado: informe o token.&quot;, &quot;err&quot;);
    tradeAtivo = null; colocando = false;
    return;
  }

  try {
    const pedido = montarPedido(cfg, cor, stake);
    const resp = await requisicao(pedido, 12000);
    const p = resp.proposal;
    if (!p || !p.id) throw new Error(&quot;Proposta inválida&quot;);

    const compra = await requisicao({ buy: p.id, price: p.ask_price }, 12000);
    const b = compra.buy;
    if (!b || !b.contract_id) throw new Error(&quot;Compra sem contract_id&quot;);

    tradeAtivo.contratoId = b.contract_id;
    tradeAtivo.entradaReal = Number(b.buy_price) || stake;
    tradeAtivo.payout = Number(b.payout) || 0;
    colocando = false;

    logBot(&quot;ORDEM &quot; + pedido.contract_type + &quot; · bloco &quot; + bi + &quot; idx &quot; + ii + &quot; · &quot; +
           (cor === &quot;G&quot; ? &quot;VERDE&quot; : &quot;VERMELHO&quot;) + &quot; · gale &quot; + galeNivel +
           &quot; (&quot; + rotuloStake(cfg, galeNivel) + &quot;) · &quot; +
           fmt(stake) + &quot; &quot; + conta.currency + &quot; · contrato &quot; + b.contract_id);
    anunciarInicioOperacao(tradeAtivo, cfg);
    enviar({ proposal_open_contract: 1, contract_id: b.contract_id, subscribe: 1 });
    atualizarUI();

  } catch(e){
    logBot(&quot;Falha ao enviar ordem (bloco &quot; + bi + &quot; idx &quot; + ii + &quot;): &quot; + e.message, &quot;err&quot;);
    // sem ordem NAO ha resultado -&gt; nao deixa a sequencia travada repetindo o mesmo valor
    tradeAtivo = null; colocando = false;
    seq = null;
  }
}

function aoCompra(){ /* tratado via await */ }

/* Alerta VISIVEL no painel de operacao quando a trava rejeita o vencimento
   devolvido pela Deriv. Mostra a duracao configurada e a duracao recebida. */
function avisoVencInvalido(durCfgMs, expiraMs, cfgDur, cfgUni){
  const box = $(&quot;confInicio&quot;);
  // garante o painel aberto para o alerta ser visto
  if (box &amp;&amp; !box.classList.contains(&quot;show&quot;) &amp;&amp; typeof reabrirConfInicio === &quot;function&quot;){
    try { reabrirConfInicio(); } catch(e){}
  }
  const el = $(&quot;ciAlertaVenc&quot;);
  if (!el) return;
  const recebido = fmtDuracao(Math.max(0, expiraMs - Date.now()));
  const configurado = fmtDuracao(durCfgMs);
  const rot = (cfgDur != null ? cfgDur : &quot;?&quot;) + &quot; &quot; + rotuloUnidadeCfg(cfgUni || &quot;&quot;);
  el.style.display = &quot;block&quot;;
  el.innerHTML =
    '&lt;span class=&quot;fechar&quot; onclick=&quot;fecharAvisoVenc()&quot; title=&quot;Fechar&quot;&gt;\u2715&lt;/span&gt;' +
    '&lt;span class=&quot;tit&quot;&gt;\u26a0 VENCIMENTO REJEITADO PELA TRAVA&lt;/span&gt;' +
    'A Deriv devolveu &lt;b&gt;' + recebido + '&lt;/b&gt; de vencimento, mas a duracao configurada e &lt;b&gt;' +
    configurado + '&lt;/b&gt; (' + rot + '). O cronometro foi mantido com o fim previsto pelo bot.';
}
function fecharAvisoVenc(){
  const el = $(&quot;ciAlertaVenc&quot;);
  if (el) el.style.display = &quot;none&quot;;
}

function aoContrato(c){
  if (!c) return;
  // resultado de contrato ja liberado pelo watchdog: so esquece a assinatura
  if (!tradeAtivo || String(c.contract_id) !== String(tradeAtivo.contratoId)){
    if ((c.is_sold || String(c.status) === &quot;won&quot; || String(c.status) === &quot;lost&quot;) &amp;&amp; c.contract_id){
      try { enviar({ forget: c.contract_id }); } catch(e){}
    }
    return;
  }
  if (!c.is_sold &amp;&amp; String(c.status) !== &quot;won&quot; &amp;&amp; String(c.status) !== &quot;lost&quot;) {
    // atualiza a stake real
    if (c.buy_price) tradeAtivo.stake = Number(c.buy_price);
    // usa o vencimento real do contrato quando a Deriv informar
    const de = numCampo(c.date_expiry) || numCampo(c.expiry_time);
    // TRAVA DE SEGURANCA: so aceita o vencimento da Deriv se ele cair numa
    // janela coerente com a duracao configurada para ESTA ordem. Sem isto, um
    // date_expiry fora de unidade (ex.: devolvido em ms) fazia o cronometro
    // mostrar um vencimento absurdo (ex.: 22:59).
    if (de){
      const expiraMs = Number(de) * 1000;
      const agora = Date.now();
      const cfgDur = (tradeAtivo.duracaoCfg != null) ? tradeAtivo.duracaoCfg : lerConfig().duracao;
      const cfgUni = tradeAtivo.unidadeCfg || lerConfig().duracaoUnidade;
      const durMs  = duracaoMs({ duracao: cfgDur, duracaoUnidade: cfgUni });
      const minMs  = agora - 120000;                 // tolera liquidacao em andamento
      const maxMs  = agora + durMs * 2 + 120000;     // duracao + folga de 2 min
      if (isFinite(expiraMs) &amp;&amp; expiraMs &gt;= minMs &amp;&amp; expiraMs &lt;= maxMs){
        tradeAtivo.expiraTs = expiraMs;
        fecharAvisoVenc();
      } else if (!tradeAtivo.avisouVenc){
        tradeAtivo.avisouVenc = true;
        logBot(&quot;\u26a0 Vencimento devolvido pela Deriv (&quot; + fmtDuracao(Math.max(0, expiraMs - agora)) +
               &quot;) fora da janela da duracao configurada (&quot; + fmtDuracao(durMs) +
               &quot;) - mantendo o fim previsto pelo bot.&quot;, &quot;err&quot;);
        avisoVencInvalido(durMs, expiraMs, cfgDur, cfgUni);
      }
    }
    return;
  }
  const ganhou = String(c.status) === &quot;won&quot;;
  const t = tradeAtivo;
  const bp = numCampo(c.buy_price);
  if (bp) t.stake = bp;
  t.lucroReal = lucroRealizado(c, t.stake);
  if (numCampo(c.payout)) t.payout = numCampo(c.payout);
  aplicarResultado(ganhou, t, &quot;REAL&quot;);
  tradeAtivo = null;
  try { enviar({ forget: c.id }); } catch(e){}
  // GALE AUTOMÁTICO: o resultado real pode chegar alguns segundos depois da
  // vela virar. Sem isto o bot só tentava o gale na PRÓXIMA abertura de vela
  // (ficando 1 vela atrasado). Aqui ele entra já na vela corrente.
  tentarGaleAgora();
}

/* GALE AUTOMÁTICO (real/demo): LOSS confirmado -&gt; entra imediatamente na
   vela seguinte do mesmo quadrante, respeitando &quot;GALE máximo (nível)&quot;. */
function tentarGaleAgora(){
  if (!rodando) return;
  const cfg = lerConfig();
  if (cfg.modo !== &quot;risefall&quot;) return;          // em ticks o GALE já é por tick
  if (!unidadeAtual || tradeAtivo || colocando) return;
  if (!seq) return;
  const galeMax = Math.min(cfg.gale, cfg.bloco - 1);
  if (seq.galeUsado &gt; galeMax) return;
  const info = indiceDeBlocoPelaEpoch(unidadeAtual.epoch);
  if (!info || info.bi !== seq.blockIndex) return;
  // se a vela do LOSS ainda está aberta, espera a virada (evita entrar 2x na mesma vela)
  if (info.ii &lt; seq.nextIndex) return;
  logBot(&quot;GALE &quot; + seq.galeUsado + &quot; · bloco &quot; + info.bi + &quot; · vela &quot; + (info.ii + 1) +
         &quot; de &quot; + cfg.bloco + &quot; · entrada imediata após o LOSS · &quot; +
         rotuloStake(cfg, seq.galeUsado), &quot;&quot;);
  executarOperacao(info.bi, info.ii, seq.galeUsado, seq.cor, seq.base, seq.devido);
}

/* ---------- Leitura segura dos campos (a API nova devolve strings) ---------- */
function numCampo(v){
  if (v === null || v === undefined || v === &quot;&quot;) return null;
  const n = Number(String(v).replace(&quot;,&quot;, &quot;.&quot;));
  return isFinite(n) ? n : null;
}

/*
  P&amp;L REALIZADO do contrato vendido.
  ATENÇÃO: o campo `profit` da Deriv e &quot;latest bid price minus buy price&quot; (P&amp;L NAO
  realizado). Usado depois do fecho, da valores absurdos (ex.: -900 numa stake de 1).
  O valor correto e sell_price - buy_price. Validamos tudo antes de aceitar.
*/
let avisouProfit = false;
function lucroRealizado(c, stake){
  const bp = numCampo(c.buy_price);
  const sp = numCampo(c.sell_price);
  const po = numCampo(c.payout);
  const pf = numCampo(c.profit);

  const candidatos = [];
  if (sp !== null &amp;&amp; bp !== null) candidatos.push(sp - bp);   // 1º: realizado
  if (po !== null &amp;&amp; bp !== null) candidatos.push(po - bp);   // 2º: payout - entrada
  if (pf !== null)                candidatos.push(pf);        // 3º: profit (nao realizado)

  // sanidade: uma stake de X nao pode virar um lucro/perda maior que 5X
  const limite = Math.max(1, Math.abs(stake)) * 5;
  for (const v of candidatos){
    if (isFinite(v) &amp;&amp; Math.abs(v) &lt;= limite) return v;
  }
  if (!avisouProfit &amp;&amp; pf !== null){
    avisouProfit = true;
    logBot(&quot;Aviso: a Deriv devolveu profit=&quot; + JSON.stringify(c.profit) +
           &quot; (fora do esperado para uma entrada de &quot; + fmt(stake) + &quot;). Usei o c\u00e1lculo pela stake. &quot; +
           &quot;buy_price=&quot; + JSON.stringify(c.buy_price) + &quot; sell_price=&quot; + JSON.stringify(c.sell_price) +
           &quot; payout=&quot; + JSON.stringify(c.payout), &quot;&quot;);
  }
  return null;   // deixa aplicarResultado usar a estimativa
}

/* ---------- Resultado ---------- */
function aplicarResultado(ganhou, t, origem){
  const cfg = lerConfig();
  const payout = cfg.payout / 100;
  const temReal = (typeof t.lucroReal === &quot;number&quot; &amp;&amp; isFinite(t.lucroReal));

  if (ganhou){
    const lucro = temReal ? r2(t.lucroReal) : r2(t.stake * payout);
    stats.lucro = r2(stats.lucro + lucro);
    stats.galeUso[t.gale] = (stats.galeUso[t.gale] || 0) + 1;
    perdaAcumulada = 0;
    seq = null;
    fecharBloco(t.blockIndex, true);        // BLOCO WIN (1 por quadrante)
    registrarLog(t, &quot;WIN&quot;, lucro, origenLabel(origem, cfg));
    anunciarFimOperacao(t, true, lucro);
  } else {
    const perda = temReal ? Math.abs(r2(t.lucroReal)) : t.stake;
    stats.lucro = r2(stats.lucro - perda);
    perdaAcumulada = r2(perdaAcumulada + perda);

    const galeMax = Math.min(cfg.gale, cfg.bloco - 1);
    if (seq &amp;&amp; t.gale &lt; galeMax){
      seq.nextIndex = t.index + 1;
      seq.galeUsado = t.gale + 1;
    } else {
      seq = null;
    }
    // só fecha o BLOCO como LOSS quando não há mais gale a fazer
    if (!seq) fecharBloco(t.blockIndex, false);
    registrarLog(t, &quot;LOSS&quot;, -perda, origenLabel(origem, cfg));
    anunciarFimOperacao(t, false, -perda);
  }
  // avanca o ciclo Masaniello (banca, vitorias e operacoes) quando esse e o modo
  if (cfg.money === &quot;MAS&quot;) masPasso(ganhou, t.stake);
  stats.ops++;
  atualizarUI();
  verificarLimites();
}

function origenLabel(origem, cfg){
  if (cfg.sim &amp;&amp; origem !== &quot;REAL&quot;) return &quot;SIM&quot;;
  if (cfg.sim) return &quot;SIM&quot;;
  // com token: rotula pelo tipo real da conta conectada
  if (conta &amp;&amp; conta.is_virtual) return &quot;DEMO&quot;;
  return &quot;REAL&quot;;
}

function registrarLog(t, resultado, lucro, modo){
  logs.push({
    n: logs.length + 1,
    hora: new Date().toLocaleString(&quot;pt-BR&quot;),
    blockIndex: t.blockIndex,
    index: t.index,
    sinal: t.cor === &quot;G&quot; ? &quot;VERDE&quot; : &quot;VERMELHO&quot;,
    gale: t.gale,
    stake: t.stake,
    resultado: resultado,
    lucro: lucro,
    banca: conta ? conta.balance : &quot;&quot;,
    modo: modo
  });
  renderLog();
}

/* =====================================================================
   TEMPO DA OPERAÇÃO — contagem regressiva + painel que fica aberto
   ===================================================================== */
function duracaoMs(cfg){
  cfg = cfg || lerConfig();
  const d = Math.max(1, Number(cfg.duracao) || 1);
  const u = cfg.duracaoUnidade;
  const fator = u === &quot;s&quot; ? 1000
              : u === &quot;m&quot; ? 60000
              : u === &quot;h&quot; ? 3600000
              : u === &quot;d&quot; ? 86400000
              : 1000;                       // ticks: estimativa (1 tick ~ 1s)
  return d * fator;
}
function fmtDuracao(ms){
  if (!isFinite(ms) || ms &lt;= 0) return &quot;00:00:00&quot;;
  let s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600);  s -= h * 3600;
  const m = Math.floor(s / 60);    s -= m * 60;
  const p = n =&gt; String(n).padStart(2, &quot;0&quot;);
  return (d &gt; 0 ? d + &quot;d &quot; : &quot;&quot;) + p(h) + &quot;:&quot; + p(m) + &quot;:&quot; + p(s);
}
function horaFmt(ts){ return new Date(Number(ts)).toLocaleTimeString(&quot;pt-BR&quot;, { hour12: false }); }
function rotuloUnidadeCfg(u){
  return u === &quot;t&quot; ? &quot;tick(s)&quot; : u === &quot;s&quot; ? &quot;segundo(s)&quot; : u === &quot;m&quot; ? &quot;minuto(s)&quot;
       : u === &quot;h&quot; ? &quot;hora(s)&quot; : &quot;dia(s)&quot;;
}

function anunciarInicioOperacao(t, cfg){
  const rest = Math.max(0, (t.expiraTs || 0) - Date.now());
  logBot(&quot;\u23f3 Operação iniciada &quot; + horaFmt(t.inicioTs) + &quot; · &quot; + (t.cor === &quot;G&quot; ? &quot;VERDE&quot; : &quot;VERMELHO&quot;) +
         &quot; · gale &quot; + t.gale + &quot; · vela &quot; + cfg.velaMin + &quot; min &quot; +
         &quot; · faltam &quot; + fmtDuracao(rest) + &quot; (fim previsto &quot; + horaFmt(t.expiraTs) + &quot;)&quot;, &quot;&quot;);
  ciPushOp(t);
  ciTick();
}
function anunciarFimOperacao(t, ganhou, lucro){
  const dur = t.inicioTs ? (Date.now() - t.inicioTs) : 0;
  logBot((ganhou ? &quot;\u2705&quot; : &quot;\u274c&quot;) + &quot; Operação finalizada &quot; + horaFmt(Date.now()) +
         &quot; · &quot; + (ganhou ? &quot;WIN&quot; : &quot;LOSS&quot;) + &quot; · &quot; + (lucro &gt;= 0 ? &quot;+&quot; : &quot;-&quot;) + fmt(Math.abs(lucro)) +
         &quot; · tempo da operação &quot; + fmtDuracao(dur), ganhou ? &quot;ok&quot; : &quot;err&quot;);
  ciUpdateOp(t, ganhou, lucro, dur);
  ciTick();
}

function ciPushOp(t){
  ciOps.push({ n: ciOps.length + 1, ref: t, inicioTs: t.inicioTs || Date.now(), expiraTs: t.expiraTs || 0,
               cor: t.cor, gale: t.gale, stake: t.stake, blockIndex: t.blockIndex, index: t.index,
               resultado: null, lucro: null, dur: null });
  if (ciOps.length &gt; 200) ciOps = ciOps.slice(-200);
  ciRenderOps();
  const box = $(&quot;confInicioOps&quot;); if (box) box.scrollTop = 0;
}
function ciUpdateOp(t, ganhou, lucro, dur){
  for (let i = ciOps.length - 1; i &gt;= 0; i--){
    if (ciOps[i].ref === t){ ciOps[i].resultado = ganhou ? &quot;WIN&quot; : &quot;LOSS&quot;; ciOps[i].lucro = lucro; ciOps[i].dur = dur; break; }
  }
  ciRenderOps();
}
function ciRenderOps(){
  const box = $(&quot;confInicioOps&quot;); if (!box) return;
  const count = $(&quot;ciOpsCount&quot;);
  if (count) count.textContent = ciOps.length + (ciOps.length === 1 ? &quot; operação&quot; : &quot; operações&quot;);
  if (!ciOps.length){ box.innerHTML = &#x27;&lt;div class=&quot;ciLiveVazio&quot;&gt;nenhuma operação ainda&lt;/div&gt;&#x27;; return; }
  box.innerHTML = ciOps.slice().reverse().map(function(o){
    const aberta = o.resultado == null;
    const cls = aberta ? &quot;aberta&quot; : (o.resultado === &quot;WIN&quot; ? &quot;win&quot; : &quot;loss&quot;);
    const cor = o.cor === &quot;G&quot; ? &quot;var(--green)&quot; : &quot;var(--red)&quot;;
    const sinal = o.cor === &quot;G&quot; ? &quot;VERDE&quot; : &quot;VERMELHO&quot;;
    let direita;
    if (aberta){
      direita = &#x27;&lt;div class=&quot;ciOpR&quot; style=&quot;color:var(--cyan)&quot;&gt;\u23f3 &#x27; +
                fmtDuracao(Math.max(0, o.expiraTs - Date.now())) + &#x27;&lt;/div&gt;&#x27;;
    } else {
      direita = &#x27;&lt;div class=&quot;ciOpR &#x27; + (o.lucro &gt;= 0 ? &quot;pos&quot; : &quot;neg&quot;) + &#x27;&quot;&gt;&#x27; + o.resultado + &#x27; · &#x27; +
                (o.lucro &gt;= 0 ? &quot;+&quot; : &quot;-&quot;) + fmt(Math.abs(o.lucro)) + &#x27;&lt;/div&gt;&#x27;;
    }
    return &#x27;&lt;div class=&quot;ciOp &#x27; + cls + &#x27;&quot;&gt;&#x27; +
      &#x27;&lt;div&gt;&lt;div style=&quot;font-weight:700&quot;&gt;#&#x27; + o.n + &#x27; · &#x27; + horaFmt(o.inicioTs) +
      &#x27; · &lt;span style=&quot;color:&#x27; + cor + &#x27;&quot;&gt;&#x27; + sinal + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;ciOpTag&quot;&gt;bloco &#x27; + o.blockIndex + &#x27; · idx &#x27; + o.index + &#x27; · gale &#x27; + o.gale +
      &#x27; · &#x27; + fmt(o.stake) + (o.dur != null ? (&#x27; · durou &#x27; + fmtDuracao(o.dur)) : &#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      direita + &#x27;&lt;/div&gt;&#x27;;
  }).join(&quot;&quot;);
}
/* Estatísticas de Resultados espelhadas no painel de operação (Lucro, WIN/LOSS
   por bloco, acerto, losses seguidos, máximo e total de operações). */
function ciRenderStats(){
  const box = $(&quot;ciStats&quot;); if (!box) return;
  const blocosAvaliados = stats.win + stats.loss;
  const pct = blocosAvaliados ? (stats.win / blocosAvaliados * 100) : 0;
  const itens = [
    [&quot;Lucro&quot;, (stats.lucro &gt;= 0 ? &quot;+&quot; : &quot;-&quot;) + fmt(Math.abs(stats.lucro)), stats.lucro &gt;= 0 ? &quot;pos&quot; : &quot;neg&quot;],
    [&quot;WIN (blocos)&quot;, String(stats.win), &quot;pos&quot;],
    [&quot;LOSS (blocos)&quot;, String(stats.loss), &quot;neg&quot;],
    [&quot;Acerto (blocos)&quot;, blocosAvaliados ? pct.toFixed(1) + &quot;%&quot; : &quot;—&quot;, &quot;neu&quot;],
    [&quot;Loss seg. (blocos)&quot;, String(stats.streakLoss), &quot;neg&quot;],
    [&quot;Máx. win seg. (blocos)&quot;, String(stats.maxWinStreak), &quot;pos&quot;],
    [&quot;Máx. loss seg. (blocos)&quot;, String(stats.maxLossStreak), &quot;neg&quot;],
    [&quot;Operações&quot;, String(stats.ops), &quot;&quot;]
  ];
  box.innerHTML = itens.map(function(it){
    return &#x27;&lt;div class=&quot;ciStat&quot;&gt;&lt;div class=&quot;ciStatK&quot;&gt;&#x27; + it[0] +
           &#x27;&lt;/div&gt;&lt;div class=&quot;ciStatV &#x27; + it[2] + &#x27;&quot;&gt;&#x27; + it[1] + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  }).join(&quot;&quot;);
}

/* Cartões ricos de quadrante (anterior/atual) espelhados no painel de operação,
   no mesmo estilo do painel: letra, data/hora, posição, ENTRADA/LUCRO e GALE. */
function ciLinhaQuadrante(arr){
  if (!arr || !arr.length) return &#x27;&lt;span class=&quot;ciQcVazio&quot;&gt;aguardando velas…&lt;/span&gt;&#x27;;
  const bi = arr[0].bi;
  const ops = logs.filter(function(l){ return l.blockIndex === bi; }).sort(function(a,b){ return a.index - b.index; });
  const ultima = ops.length ? ops[ops.length-1] : null;
  const res = ultima ? ultima.resultado : null;
  const galePos = (ultima &amp;&amp; ultima.gale &gt; 0) ? ultima.index : -1;
  const emAndamento = !!(tradeAtivo &amp;&amp; tradeAtivo.blockIndex === bi);
  const cards = arr.map(function(u){

    for (let i = 0; i &lt; ops.length; i++){ if (ops[i].index === u.posVela){ op = ops[i]; break; } }
    if (!op &amp;&amp; tradeAtivo &amp;&amp; tradeAtivo.blockIndex === bi &amp;&amp; tradeAtivo.index === u.posVela) op = tradeAtivo;
    const dt = new Date(Number(u.epoch) * 1000);

    if (op &amp;&amp; op.lucro != null) extra += &#x27;&lt;div class=&quot;ap &#x27; + (op.lucro &gt;= 0 ? &quot;win&quot; : &quot;loss&quot;) + &#x27;&quot;&gt;LUCRO R$ &#x27; + fmt(op.lucro) + &#x27;&lt;/div&gt;&#x27;;
    return &#x27;&lt;div class=&quot;ciQv&#x27; + (ehGale ? &quot; gale&quot; : &quot;&quot;) + &#x27;&quot;&gt;&#x27; +
      &#x27;&lt;div class=&quot;q &#x27; + c + &#x27;&quot;&gt;&#x27; + c + &#x27;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;t&quot;&gt;&#x27; + dd + &#x27;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;t&quot;&gt;&#x27; + hh + &#x27;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;n&quot;&gt;&#x27; + (u.posVela + 1) + &#x27;&lt;/div&gt;&#x27; + extra + &#x27;&lt;/div&gt;&#x27;;
  }).join(&quot;&quot;);
  let rodape = &quot;&quot;;
  if (emAndamento){
    rodape = &#x27;&lt;div class=&quot;ciQcRes&quot;&gt;⏳ em andamento&lt;/div&gt;&#x27;;
  } else if (res){
    rodape = &#x27;&lt;div class=&quot;ciQcRes &#x27; + (res === &quot;WIN&quot; ? &quot;win&quot; : &quot;loss&quot;) + &#x27;&quot;&gt;&#x27; +
      (res === &quot;WIN&quot; ? &quot;✅ WIN&quot; : &quot;❌ LOSS&quot;) +
      (galePos &gt;= 0 ? &quot; · GALE &quot; + ultima.gale : &quot;&quot;) + &#x27;&lt;/div&gt;&#x27;;
  }
  return &#x27;&lt;div class=&quot;ciQcRow&quot;&gt;&#x27; + cards + &#x27;&lt;/div&gt;&#x27; + rodape;
}
function ciRenderQuadrantes(){
  const baEl = $(&quot;ciQcAnterior&quot;), bcEl = $(&quot;ciQcAtual&quot;);
  if (!baEl &amp;&amp; !bcEl) return;
  const cfg = lerConfig();
  if (cfg.modo !== &quot;risefall&quot;){
    const msg = &#x27;&lt;span class=&quot;ciQcVazio&quot;&gt;quadrante só no modo VELAS&lt;/span&gt;&#x27;;
    if (baEl) baEl.innerHTML = msg;
    if (bcEl) bcEl.innerHTML = msg;
    return;
  }
  const lista = unidades.map(function(u, i){ return Object.assign({}, u, { cor: corDaUnidade(u, i &gt; 0 ? unidades[i-1] : null) }); });
  const pos = lista.map(function(u){ return indiceDeBlocoSeConhecido(u.epoch); });
  let ultBi = null;
  for (let i = pos.length - 1; i &gt;= 0; i--){ if (pos[i]){ ultBi = pos[i].bi; break; } }
  const atual = [], anterior = [];
  if (ultBi !== null){
    lista.forEach(function(u, i){
      const p = pos[i]; if (!p) return;
      if (p.bi === ultBi) atual.push(Object.assign({}, u, { posVela: p.ii, bi: p.bi }));
      else if (p.bi === ultBi - 1) anterior.push(Object.assign({}, u, { posVela: p.ii, bi: p.bi }));
    });
  }
  if (baEl) baEl.innerHTML = ciLinhaQuadrante(anterior);
  if (bcEl) bcEl.innerHTML = ciLinhaQuadrante(atual);
}

/* =====================================================================
   WATCHDOG — libera contrato real sem resultado e detecta WS parado.
   ---------------------------------------------------------------------
   Sem isto o bot ficava &quot;operação em andamento&quot; para sempre quando a
   mensagem de resultado do contrato não voltava (socket meio-aberto ou
   assinatura perdida) e não entrava mais em nenhum bloco.
   ===================================================================== */
function watchdog(){
  if (!rodando) return;
  const cfg = lerConfig();

  // 1) contrato real sem resultado: libera a sequencia e volta a operar
  if (tradeAtivo &amp;&amp; !tradeAtivo.sim){
    const idadeMs = Date.now() - (tradeAtivo.inicioTs || Date.now());
    const limiteMs = duracaoMs(cfg) + 90000;
    if (idadeMs &gt; limiteMs){
      logBot(&quot;⚠ Contrato &quot; + (tradeAtivo.contratoId || &quot;?&quot;) + &quot; sem resultado após &quot; +
             fmtDuracao(idadeMs) + &quot; — liberando a sequência para o bot voltar a operar.&quot;, &quot;err&quot;);
      try { if (tradeAtivo.contratoId) enviar({ forget: tradeAtivo.contratoId }); } catch(e){}
      tradeAtivo = null; colocando = false; seq = null;
    }
  }

  // 2) WebSocket parado (socket meio-aberto): nenhuma mensagem há muito tempo
  if (conectado &amp;&amp; ultimaMsgTs &amp;&amp; (Date.now() - ultimaMsgTs) &gt; 60000){
    if (!watchdogAvisou){
      watchdogAvisou = true;
      logBot(&quot;⚠ Nenhuma mensagem da Deriv há &quot; + Math.round((Date.now() - ultimaMsgTs) / 1000) +
             &quot;s — forçando reconexão.&quot;, &quot;err&quot;);
      try { ws.close(); } catch(e){}
    }
  } else {
    watchdogAvisou = false;
  }
}

function verificarLimites(){

  if (motivo) pararBot(motivo);
}

/* ---------- Diagnostico: pede uma proposta (NAO compra nada) ---------- */
async function testarProposta(){
  const cfg = lerConfig();
  if (!conectado){ logBot(&quot;Conecte-se primeiro.&quot;, &quot;err&quot;); return; }
  if (!autorizado){ logBot(&quot;Precisa de token (PAT) para testar proposta.&quot;, &quot;err&quot;); return; }
  $(&quot;btnTeste&quot;).disabled = true;
  logBot(&quot;Testando proposta &quot; + montarPedido(cfg, &quot;G&quot;, Math.max(0.35, cfg.entrada)).contract_type + &quot; em &quot; + cfg.symbol + &quot; …&quot;, &quot;&quot;);
  try {
    const pedido = montarPedido(cfg, &quot;G&quot;, Math.max(0.35, cfg.entrada));
    const resp = await requisicao(pedido, 12000);
    const p = resp.proposal;
    logBot(&quot;✅ Proposta OK · payout &quot; + fmt(p.payout) + &quot; · custo &quot; + fmt(p.ask_price) + &quot; &quot; + conta.currency +
           &quot; (nada foi comprado).&quot;, &quot;ok&quot;);
  } catch(e){
    logBot(&quot;❌ Proposta falhou: &quot; + e.message, &quot;err&quot;);
  } finally {
    $(&quot;btnTeste&quot;).disabled = false;
  }
}

      if (el.value !== src.value) el.value = src.value;

function ciSyncCampo(srcId, valor, origem){
  const src = $(srcId);
  if (src &amp;&amp; src.value !== valor){ src.value = valor; try { src.dispatchEvent(new Event(&quot;change&quot;, { bubbles: true })); } catch(e){} }
  (ciClones[srcId] || []).forEach(function(el){ if (el !== origem &amp;&amp; el.value !== valor) el.value = valor; });
  setTimeout(ciRefrescarClones, 0);
}
function ciCriarCampo(srcId){
  const src = $(srcId);

  const cl = src.cloneNode(true);
  cl.id = &quot;ci_&quot; + srcId;
  cl.removeAttribute(&quot;name&quot;);
  cl.classList.add(&quot;ciCfgInput&quot;);
  cl.addEventListener(&quot;change&quot;, function(){ ciSyncCampo(srcId, cl.value, cl); });
  (ciClones[srcId] = ciClones[srcId] || []).push(cl);

/* Arrastar o painel pelo cabeçalho (mouse e toque). */
function ciIniciarArrasto(){
  const h = $(&quot;ciHeader&quot;); if (!h) return;
  const el = $(&quot;confInicio&quot;);
  const box = el ? el.querySelector(&quot;.confInicioBox&quot;) : null;
  if (!box) return;
  let arrastando = false, sx = 0, sy = 0, ox = 0, oy = 0;
  function ini(e){
    if (!el.classList.contains(&quot;running&quot;)) return;
    if (e.target &amp;&amp; e.target.closest &amp;&amp; e.target.closest(&quot;button&quot;)) return;
    const p = e.touches ? e.touches[0] : e;
    const r = box.getBoundingClientRect();
    box.style.left = r.left + &quot;px&quot;;
    box.style.top = r.top + &quot;px&quot;;
    box.style.right = &quot;auto&quot;;
    box.style.bottom = &quot;auto&quot;;
    arrastando = true; sx = p.clientX; sy = p.clientY; ox = r.left; oy = r.top;
    if (e.preventDefault) e.preventDefault();
  }
  function mov(e){
    if (!arrastando) return;
    const p = e.touches ? e.touches[0] : e;
    const r = box.getBoundingClientRect();
    let nl = ox + (p.clientX - sx);
    let nt = oy + (p.clientY - sy);
    nl = Math.max(6, Math.min(window.innerWidth - r.width - 6, nl));
    nt = Math.max(6, Math.min(window.innerHeight - r.height - 6, nt));
    box.style.left = nl + &quot;px&quot;;
    box.style.top = nt + &quot;px&quot;;
    if (e.preventDefault) e.preventDefault();
  }
  function fim(){ arrastando = false; }
  h.addEventListener(&quot;mousedown&quot;, ini);
  h.addEventListener(&quot;touchstart&quot;, ini, { passive: false });
  window.addEventListener(&quot;mousemove&quot;, mov);
  window.addEventListener(&quot;touchmove&quot;, mov, { passive: false });
  window.addEventListener(&quot;mouseup&quot;, fim);
  window.addEventListener(&quot;touchend&quot;, fim);
}

function iniciarBotAgora(){
  const cfg = lerConfig();
  if (!conectado){ logBot(&quot;Conexão caiu antes de confirmar. Reconecte.&quot;, &quot;err&quot;); return; }

  rodando = true;
  iniciarAudio();                          // libera o som do alerta (precisa de 1 clique)

  // ENTRADA JA NO PROXIMO BLOCO ---------------------------------------
  // Se o bot foi ligado no comeco da VELA 1 do quadrante novo (o anterior
  // acabou de fechar), avalia a entrada AGORA. Sem isso a vela 1 abria
  // antes do clique em INICIAR e o bot esperava um quadrante inteiro para
  // operar. A janela curta evita entrar com a vela 1 ja avancada, o que
  // desalinharia a duracao do contrato do resto do bloco.
  try {
    if (cfg.modo === &quot;risefall&quot; &amp;&amp; unidadeAtual &amp;&amp; !tradeAtivo &amp;&amp; !colocando &amp;&amp; !seq){
      const info0 = indiceDeBlocoSeConhecido(unidadeAtual.epoch) ||
                    indiceDeBlocoPelaEpoch(unidadeAtual.epoch);
      const idade  = (Date.now() / 1000) - Number(unidadeAtual.epoch);
      const janela = Math.min(60, Math.max(15, (cfg.velaMin || 5) * 60 * 0.25));
      if (info0 &amp;&amp; info0.ii === 0 &amp;&amp; idade &gt;= 0 &amp;&amp; idade &lt;= janela){
        logBot(&quot;\u23f1 Ligado na vela 1 do bloco &quot; + info0.bi +
               &quot; (quadrante anterior ja fechou) — avaliando a entrada deste bloco agora.&quot;, &quot;ok&quot;);
        aposAbrirUnidade();
      }
    }
  } catch(e){}
  if (cfg.money === &quot;MAS&quot;) masReset();   // comeca um ciclo Masaniello novo (N entradas / W vitorias)
  $(&quot;btnStart&quot;).disabled = true;
  $(&quot;btnStop&quot;).disabled = false;
  toggleConfig(true);
  const rotuloModo = cfg.sim ? &quot;SIMULAÇÃO&quot; : (conta &amp;&amp; conta.is_virtual ? &quot;DEMO (conta virtual)&quot; : &quot;REAL&quot;);
  logBot(&quot;BOT INICIADO · &quot; + cfg.symbol + &quot; · bloco &quot; + cfg.bloco + &quot; · gale &quot; + cfg.gale +
         &quot; · &quot; + rotuloModo + &quot; · âncora &quot; +
         (cfg.modo === &quot;risefall&quot;
            ? (cfg.ancora === &quot;dia&quot; ? &quot;00:00 UTC (igual painel)&quot; : &quot;INÍCIO DA SESSÃO&quot;)
            : &quot;sessão (ticks)&quot;), &quot;ok&quot;);

  // AVISO DE ALINHAMENTO COM O PAINEL (só faz sentido em velas) -------------
  // O painel corta por POSIÇÃO as velas do DIA (00:00 UTC) de N em N. Com a
  // âncora em &quot;Início da sessão&quot; o bot ancora num minuto qualquer e os
  // quadrantes caem fora do grid do painel (ex.: início 22:54 em vez de 22:55).
  if (cfg.modo === &quot;risefall&quot; &amp;&amp; cfg.ancora !== &quot;dia&quot;){
    logBot(&quot;⚠ ALINHAMENTO: a âncora está em \&quot;Início da sessão\&quot;. O painel corta por DIA (00:00 UTC), &quot; +
           &quot;então os quadrantes vão começar em horários que o painel não mostra. &quot; +
           &quot;Mude Âncora do bloco (velas) para \&quot;00:00 UTC (igual painel)\&quot; e reconecte.&quot;, &quot;err&quot;);
  } else if (cfg.modo === &quot;risefall&quot;){
    logBot(&quot;Conferência do painel: com bloco &quot; + cfg.bloco + &quot; e âncora 00:00 UTC, os quadrantes começam &quot; +
           &quot;sempre em :&quot; + String(cfg.bloco % 60).padStart(2, &quot;0&quot;) +
           &quot;, :&quot; + String((cfg.bloco * 2) % 60).padStart(2, &quot;0&quot;) + &quot;… — veja a conferência no card 5.0.&quot;, &quot;&quot;);
  }
  atualizarUI();
}

let _audioCtx = null;

function iniciarAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    _audioCtx = _audioCtx || new AC();
    if (_audioCtx.state === &quot;suspended&quot;) _audioCtx.resume();
  }catch(e){}
}

function tocarAlerta(tipo){
  try{
    iniciarAudio();
    const ctx = _audioCtx;
    if (!ctx) return;
    // loss = bipes descendentes (mais graves) · win = ascendentes · stop = neutro
    const base = tipo === &quot;loss&quot; ? [880, 720, 560] : (tipo === &quot;win&quot; ? [660, 880, 1180] : [740, 740, 560]);
    const reps = tipo === &quot;loss&quot; ? 4 : 3;
    let t = ctx.currentTime + 0.02;
    for (let r = 0; r &lt; reps; r++){
      base.forEach(function(f){
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = &quot;square&quot;;
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.42, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.30);
        t += 0.34;
      });
      t += 0.16;
    }
  }catch(e){}
}

function falarAlerta(texto){
  try{
    if (!(&quot;speechSynthesis&quot; in window)) return;
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = &quot;pt-BR&quot;; u.rate = 1; u.pitch = 1; u.volume = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

           &quot;&lt;/div&gt;&lt;div class=\&quot;v &quot; + (cls || &quot;&quot;) + &quot;\&quot;&gt;&quot; + v + &quot;&lt;/div&gt;&lt;/div&gt;&quot;;
  }
  return ar(&quot;Lucro&quot;, &quot;R$ &quot; + fmt(stats.lucro), stats.lucro &gt;= 0 ? &quot;pos&quot; : &quot;neg&quot;) +
         ar(&quot;Wins&quot;, stats.win, &quot;pos&quot;) +
         ar(&quot;Losses&quot;, stats.loss, &quot;neg&quot;) +
         ar(&quot;Ops&quot;, stats.ops, &quot;&quot;);
}

function alertaParada(motivo){
  const m = String(motivo || &quot;&quot;);
  let tipo = &quot;stop&quot;, titulo = &quot;BOT PARADO&quot;, icone = &quot;⏹️&quot;;
  if (/STOP LOSS|losses seguidos/i.test(m)){ tipo = &quot;loss&quot;; titulo = &quot;STOP LOSS&quot;; icone = &quot;🛑&quot;; }

  else if (/Masaniello/i.test(m)){ tipo = &quot;win&quot;; titulo = &quot;CICLO CONCLUÍDO&quot;; icone = &quot;✅&quot;; }

  const chk = $(&quot;cfgAlerta&quot;);
  if (!chk || chk.checked){
    tocarAlerta(tipo);
    falarAlerta(tipo === &quot;loss&quot; ? &quot;Stop loss atingido&quot; : (tipo === &quot;win&quot; ? &quot;Stop win atingido&quot; : &quot;Bot parado&quot;));

  const box = $(&quot;alertaStop&quot;);

}

/* =====================================================================
   AVISO DE TROCA DE CONTA (REAL / DEMO)
   ---------------------------------------------------------------------
   Mostra uma tela cheia sempre que a conta usada muda de natureza:
   REAL → DEMO ou DEMO → REAL. A troca só segue depois da confirmação;
   CANCELAR devolve o dropdown para a conta anterior.
   ===================================================================== */
let _avisoContaAcao = null;       // callback executado ao confirmar
let _avisoContaCancelar = null;   // callback executado ao cancelar
let _avisoContaTimer = null;
let _trocaContaJaAvisada = false; // evita avisar duas vezes na mesma troca

function tipoDaConta(a){
  if (!a) return &quot;&quot;;
  const t = (a.account_type !== undefined) ? a.account_type : (a.is_virtual ? &quot;demo&quot; : &quot;real&quot;);
  return String(t).toLowerCase() === &quot;demo&quot; ? &quot;DEMO&quot; : &quot;REAL&quot;;
}

function fecharAvisoConta(){
  clearInterval(_avisoContaTimer);
  const box = $(&quot;avisoConta&quot;);
  if (box) box.className = &quot;avisoConta&quot;;
  _avisoContaAcao = null;
  _avisoContaCancelar = null;
}

function confirmarTrocaConta(){
  const acao = _avisoContaAcao;
  fecharAvisoConta();
  if (typeof acao === &quot;function&quot;) acao();
}

function cancelarTrocaConta(){
  const cancelar = _avisoContaCancelar;
  fecharAvisoConta();
  if (typeof cancelar === &quot;function&quot;) cancelar();
}

/* deTipo / paraTipo: &quot;DEMO&quot; ou &quot;REAL&quot; · deLogin / paraLogin: ids das contas */
function avisarTrocaConta(deTipo, paraTipo, deLogin, paraLogin, opts){
  opts = opts || {};
  const box = $(&quot;avisoConta&quot;);
  if (!box){ if (typeof opts.onConfirmar === &quot;function&quot;) opts.onConfirmar(); return; }

  clearInterval(_avisoContaTimer);
  _avisoContaAcao = opts.onConfirmar || null;
  _avisoContaCancelar = opts.onCancelar || null;

  const paraReal = (paraTipo === &quot;REAL&quot;);
  box.className = &quot;avisoConta show &quot; + (paraReal ? &quot;paraReal&quot; : &quot;paraDemo&quot;);

  $(&quot;avisoContaIcone&quot;).textContent = paraReal ? &quot;🚨&quot; : &quot;🔄&quot;;
  $(&quot;avisoContaTitulo&quot;).textContent = paraReal ? &quot;ENTRANDO EM CONTA REAL&quot; : &quot;TROCANDO PARA CONTA DEMO&quot;;

  function tagConta(tipo, login){
    if (!tipo) return &#x27;&lt;span class=&quot;tagConta de&quot;&gt;?&lt;/span&gt;&#x27;;
    return &#x27;&lt;span class=&quot;tagConta &#x27; + (tipo === &quot;REAL&quot; ? &quot;real&quot; : &quot;demo&quot;) + &#x27;&quot;&gt;&#x27; + tipo +
           (login ? &quot; · &quot; + login : &quot;&quot;) + &#x27;&lt;/span&gt;&#x27;;
  }
  $(&quot;avisoContaFluxo&quot;).innerHTML = tagConta(deTipo, deLogin) +
    &#x27;&lt;span class=&quot;seta&quot;&gt;➡&lt;/span&gt;&#x27; + tagConta(paraTipo, paraLogin);

  $(&quot;avisoContaTexto&quot;).innerHTML = paraReal
    ? &quot;Atenção: a próxima conexão vai usar uma &lt;b&gt;CONTA REAL&lt;/b&gt;. As entradas passam a usar &lt;b&gt;dinheiro de verdade&lt;/b&gt; — cada perda é real e o GALE pode zerar a banca.&lt;br&gt;&lt;br&gt;Confirme apenas se você tem certeza e autorizou operar em conta real.&quot;
    : &quot;A próxima conexão vai usar uma &lt;b&gt;CONTA DEMO&lt;/b&gt; (dinheiro virtual). Ótimo para testar a estratégia sem risco.&lt;br&gt;&lt;br&gt;Nenhuma ordem em conta real será enviada enquanto estiver na DEMO.&quot;;

  const btnOK = $(&quot;avisoContaOK&quot;);
  if (btnOK){
    btnOK.textContent = paraReal ? &quot;ENTENDI, USAR CONTA REAL&quot; : &quot;OK, USAR CONTA DEMO&quot;;
    btnOK.className = paraReal ? &quot;btn-red&quot; : &quot;btn-cyan&quot;;
  }
  if ($(&quot;avisoContaCancel&quot;)) $(&quot;avisoContaCancel&quot;).style.display = opts.onCancelar ? &quot;&quot; : &quot;none&quot;;

  if (!opts.silencioso){
    tocarAlerta(paraReal ? &quot;loss&quot; : &quot;stop&quot;);
    falarAlerta(paraReal ? &quot;Atenção. Trocando para conta real.&quot; : &quot;Trocando para conta demo.&quot;);
  }

  const auto = $(&quot;avisoContaAuto&quot;);
  if (opts.autoSegundos &amp;&amp; !opts.onCancelar){
    let resto = opts.autoSegundos;
    auto.textContent = &quot;Continuando em &quot; + resto + &quot;s…&quot;;
    _avisoContaTimer = setInterval(function(){
      resto--;
      if (resto &lt;= 0){ confirmarTrocaConta(); return; }
      auto.textContent = &quot;Continuando em &quot; + resto + &quot;s…&quot;;
    }, 1000);
  } else {
    auto.textContent = opts.onCancelar ? &quot;A troca só acontece depois da confirmação.&quot; : &quot;&quot;;
  }
}

/* Avisa quando a conexão usa um tipo de conta diferente do último usado */
function avisarMudancaDeContaSalva(){
  if (!conta) return;
  const tipoAtual = conta.is_virtual ? &quot;DEMO&quot; : &quot;REAL&quot;;

function numDur(s){ const m = String(s == null ? &quot;&quot; : s).match(/(\d+)/); return m ? parseInt(m[1], 10) : null; }
function uniDur(s){ const m = String(s == null ? &quot;&quot; : s).match(/^\s*(\d+)\s*([a-zA-Z])?/); return (m &amp;&amp; m[2]) ? m[2].toLowerCase() : null; }

/* Converte uma duração da Deriv (&quot;1m&quot;, &quot;365d&quot;, &quot;5t&quot;) para a unidade da tela.
   Sem isto, um máximo &quot;1d&quot; virava max = 1 e travava qualquer duração &gt; 1. */
function durEmUnidade(v, alvo){
  const m = String(v == null ? &quot;&quot; : v).match(/^\s*(\d+(?:[.,]\d+)?)\s*([a-zA-Z])?/);
  if (!m) return null;
  const n = parseFloat(String(m[1]).replace(&quot;,&quot;, &quot;.&quot;));
  const u = (m[2] || &quot;m&quot;).toLowerCase();
  if (!isFinite(n)) return null;
  const fator = { s: 1, m: 60, h: 3600, d: 86400 };
  const origem = (u === &quot;t&quot;) ? 0 : fator[u];
  const destino = fator[alvo];
  if (origem === 0 || destino == null) return Math.max(1, Math.floor(n)); // ticks
  return Math.max(1, Math.floor(n * origem / destino));
}

function aoContractsFor(cf){
  contratosDisponiveis = (cf &amp;&amp; cf.available) || [];
  aplicarContratosDisponiveis();
}

/* linhas de limite (duracao, barreira, digitos) do contrato no ativo atual */
function limitesDisponiveis(f){
  if (!contratosDisponiveis.length) return null;
  const it = contratosDisponiveis.find(a =&gt; a.contract_type === f.g) ||
             contratosDisponiveis.find(a =&gt; a.contract_type === f.v);
  if (!it) return null;
  return {
    item: it,
    min: numDur(it.min_contract_duration),
    max: numDur(it.max_contract_duration),
    unidade: uniDur(it.max_contract_duration) || uniDur(it.min_contract_duration),
    expiry: it.expiry_type,
    lastDigit: it.last_digit_range,
    barrier: it.barrier,
    nBarriers: it.barriers
  };
}

function aplicarContratosDisponiveis(){
  const cfg = lerConfig();
  const disp = new Set(contratosDisponiveis.map(a =&gt; a.contract_type));
  if (!disp.size) return;

  let lista = TIPOS.filter(t =&gt; disp.has(t.g) &amp;&amp; disp.has(t.v));
  if (!lista.length) lista = TIPOS.filter(t =&gt; disp.has(t.g) || disp.has(t.v));
  if (!lista.length){ logBot(&quot;Nenhum contrato desta lista disponível em &quot; + cfg.symbol + &quot;.&quot;, &quot;err&quot;); return; }

  const sel = $(&quot;cfgContrato&quot;);
  const atual = sel.value;
  sel.innerHTML = lista.map(t =&gt; &#x27;&lt;option value=&quot;&#x27; + t.id + &#x27;&quot;&gt;&#x27; + t.nome + &#x27;&lt;/option&gt;&#x27;).join(&quot;&quot;);
  sel.value = lista.some(t =&gt; t.id === atual) ? atual : lista[0].id;

  const antes = cfg.contrato;
  onMudarContrato();
  $(&quot;hintContrato&quot;).textContent = &quot;✅ &quot; + lista.length + &quot; de &quot; + TIPOS.length +
    &quot; tipos disponíveis para &quot; + cfg.symbol + &quot;.  &quot; + ($(&quot;hintContrato&quot;).textContent || &quot;&quot;);

  if (antes &amp;&amp; antes !== sel.value)
    logBot(&quot;O tipo antes escolhido não existe em &quot; + cfg.symbol + &quot;. Troquei para &quot; + familiaAtual(lerConfig()).nome + &quot;.&quot;, &quot;err&quot;);
  else
    logBot(lista.length + &quot; tipo(s) de contrato disponíveis para &quot; + cfg.symbol + &quot;.&quot;, &quot;ok&quot;);
}

/* ---------- Tipo de contrato: habilita os campos necessarios ---------- */
function onMudarContrato(){
  const cfg = lerConfig();
  const f = familiaAtual(cfg);

  $(&quot;wrapBarreira&quot;).style.display     = (f.barrier || f.barrAbs || f.barr2) ? &quot;&quot; : &quot;none&quot;;
  $(&quot;wrapBarreira2&quot;).style.display    = f.barr2 ? &quot;&quot; : &quot;none&quot;;
  $(&quot;wrapMultContrato&quot;).style.display = f.mult ? &quot;&quot; : &quot;none&quot;;
  $(&quot;wrapGrowth&quot;).style.display       = f.growth ? &quot;&quot; : &quot;none&quot;;

  // ESTRATÉGIA: contratos de DIREÇÃO (CALL/PUT) ficam SEMPRE em &quot;Maioria da Cor&quot;.
  const selEstr = $(&quot;cfgEstrategia&quot;);
  if (selEstr){
    if (f.direcao){
      selEstr.value = &quot;maioria&quot;;
      selEstr.disabled = true;
      selEstr.classList.add(&quot;campo-inativo&quot;);
      $(&quot;hintEstrategia&quot;).innerHTML = &quot;🔒 Travada em &lt;b&gt;Maioria da Cor&lt;/b&gt;: contrato de direção (CALL/PUT) usa sempre a maioria G/V do bloco anterior — em velas e em ticks.&quot;;
    } else {
      selEstr.disabled = rodando;
      selEstr.classList.remove(&quot;campo-inativo&quot;);
      $(&quot;hintEstrategia&quot;).innerHTML = &quot;Escolha a cor por &lt;b&gt;Maioria da Cor&lt;/b&gt; (direção do preço) ou pela &lt;b&gt;regra de dígito&lt;/b&gt; do contrato (só vale com o bloco em ticks).&quot;;
    }
  }

  const semDuracao = (f.dur === &quot;none&quot;);

  // A duração não é mais um campo editável. Para contratos de velas,
  // ela vem diretamente de Tamanho da vela (cfgVelaMin).
  if (!semDuracao){
    const unidade = (cfg.modo === &quot;digits&quot;) ? &quot;t&quot; : &quot;m&quot;;
    // Mantém a configuração interna sincronizada com a unidade do bloco.
    cfg.duracaoUnidade = unidade;
  }
  if (f.barrier &amp;&amp; f.barrier.g) $(&quot;cfgBarreira&quot;).value = f.barrier.g;

  // limites reais devolvidos pela Deriv para este ativo
  const lim = semDuracao ? null : limitesDisponiveis(f);
  // digitos: usa a faixa de digitos que a Deriv informa, quando existir
  if (f.barrier &amp;&amp; lim &amp;&amp; Array.isArray(lim.lastDigit) &amp;&amp; lim.lastDigit.length){
    const lo = lim.lastDigit[0];
    const hi = lim.lastDigit[lim.lastDigit.length - 1];
    if (f.id === &quot;matchdiff&quot; &amp;&amp; $(&quot;cfgBarreira&quot;).value === &quot;&quot;) $(&quot;cfgBarreira&quot;).value = String(lo);
    if (f.id === &quot;digits&quot; &amp;&amp; lim.nBarriers === 1) $(&quot;cfgBarreira&quot;).title = &quot;faixa de dígitos: &quot; + lo + &quot; a &quot; + hi;
  }

  $(&quot;hintContrato&quot;).textContent = f.hint || &quot;&quot;;
  atualizarUI();
}

/* ---------- Previa do stake: mostra o modo escolhido em acao ---------- */
/* Quantos niveis de GALE cabem no bloco com essa duracao?
   Cada entrada ocupa (duracao + 1) itens: o contrato expira `duracao` itens
   depois, a Deriv manda o resultado e o GALE entra no item SEGUINTE.
   Ou seja, o nivel k cai no item k*(duracao+1), e o ultimo precisa comecar
   antes do bloco acabar. Medido no motor: com duracao 1 e bloco 5 o GALE
   chega ao nivel 2; com duracao 3 e bloco 8 chega so ao nivel 1. */
/* Descarta a sequencia explicando o motivo quando ainda havia GALE pendente. */
function descartarSequencia(motivo){
  const cfg = lerConfig();
  const galeMax = Math.min(cfg.gale, cfg.bloco - 1);
  const biSeq = seq ? seq.blockIndex : null;
  const tevePerda = !!(seq &amp;&amp; seq.galeUsado &gt; 0);
  if (seq &amp;&amp; seq.galeUsado &gt; 0){
    const passo = passoGale(cfg);
    const inicio = seq.idxInicial || 0;
    const sobra = Math.max(0, cfg.bloco - 1 - inicio);       // itens ainda disponiveis
    const cabiam = Math.floor(sobra / passo);                // gales que cabiam dai pra frente
    let msg = &quot;\u26a0\ufe0f GALE &quot; + seq.galeUsado + &quot; do bloco &quot; + seq.blockIndex + &quot; perdido (&quot; + motivo + &quot;). &quot; +
              &quot;Com dura\u00e7\u00e3o &quot; + cfg.duracao + &quot; cada entrada ocupa &quot; + passo + &quot; itens, ent\u00e3o do item &quot; +
              inicio + &quot; at\u00e9 o fim do bloco (&quot; + (cfg.bloco - 1) + &quot;) cabiam &quot; + cabiam + &quot; gale(s).&quot;;
    if (cabiam &lt; galeMax){
      msg += &quot; Para alcan\u00e7ar o GALE &quot; + galeMax + &quot;: bloco \u2265 &quot; + (passo * galeMax + 1) +
             (inicio &gt; 0 ? &quot; E a entrada come\u00e7ando no item 0 (o idx 0 passou com opera\u00e7\u00e3o aberta)&quot; : &quot;&quot;) +
             &quot;, ou dura\u00e7\u00e3o \u2264 &quot; + Math.max(1, Math.floor((cfg.bloco - 1) / Math.max(1, galeMax)) - 1) +
             &quot; &quot; + cfg.duracaoUnidade + &quot;, ou marcar \ud83d\udd12 travar dura\u00e7\u00e3o em 1.&quot;;
    }
    logBot(msg, &quot;err&quot;);
  }
  seq = null;
  // o bloco fecha em LOSS (conta 1 vez, como no painel)
  if (tevePerda){
    fecharBloco(biSeq, false);
    atualizarUI();
    verificarLimites();
  }
}

function temPassoMedido(cfg){
  // PADRAO DO PAINEL: entrada na vela 1 e GALE na vela seguinte -&gt; 1 item por entrada.
  return false;
}
function origemPasso(cfg){
  return &quot;padr\u00e3o do painel (1 vela por entrada)&quot;;
}

function passoGale(cfg){
  // PADRAO DO PAINEL: cada operacao ocupa exatamente 1 item do bloco
  // (vela 1 = entrada, vela 2 = GALE 1, vela 3 = GALE 2 ...). O GALE que
  // chegaria atrasado e descartado em aposAbrirUnidade, entao nao ha passo &gt; 1.
  return 1;
}
function cabemGales(cfg){ return Math.floor((cfg.bloco - 1) / passoGale(cfg)); }

/* a duracao esta na mesma unidade do bloco? */
function unidadeComparavel(cfg){
  return (cfg.modo === &quot;digits&quot; &amp;&amp; cfg.duracaoUnidade === &quot;t&quot;) ||
         (cfg.modo === &quot;risefall&quot; &amp;&amp; cfg.duracaoUnidade === &quot;m&quot;);
}

/* Em que unidade o contrato deve durar 1 unidade para o GALE cair no proximo
   item do bloco?  &quot;t&quot; = 1 tick, &quot;m&quot; = 1 minuto, null = contrato sem duracao. */
function unidadeAlvoDuracao(cfg, fam){
  const f = fam || familiaAtual(cfg);
  if (f.dur === &quot;none&quot;) return null;       // MULTUP/MULTDOWN e ACCU nao tem duracao
  if (cfg.modo === &quot;digits&quot;) return &quot;t&quot;;  // entradas por tick -&gt; contrato de 1 tick
  if (f.dur === &quot;t&quot;) return &quot;t&quot;;          // contrato so aceita ticks (digits)
  return &quot;m&quot;;                             // entradas por vela -&gt; contrato de 1 minuto
}

function rotuloStake(cfg, g){
  if (g &lt;= 0) return &quot;entrada&quot;;
  if (cfg.money === &quot;DIV&quot;) return &quot;divisor &quot; + cfg.divisor + &quot;%&quot;;
  if (cfg.money === &quot;MAS&quot;) return &quot;Masaniello&quot;;
