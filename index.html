&lt;script&gt;
/* =====================================================================
   ESPELHO DO PAINEL → ABA BOT DERIV
   Envia o HTML já renderizado destas seções para o documento pai, que
   repassa para o bot. Assim a aba do bot mostra exatamente o MESMO
   ÚLTIMO QUADRANTE, MELHOR PAR DA DATA e RANKINGS do painel.
   ===================================================================== */
(function(){
  var SECS = [&quot;ultimosQuadrantes&quot;,&quot;ultimasVelas&quot;,&quot;ultimaVela&quot;,&quot;quantidadeQuadrante&quot;,
              &quot;melhorParData&quot;,&quot;rankingDias&quot;,&quot;rankingMelhoresParesDia&quot;,&quot;rankingPares&quot;];
  function valorDe(id){
    var el = document.getElementById(id);
    return el ? el.value : &quot;&quot;;
  }

  /* Sequência REAL de operações apostadas (1 vela ou 1 gale por linha),
     na ordem cronológica, segundo a estratégia MAIORIA DA COR + GALE.
     Usada pela Calculadora Masaniello da aba BOT DERIV. */
  function sequenciaOperacoes(){
    try{
      if (typeof montarParesQuadrantes !== &quot;function&quot; || typeof decidirPar !== &quot;function&quot;){
        return { seq: &quot;&quot;, quadrantes: 0, ops: [] };
      }
      var pares = montarParesQuadrantes(DADOS_GLOBAIS, DADOS_CONTEXTO);
      var ops = [];
      var quadrantes = 0;
      var gale = (typeof GALE !== &quot;undefined&quot;) ? GALE : 0;
      var qtd  = (typeof QTD_VELAS !== &quot;undefined&quot;) ? QTD_VELAS : 5;
      var maxG = Math.min(1 + gale, qtd);
      for (var i = 0; i &lt; pares.length; i++){
        var d = decidirPar(pares[i][0], pares[i][1]);
        if (!d || d.status === &quot;SEM_SINAL&quot;) continue;
        quadrantes++;
        if (d.status === &quot;WIN&quot;){
          for (var k = 0; k &lt; d.gale; k++) ops.push({ q: quadrantes, r: &quot;l&quot; });
          ops.push({ q: quadrantes, r: &quot;w&quot; });
        } else if (d.status === &quot;LOSS&quot;){
          for (var m = 0; m &lt; maxG; m++) ops.push({ q: quadrantes, r: &quot;l&quot; });
        }
      }
      var seq = ops.map(function(o){ return o.r; }).join(&quot;&quot;);
      return { seq: seq, quadrantes: quadrantes, ops: ops };
    }catch(e){ return { seq: &quot;&quot;, quadrantes: 0, ops: [] }; }
  }

  /* PLANO DOS QUADRANTES — a GRADE exata do painel (posicao da vela no dia).
     Cada item traz o horario da VELA 1 do quadrante e a cor prevista (maioria
     do quadrante anterior). O bot usa isto como fonte unica de verdade para
     a entrada, garantindo espelho + log identicos. */
  function planoQuadrantes(){
    try{
      if (typeof montarParesQuadrantes !== &quot;function&quot; || typeof corMaioria !== &quot;function&quot;) return [];
      var pares = montarParesQuadrantes(DADOS_GLOBAIS, DADOS_CONTEXTO);
      var plano = [];
      for (var i = 0; i &lt; pares.length; i++){
        var entrada = pares[i][0], anterior = pares[i][1];
        var cor = corMaioria(anterior);
        var d = (typeof decidirPar === &quot;function&quot;) ? decidirPar(entrada, anterior) : null;
        var ini = (entrada &amp;&amp; entrada.length &amp;&amp; entrada[0]) ? String(entrada[0].time) : &quot;&quot;;
        var fim = (entrada &amp;&amp; entrada.length) ? String(entrada[entrada.length - 1].time) : &quot;&quot;;
        plano.push({ ini: ini, fim: fim, n: entrada ? entrada.length : 0,
                     cor: cor || &quot;&quot;, res: d ? d.status : &quot;&quot;, gale: d ? d.gale : -1 });
      }
      return plano;
    }catch(e){ return []; }
  }

  function enviar(){
    var secs = {};
    SECS.forEach(function(id){
      var el = document.getElementById(id);
      if (el) secs[id] = el.innerHTML;
    });
    var ops = sequenciaOperacoes();
    var payload = {
      __painelMirror: true,
      secs: secs,
      seq: ops.seq,
      quadrantes: ops.quadrantes,
      ops: ops.ops,
      plano: planoQuadrantes(),
      bloco: (typeof QTD_VELAS !== &quot;undefined&quot;) ? QTD_VELAS : 5,
      galeCfg: (typeof GALE !== &quot;undefined&quot;) ? GALE : 0,
      ultimaVela: (DADOS_GLOBAIS &amp;&amp; DADOS_GLOBAIS.length) ? DADOS_GLOBAIS[DADOS_GLOBAIS.length - 1].time : &quot;&quot;,
      diaInicio: (DADOS_GLOBAIS &amp;&amp; DADOS_GLOBAIS.length) ? DADOS_GLOBAIS[0].time : &quot;&quot;,
      estado: {
        par: valorDe(&quot;par&quot;),
        data: valorDe(&quot;data&quot;),
        modoVelas: valorDe(&quot;modoVelas&quot;),
        gale: valorDe(&quot;gale&quot;),
        estrategia: valorDe(&quot;filtroPar&quot;)
      }
    };
    // o CSS vai em TODAS as mensagens: se a primeira se perder (bot ainda
    // carregando), o espelho nunca ficaria sem os estilos do painel.
    var st = document.querySelector(&quot;style&quot;);
    if (st &amp;&amp; st.textContent) payload.css = st.textContent;
    try { parent.postMessage(payload, &quot;*&quot;); } catch(e){}
  }

  /* Recebe o filtro comandado da aba BOT DERIV e aplica AQUI no painel. */
  window.addEventListener(&quot;message&quot;, function(ev){
    var d = ev.data;
    if (!d || !d.__painelControle) return;
    var c = d.campos || {};
    var recarregar = !!d.recarregar;

    var selPar = document.getElementById(&quot;par&quot;);
    if (selPar &amp;&amp; typeof c.par === &quot;string&quot; &amp;&amp; c.par &amp;&amp; selPar.value !== c.par){
      selPar.value = c.par;
      recarregar = true;
    }

    var inpData = document.getElementById(&quot;data&quot;);
    if (inpData &amp;&amp; typeof c.data === &quot;string&quot; &amp;&amp; inpData.value !== c.data){
      inpData.value = c.data;
      recarregar = true;
    }

    var inpVelas = document.getElementById(&quot;modoVelas&quot;);
    if (inpVelas &amp;&amp; c.modoVelas != null &amp;&amp; c.modoVelas !== &quot;&quot; &amp;&amp; String(inpVelas.value) !== String(c.modoVelas)){
      inpVelas.value = c.modoVelas;
      alterarModoVelas();
    }

    var selGale = document.getElementById(&quot;gale&quot;);
    if (selGale &amp;&amp; c.gale != null &amp;&amp; String(selGale.value) !== String(c.gale)){
      selGale.value = c.gale;
      alterarGale();
    }

    if (recarregar) carregar();
  });

  setInterval(enviar, 1000);
  window.addEventListener(&quot;load&quot;, function(){
    setTimeout(enviar, 500);
    setTimeout(enviar, 2000);
  });
})();

.ciMini{background:#1a1a1a;border:1px solid var(--line);color:#ddd;border-radius:6px;width:30px;height:27px;line-height:1;font-size:13px;cursor:pointer;padding:0}
.ciMini:hover{border-color:var(--cyan);color:#fff}
.confInicio.ciFechado .confInicioGrid,
.confInicio.ciFechado .confInicioAviso,
.confInicio.ciFechado .confInicioLive,
.confInicio.ciFechado .confInicioBotoes{display:none}
.confInicio.ciFechado .confInicioBox{max-height:none;height:auto!important;overflow:visible;resize:none}
.confInicio.ciFechado .ciHeader{border-bottom:0;margin-bottom:0;padding-bottom:2px}
.confInicioLive{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.confInicio.running .confInicioLive{display:block}
.ciLiveTempo{font-size:22px;font-weight:900;color:var(--cyan);text-align:center;line-height:1.15}
.ciLiveTempo .rot{display:block;font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:2px}
.ciLiveSub{text-align:center;color:var(--dim);font-size:12px;margin-top:3px;line-height:1.4}
.ciStatsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;margin-top:12px}
.ciStat{background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.ciStatK{color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;line-height:1.2}
.ciStatV{font-weight:900;font-size:14px;color:#fff}
.ciStatV.pos{color:var(--green)} .ciStatV.neg{color:var(--red)} .ciStatV.neu{color:var(--cyan)}
.ciQc{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.ciQcTit{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.4px;text-align:center;margin:8px 0 5px}
.ciQcRow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.ciQv{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;border:1px solid var(--line);border-radius:7px;padding:4px 3px;background:#0b0b0b}
.ciQv.gale{border-color:var(--yellow);box-shadow:0 0 8px rgba(255,179,0,.3)}
.ciQv .q{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#000}
.ciQv .q.G{background:var(--green)} .ciQv .q.V{background:var(--red);color:#fff} .ciQv .q.D{background:var(--yellow)}
.ciQv .t{font-size:9px;color:var(--dim);line-height:1.15}
.ciQv .n{font-size:10px;color:#fff;font-weight:800}
.ciQv .bg{font-size:8px;font-weight:800;color:var(--yellow);white-space:nowrap}
.ciQv .ap{font-size:8.5px;font-weight:700;line-height:1.15;white-space:nowrap}
.ciQv .ap.win{color:var(--green)} .ciQv .ap.loss{color:var(--red)}
.ciQcRes{text-align:center;font-size:10.5px;font-weight:800;margin-top:6px}
.ciQcRes.win{color:var(--green)} .ciQcRes.loss{color:var(--red)}
.ciQcVazio{display:block;text-align:center;color:var(--dim);font-size:11px;padding:6px}
.ciV .ciCfgInput{width:100%;font-size:12px;padding:4px 6px;margin-top:2px}
.ciV .ciCfgInput + .ciCfgInput{margin-top:4px}
.ciV .ciCfgInput:focus{border-color:var(--cyan)}
.ciLiveOpsHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.ciLiveOpsTitle{font-size:10px;font-weight:900;letter-spacing:.8px;color:var(--cyan);text-transform:uppercase}
.ciLiveOpsCount{font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 7px;background:#080d12}
.ciLiveLista{margin-top:7px;max-height:235px;overflow-y:auto;overflow-x:hidden;padding:2px 5px 2px 1px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;border:1px solid rgba(0,229,255,.10);border-radius:10px;background:rgba(2,8,13,.48)}
.ciLiveLista::-webkit-scrollbar{width:7px}
.ciLiveLista::-webkit-scrollbar-track{background:rgba(255,255,255,.025);border-radius:10px}
.ciLiveLista::-webkit-scrollbar-thumb{background:rgba(0,229,255,.34);border-radius:10px}
.ciLiveLista:hover::-webkit-scrollbar-thumb{background:rgba(0,229,255,.65)}
.ciLiveVazio{color:var(--dim);font-size:12px;text-align:center;padding:14px}
.ciOp{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#0b0b0b;font-size:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ciOp.win{border-color:var(--green)} .ciOp.loss{border-color:var(--red)}
.ciOp.aberta{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.28)}
.ciOpTag{font-size:10px;color:var(--dim);margin-top:2px}
.ciOpR{text-align:right;font-weight:800;white-space:nowrap}
.ciPainelControles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.ciPainelControles button{font-size:10px;font-weight:900;letter-spacing:.35px;padding:9px 6px;border-radius:8px;transition:.18s;box-shadow:0 0 10px rgba(0,229,255,.06)}
.ciPainelControles button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 15px rgba(0,229,255,.22)}
.ciPainelControles .ciCtrlStart{border-color:rgba(0,255,110,.45);color:var(--green)}
.ciPainelControles .ciCtrlStop{border-color:rgba(255,45,65,.45);color:var(--red)}
.ciPainelControles .ciCtrlReset{border-color:rgba(255,179,0,.45);color:var(--yellow)}
.ciPainelControles button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:520px){.ciPainelControles{grid-template-columns:1fr}.ciLiveLista{max-height:190px}}
#btnReabrirConf{position:fixed;right:14px;bottom:14px;z-index:9998;display:none;font-size:13px;padding:10px 16px;box-shadow:0 0 18px rgba(0,229,255,.5)}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;h1&gt;Bot Deriv — Estratégia Maioria da Cor&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Blocos de velas → maioria G/V do bloco anterior → entrada na 1ª vela do próximo bloco → GALE até acertar.&lt;br&gt;&lt;b&gt;Contratos de direção (CALL/PUT)&lt;/b&gt; usam sempre a &lt;b&gt;Maioria da Cor&lt;/b&gt; — em velas &lt;b&gt;e&lt;/b&gt; em ticks.&lt;/div&gt;

&lt;div class=&quot;warn&quot;&gt;
  &lt;b&gt;⚠️ AVISO DE RISCO&lt;/b&gt; — Nenhuma estratégia garante lucro. O GALE (martingale) multiplica a perda a cada erro e pode
  zerar a banca em poucos losses seguidos. Comece sempre em &lt;b&gt;conta DEMO&lt;/b&gt; e no &lt;b&gt;modo SIMULAÇÃO&lt;/b&gt;. Você é o único
  responsável pelas operações. Use os limites de Stop Win / Stop Loss.
&lt;/div&gt;

&lt;!-- ================= CONEXÃO ================= --&gt;
&lt;div class=&quot;card&quot;&gt;
  &lt;h2&gt;1 · Conexão&lt;/h2&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div&gt;
      &lt;label&gt;App ID / Client ID&lt;/label&gt;
      &lt;input type=&quot;text&quot; id=&quot;cfgAppId&quot; value=&quot;1089&quot; placeholder=&quot;1089&quot;&gt;
      &lt;div class=&quot;hint&quot;&gt;Use o app registrado em &lt;b&gt;developers.deriv.com&lt;/b&gt; (enviado no header &lt;code&gt;Deriv-App-ID&lt;/code&gt;). &lt;b&gt;1089&lt;/b&gt; = app público de teste, suficiente para o mercado.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;API Token (PAT)&lt;/label&gt;
      &lt;input type=&quot;password&quot; id=&quot;cfgToken&quot; placeholder=&quot;cole aqui seu PAT&quot;&gt;
      &lt;div class=&quot;hint&quot;&gt;Crie o &lt;b&gt;Personal Access Token&lt;/b&gt; em &lt;b&gt;developers.deriv.com&lt;/b&gt; com escopo &lt;b&gt;trade&lt;/b&gt;. Tokens antigos (deriv.com → Configurações) &lt;b&gt;não&lt;/b&gt; funcionam na API nova.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;
      &lt;button class=&quot;btn-cyan&quot; id=&quot;btnConnect&quot; onclick=&quot;conectar()&quot;&gt;🔌 CONECTAR&lt;/button&gt;
      &lt;button class=&quot;btn-gray&quot; id=&quot;btnDisconnect&quot; onclick=&quot;desconectar()&quot; disabled&gt;SAIR&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;row&quot; style=&quot;margin-top:10px&quot;&gt;
    &lt;div&gt;
      &lt;label&gt;Conta (preenchida ao conectar)&lt;/label&gt;
      &lt;select id=&quot;cfgConta&quot;&gt;&lt;option value=&quot;&quot;&gt;— conecte com token para carregar —&lt;/option&gt;&lt;/select&gt;
      &lt;div class=&quot;hint&quot;&gt;Padrão: &lt;b&gt;DEMO&lt;/b&gt;. Trocar de conta pede reconexão (o OTP é de uso único).&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;row&quot; style=&quot;margin-top:10px;align-items:center&quot;&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;&lt;span id=&quot;status&quot;&gt;&lt;span class=&quot;dot&quot; id=&quot;dot&quot;&gt;&lt;/span&gt;&lt;span id=&quot;statusTxt&quot;&gt;Desconectado&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;&lt;span id=&quot;acctBadges&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;&lt;b id=&quot;balanceTxt&quot; class=&quot;neu&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
    &lt;div style=&quot;flex:1&quot;&gt;&lt;/div&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;&lt;label style=&quot;margin:0&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cfgRemember&quot; style=&quot;width:auto&quot;&gt; lembrar token&lt;/label&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;connMsg&quot; class=&quot;hint&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ================= CONFIGURAÇÃO ================= --&gt;
&lt;div class=&quot;card&quot;&gt;
  &lt;h2&gt;2 · Configuração da estratégia&lt;/h2&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div&gt;
      &lt;label&gt;Tipo de contrato&lt;/label&gt;
      &lt;select id=&quot;cfgContrato&quot;&gt;&lt;/select&gt;
      &lt;div class=&quot;hint&quot; id=&quot;hintContrato&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Estratégia&lt;/label&gt;
      &lt;select id=&quot;cfgEstrategia&quot;&gt;
        &lt;option value=&quot;maioria&quot;&gt;Cor maior do quadrante utilizado&lt;/option&gt;
        &lt;option value=&quot;digito&quot;&gt;Dígito do contrato (Over/Under, Par/Ímpar, Match/Diff)&lt;/option&gt;
      &lt;/select&gt;
      &lt;div class=&quot;hint&quot; id=&quot;hintEstrategia&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Ativo (símbolo)&lt;/label&gt;
      &lt;select id=&quot;cfgSymbol&quot;&gt;&lt;/select&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapBarreira&quot; style=&quot;display:none&quot;&gt;
      &lt;label&gt;Barreira (barrier)&lt;/label&gt;
      &lt;input type=&quot;text&quot; id=&quot;cfgBarreira&quot; placeholder=&quot;ex.: 4&quot;&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapBarreira2&quot; style=&quot;display:none&quot;&gt;
      &lt;label&gt;Barreira 2 (barrier2)&lt;/label&gt;
      &lt;input type=&quot;text&quot; id=&quot;cfgBarreira2&quot; placeholder=&quot;ex.: +0.5&quot;&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapMultContrato&quot; style=&quot;display:none&quot;&gt;
      &lt;label&gt;Multiplicador do contrato&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgMultContrato&quot; value=&quot;100&quot; min=&quot;1&quot; step=&quot;1&quot;&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapGrowth&quot; style=&quot;display:none&quot;&gt;
      &lt;label&gt;Growth rate (ACCU)&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgGrowth&quot; value=&quot;0.01&quot; min=&quot;0.01&quot; step=&quot;0.01&quot;&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Qtd. por bloco&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgBloco&quot; value=&quot;5&quot; min=&quot;2&quot; max=&quot;100&quot;&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Tamanho da vela (minutos)&lt;/label&gt;
      &lt;select id=&quot;cfgVelaMin&quot;&gt;
        &lt;option value=&quot;1&quot;&gt;1 minuto&lt;/option&gt;
        &lt;option value=&quot;2&quot;&gt;2 minutos&lt;/option&gt;
        &lt;option value=&quot;3&quot;&gt;3 minutos&lt;/option&gt;
        &lt;option value=&quot;5&quot; selected&gt;5 minutos&lt;/option&gt;
        &lt;option value=&quot;10&quot;&gt;10 minutos&lt;/option&gt;
        &lt;option value=&quot;15&quot;&gt;15 minutos&lt;/option&gt;
        &lt;option value=&quot;30&quot;&gt;30 minutos&lt;/option&gt;
        &lt;option value=&quot;60&quot;&gt;60 minutos&lt;/option&gt;
        &lt;option value=&quot;120&quot;&gt;120 minutos&lt;/option&gt;
      &lt;/select&gt;
      &lt;div class=&quot;hint&quot;&gt;Granularidade buscada na Deriv. Ao trocar, o bot &lt;b&gt;reassina o mercado&lt;/b&gt; e monta os quadrantes com velas desse tamanho (ex.: &lt;b&gt;5 min&lt;/b&gt;).&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Unidade do bloco / das entradas&lt;/label&gt;
      &lt;select id=&quot;cfgUnidadeBloco&quot;&gt;
        &lt;option value=&quot;velas&quot; selected&gt;Velas (tamanho acima)&lt;/option&gt;
        &lt;option value=&quot;ticks&quot;&gt;Ticks&lt;/option&gt;
      &lt;/select&gt;
      &lt;div class=&quot;hint&quot;&gt;Define como o bloco é contado: &lt;b&gt;velas&lt;/b&gt; (no tamanho escolhido acima) ou &lt;b&gt;ticks&lt;/b&gt;. Independente do tipo de contrato.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapGale&quot;&gt;
      &lt;label&gt;GALE máximo (nível)&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgGale&quot; value=&quot;1&quot; min=&quot;0&quot; max=&quot;10&quot;&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapEntrada&quot;&gt;
      &lt;label&gt;Entrada (stake)&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgEntrada&quot; value=&quot;1&quot; min=&quot;0.35&quot; step=&quot;0.01&quot;&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Modo de stake&lt;/label&gt;
      &lt;select id=&quot;cfgMoney&quot;&gt;
        &lt;option value=&quot;MULT&quot; selected&gt;Multiplicador&lt;/option&gt;
        &lt;option value=&quot;DIV&quot;&gt;Divisor %&lt;/option&gt;
        &lt;option value=&quot;MAS&quot;&gt;Masaniello&lt;/option&gt;
      &lt;/select&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapMult&quot;&gt;
      &lt;label&gt;Multiplicador&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgMult&quot; value=&quot;2.5&quot; step=&quot;0.1&quot; min=&quot;1&quot;&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapDivisor&quot;&gt;
      &lt;label&gt;Divisor %&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgDivisor&quot; value=&quot;80&quot; step=&quot;1&quot; min=&quot;1&quot; max=&quot;100&quot;&gt;
    &lt;/div&gt;
    &lt;div id=&quot;wrapMasBanca&quot; style=&quot;display:none&quot;&gt;&lt;label&gt;BANCA R$ (Masaniello)&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;cfgMasBanca&quot; value=&quot;1000&quot; step=&quot;0.01&quot; min=&quot;0.01&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;wrapMasN&quot; style=&quot;display:none&quot;&gt;&lt;label&gt;OPERAÇÕES (N)&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;cfgMasN&quot; value=&quot;10&quot; min=&quot;1&quot; max=&quot;500&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;wrapMasW&quot; style=&quot;display:none&quot;&gt;&lt;label&gt;VITÓRIAS ALVO (W)&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;cfgMasW&quot; value=&quot;5&quot; min=&quot;1&quot; max=&quot;500&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;wrapMasOdd&quot; style=&quot;display:none&quot;&gt;&lt;label&gt;PAYOUT (ODD)&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;cfgMasOdd&quot; value=&quot;1.9&quot; step=&quot;0.01&quot; min=&quot;1.01&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;wrapMasReinv&quot; style=&quot;display:none&quot;&gt;&lt;label&gt;% A REINVESTIR&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;cfgMasReinv&quot; value=&quot;100&quot; min=&quot;1&quot; max=&quot;100&quot;&gt;&lt;/div&gt;
    &lt;div style=&quot;grid-column:1/-1&quot;&gt;
      &lt;label&gt;Prévia do stake (exatamente o que será apostado)&lt;/label&gt;
      &lt;div id=&quot;previaStake&quot; style=&quot;font-size:12.5px;line-height:1.6;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:9px&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Payout % (cálculo)&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgPayout&quot; value=&quot;85&quot; step=&quot;1&quot; min=&quot;1&quot;&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Stop WIN&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgStopWin&quot; value=&quot;20&quot; step=&quot;0.5&quot; min=&quot;0&quot;&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Stop LOSS&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgStopLoss&quot; value=&quot;20&quot; step=&quot;0.5&quot; min=&quot;0&quot;&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Máx. losses seguidos&lt;/label&gt;
      &lt;input type=&quot;number&quot; id=&quot;cfgMaxLossStreak&quot; value=&quot;3&quot; min=&quot;0&quot;&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;label&gt;Âncora do bloco (velas)&lt;/label&gt;
      &lt;select id=&quot;cfgAncora&quot;&gt;
        &lt;option value=&quot;dia&quot; selected&gt;00:00 UTC (igual painel)&lt;/option&gt;
        &lt;option value=&quot;sessao&quot;&gt;Início da sessão&lt;/option&gt;
      &lt;/select&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;row&quot; style=&quot;margin-top:12px;align-items:center&quot;&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;&lt;label style=&quot;margin:0&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cfgSim&quot; checked style=&quot;width:auto&quot;&gt; MODO SIMULAÇÃO (não envia ordens)&lt;/label&gt;&lt;/div&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;&lt;label style=&quot;margin:0&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cfgRecuperar&quot; style=&quot;width:auto&quot; checked&gt; recuperar perda entre blocos&lt;/label&gt;&lt;/div&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;&lt;label style=&quot;margin:0&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cfgAllowReal&quot; style=&quot;width:auto&quot;&gt; autorizo operar em conta REAL&lt;/label&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ================= CONTROLES ================= --&gt;
&lt;div class=&quot;card&quot;&gt;
  &lt;h2&gt;3 · Controles&lt;/h2&gt;
  &lt;div class=&quot;row&quot; style=&quot;align-items:center&quot;&gt;
    &lt;div style=&quot;flex:0 0 auto&quot;&gt;
      &lt;button class=&quot;btn-green&quot; id=&quot;btnStart&quot; onclick=&quot;iniciarBot()&quot; disabled&gt;▶ INICIAR BOT&lt;/button&gt;
      &lt;button class=&quot;btn-red&quot; id=&quot;btnStop&quot; onclick=&quot;pararBot(&#x27;manual&#x27;)&quot; disabled&gt;■ PARAR&lt;/button&gt;
      &lt;button class=&quot;btn-gray&quot; onclick=&quot;resetar()&quot;&gt;↺ RESETAR&lt;/button&gt;
      &lt;button class=&quot;btn-gray&quot; onclick=&quot;exportarCSV()&quot;&gt;⬇ CSV&lt;/button&gt;
      &lt;button class=&quot;btn-gray&quot; onclick=&quot;exportarVelasJSON(true)&quot;&gt;⬇ VELAS .JSON&lt;/button&gt;
      &lt;button class=&quot;btn-gray&quot; id=&quot;btnTeste&quot; onclick=&quot;testarProposta()&quot;&gt;🧪 TESTAR PROPOSTA&lt;/button&gt;

&lt;script&gt;
(function(){
  function g(id){ return document.getElementById(id); }
  function brl(n){
    if (n === null || n === undefined || isNaN(n)) return &#x27;—&#x27;;
    return n.toLocaleString(&#x27;pt-BR&#x27;,{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function val(id, def){
    var el = g(id); if (!el) return def;
    var v = parseFloat(String(el.value).replace(&#x27;,&#x27;, &#x27;.&#x27;));
    return isNaN(v) ? def : v;
  }
  function r2(x){ return Math.round(x * 100) / 100; }

  function probSucesso(N, W, odd){
    N = Math.max(1, Math.min(500, Math.floor(N) || 1));
    W = Math.max(0, Math.min(N, Math.floor(W) || 0));
    if (W &lt;= 0) return 1;
    var p = 1 / odd, q = 1 - p;
    if (!(p &gt; 0)) return 0;
    if (!(q &gt; 0)) return 1;
    var lf = new Array(N + 1); lf[0] = 0;
    for (var i = 1; i &lt;= N; i++) lf[i] = lf[i-1] + Math.log(i);
    var lp = Math.log(p), lq = Math.log(q), best = -Infinity, lw = new Array(N + 1);
    for (var k = 0; k &lt;= N; k++){
      lw[k] = lf[N] - lf[k] - lf[N-k] + k * lp + (N-k) * lq;
      if (lw[k] &gt; best) best = lw[k];
    }
    var tot = 0, cauda = 0;
    for (var j = 0; j &lt;= N; j++){
      var w = Math.exp(lw[j] - best); tot += w;
      if (j &gt;= W) cauda += w;
    }
    return Math.max(cauda / tot, 1e-12);
  }
  function cfgMg(){
    var modo     = g(&#x27;mgModo&#x27;) ? g(&#x27;mgModo&#x27;).value : &#x27;DIVISOR&#x27;;
    var payout   = val(&#x27;mgPayout&#x27;, 85) / 100;
    var mult     = val(&#x27;mgMult&#x27;, 2.5);
    var divisor  = val(&#x27;mgDivisor&#x27;, 80) / 100;
    var base     = r2(val(&#x27;mgEntrada&#x27;, 10));
    var banca    = val(&#x27;mgBanca&#x27;, 1000);
    var lucroAt  = val(&#x27;mgLucro&#x27;, 1200);
    var qtd      = Math.max(1, Math.min(20, Math.round(val(&#x27;mgLossQtd&#x27;, 2))));
    var N        = Math.min(500, Math.max(1, Math.round(val(&#x27;mgN&#x27;, 10))));
    var W        = Math.min(500, Math.max(1, Math.round(val(&#x27;mgW&#x27;, 5))));
    if (W &gt; N) W = N;
    var odd      = val(&#x27;mgOdd&#x27;, 1.85); if (odd &lt;= 1) odd = 1.01;
    var reinv    = Math.min(100, Math.max(1, val(&#x27;mgReinv&#x27;, 100))) / 100;
    if (payout  &lt;= 0) payout  = 0.0001;
    if (divisor &lt;= 0) divisor = 0.0001;
    if (mult    &lt;  1) mult    = 1;
    if (base    &lt;= 0) base    = 0.01;
    if (banca   &lt;= 0) banca   = 1;
    return { modo: modo, payout: payout, mult: mult, divisor: divisor,
             base: base, banca: banca, lucroAt: lucroAt, qtd: qtd,
             N: N, W: W, odd: odd, reinv: reinv };
  }
  function proximaEntrada(c, entry, cum){
    return c.modo === &#x27;MULTIPLO&#x27; ? r2(entry * c.mult) : r2(cum / c.divisor);
  }

  /* ---------- tabela estática ---------- */
  function setStat(id, label, valor, cls){
    var el = g(id); if (!el) return;
    var k = el.previousElementSibling; if (k) k.textContent = label;
    el.textContent = valor;
    if (cls != null) el.className = &#x27;v &#x27; + cls;
  }

  function renderTabela(){
    var c = cfgMg();
    var isMas = c.modo === &#x27;MASSANIELLO&#x27;;

    if (g(&#x27;mgEstatico&#x27;)) g(&#x27;mgEstatico&#x27;).style.display = isMas ? &#x27;none&#x27; : &#x27;&#x27;;

    if (isMas){
      var alvo = c.banca / probSucesso(c.N, c.W, c.odd);
      var pct = (alvo / c.banca - 1) * 100;
      setStat(&#x27;mgLucroShow&#x27;, &#x27;Resultado a ser atingido&#x27;, &#x27;R$ &#x27; + brl(alvo), &#x27;neu&#x27;);
      setStat(&#x27;mgEntradaShow&#x27;, &#x27;Resultado esperado&#x27;, &#x27;+ &#x27; + brl(pct) + &#x27; %&#x27;, &#x27;pos&#x27;);
      setStat(&#x27;mgMaxGale&#x27;, &#x27;Erros aceitos&#x27;, (c.N - c.W) + &#x27; de &#x27; + c.N, &#x27;&#x27;);
      if (g(&#x27;mgOut&#x27;)) g(&#x27;mgOut&#x27;).innerHTML =
        &#x27;MODO &lt;b&gt;MASSANIELLO&lt;/b&gt; &amp;nbsp;·&amp;nbsp; BANCA &lt;b&gt;R$ &#x27; + brl(c.banca) + &#x27;&lt;/b&gt; &amp;nbsp;·&amp;nbsp; OPERAÇÕES &lt;b&gt;&#x27; + c.N +
        &#x27;&lt;/b&gt; &amp;nbsp;·&amp;nbsp; VITÓRIAS ALVO &lt;b&gt;&#x27; + c.W + &#x27;&lt;/b&gt; &amp;nbsp;·&amp;nbsp; PAYOUT (ODD) &lt;b&gt;&#x27; + c.odd +
        &#x27;&lt;/b&gt; &amp;nbsp;·&amp;nbsp; REINVESTIR &lt;b&gt;&#x27; + (c.reinv*100).toFixed(0) + &#x27;%&lt;/b&gt;&#x27;;
      return;
    }

    setStat(&#x27;mgLucroShow&#x27;, &#x27;LUCRO ATUAL DA BANCA&#x27;, &#x27;R$ &#x27; + brl(c.lucroAt), &#x27;pos&#x27;);
    setStat(&#x27;mgEntradaShow&#x27;, &#x27;ENTRADA (GALE 0)&#x27;, &#x27;R$ &#x27; + brl(c.base), &#x27;&#x27;);
    if (g(&#x27;mgOut&#x27;)) g(&#x27;mgOut&#x27;).innerHTML =
      &#x27;MODO &lt;b&gt;&#x27; + c.modo + &#x27;&lt;/b&gt; &amp;nbsp;·&amp;nbsp; PAYOUT &lt;b&gt;&#x27; + (c.payout*100).toFixed(0) + &#x27;%&lt;/b&gt; &amp;nbsp;·&amp;nbsp; &#x27; +
      (c.modo === &#x27;MULTIPLO&#x27;
        ? &#x27;MULTIPLICADOR &lt;b&gt;&#x27; + c.mult + &#x27;&lt;/b&gt;&#x27;
        : &#x27;DIVISOR &lt;b&gt;&#x27; + (c.divisor*100).toFixed(0) + &#x27;%&lt;/b&gt;&#x27;);

    var rows = [], entry = c.base, cum = 0;
    function bet(label, e){
      e = r2(e); cum = r2(cum + e);
      rows.push({ label: label, entry: e, lucro: r2(e * c.payout), dash: false });
    }
    bet(&#x27;WIN&#x27;, entry);
    bet(&#x27;GALE 1&#x27;, proximaEntrada(c, entry, cum));
    rows.push({ label: &#x27;LOSS&#x27;, entry: cum, lucro: null, dash: true });
    rows.push({ section: true });
    for (var k = 1; k &lt;= c.qtd; k++){
      entry = proximaEntrada(c, entry, cum);
      bet(&#x27;WIN LOSS &#x27; + k, entry);
    }

    var html = &#x27;&#x27;;
    for (var i = 0; i &lt; rows.length; i++){
      var r = rows[i];
      if (r.section){
        html += &#x27;&lt;tr&gt;&lt;td colspan=&quot;3&quot; style=&quot;text-align:left;color:var(--cyan);font-weight:800;background:#101010;letter-spacing:.4px&quot;&gt;QUANTIDADE DE LOSS SEGUIDO&lt;/td&gt;&lt;/tr&gt;&#x27;;
      } else {
        html += &#x27;&lt;tr&gt;&lt;td&gt;&#x27; + r.label + &#x27;&lt;/td&gt;&lt;td&gt;R$ &#x27; + brl(r.entry) + &#x27;&lt;/td&gt;&lt;td&#x27; +
                (r.dash ? &#x27; class=&quot;hint&quot;&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + (r.dash ? &#x27;—&#x27; : &#x27;R$ &#x27; + brl(r.lucro)) + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
      }
    }
    if (g(&#x27;mgBody&#x27;)) g(&#x27;mgBody&#x27;).innerHTML = html;

    var es = [c.base], acc = c.base, maxG = -1, custo = 0;
    for (var j = 1; j &lt; 60; j++){
      var nx = proximaEntrada(c, es[j-1], acc);
      if (!isFinite(nx) || nx &gt; 1e12) break;
      es.push(nx); acc = r2(acc + nx);
    }
    for (var m = 0; m &lt; es.length; m++){
      if (custo + es[m] &lt;= c.banca){ custo += es[m]; maxG = m; } else break;
    }
    setStat(&#x27;mgMaxGale&#x27;, &#x27;GALE MÁX. PELA BANCA&#x27;,
      (maxG &gt;= 0) ? (&#x27;GALE &#x27; + maxG + &#x27; · R$ &#x27; + brl(custo)) : &#x27;ENTRADA &gt; BANCA&#x27;, &#x27;&#x27;);
  }

  /* ---------- simulação linha a linha (martingale) ---------- */
  function mgSimular(ops){
    var c = cfgMg();
    var isMas = c.modo === &#x27;MASSANIELLO&#x27;;
    var base = c.banca;
    var banca = base, lucroFechados = 0;
    var entry = c.base, cum = 0, gale = 0;
    var cWins = 0, cErros = 0;
    var alvo = base / probSucesso(c.N, c.W, c.odd);
    var gWins = 0, gLosses = 0, opsN = 0, ciclos = 0;
    var ws = 0, ls = 0, maxWs = 0, maxLs = 0, zerou = false;
    var linhas = [];

    for (var i = 0; i &lt; ops.length; i++){
      var o = ops[i];
      var r = (o &amp;&amp; o.r) === &#x27;w&#x27; ? &#x27;w&#x27; : &#x27;l&#x27;;
      var stake;
      if (isMas){
        var restam = c.W - cWins;
        stake = 0;
        if (restam &gt; 0 &amp;&amp; banca &gt; 0){
          var dist = alvo - banca;
          if (dist &gt; 0) stake = (dist / ((c.odd - 1) * restam)) * c.reinv;
          stake = Math.max(0, Math.min(stake, banca));
        }
        stake = r2(stake);
      } else {
        stake = r2(Math.max(0, Math.min(entry, banca)));
      }
      var retorno, fechou = false, status;

      if (r === &#x27;w&#x27;){
        retorno = r2(stake * (isMas ? (c.odd - 1) : c.payout));
        banca = r2(banca + retorno);
        gWins++; ws++; ls = 0; cWins++;
        fechou = isMas ? (banca &gt; base || cWins &gt;= c.W) : true;
        status = &#x27;Ciclo Lucro&#x27;;
      } else {
        retorno = -stake;
        banca = r2(banca - stake);
        gLosses++; ls++; ws = 0; cErros++;
        status = isMas ? (cErros + &#x27; de &#x27; + (c.N - c.W)) : (&#x27;GALE &#x27; + gale);
      }
      if (banca &lt; 0) banca = 0;
      opsN++;
      if (ws &gt; maxWs) maxWs = ws;
      if (ls &gt; maxLs) maxLs = ls;

      linhas.push({
        n: opsN, q: (o &amp;&amp; o.q) || &#x27;—&#x27;, r: r, stake: stake, retorno: retorno,
        capital: r2(lucroFechados + banca),
        acerto: opsN ? (gWins / opsN * 100) : 0,
        fechou: fechou, status: fechou ? &#x27;Ciclo Lucro&#x27; : status
      });

      if (fechou){
        ciclos++;
        lucroFechados = r2(lucroFechados + (banca - base));
        banca = base; entry = c.base; cum = 0; gale = 0; cWins = 0; cErros = 0;
        alvo = base / probSucesso(c.N, c.W, c.odd);
      } else if (!isMas){
        cum = r2(cum + stake);
        gale++;
        entry = proximaEntrada(c, entry, cum);
      }
      if (banca &lt;= 1e-9){ zerou = true; break; }
    }

    var lucroAcum = zerou ? (-base) : r2(lucroFechados + (banca - base));
    var total = gWins + gLosses;
    return {
      linhas: linhas, base: base, lucro: lucroAcum, pct: base ? (lucroAcum / base * 100) : 0,
      bancaFinal: zerou ? 0 : r2(base + lucroAcum), bancaCiclo: zerou ? 0 : banca,
      ops: opsN, wins: gWins, losses: gLosses, ciclos: ciclos,
      assert: total ? (gWins / total * 100) : 0, maxWs: maxWs, maxLs: maxLs,
      seqWinAtual: ws, seqLossAtual: ls, zerou: zerou
    };
  }

  function linhasHTML(r){
    return r.linhas.map(function(l){
      return &#x27;&lt;tr&gt;&#x27; +
        &#x27;&lt;td&gt;&#x27; + l.n + &#x27;&lt;/td&gt;&#x27; +
        &#x27;&lt;td&gt;&#x27; + l.q + &#x27;&lt;/td&gt;&#x27; +
        &#x27;&lt;td style=&quot;color:&#x27; + (l.r === &#x27;w&#x27; ? &#x27;var(--green)&#x27; : &#x27;var(--red)&#x27;) + &#x27;;font-weight:700&quot;&gt;&#x27; +
          (l.r === &#x27;w&#x27; ? &#x27;WIN&#x27; : &#x27;LOSS&#x27;) + (l.fechou ? &#x27; *&#x27; : &#x27;&#x27;) + &#x27;&lt;/td&gt;&#x27; +
        &#x27;&lt;td&gt;R$ &#x27; + brl(l.stake) + &#x27;&lt;/td&gt;&#x27; +
        &#x27;&lt;td class=&quot;&#x27; + (l.retorno &gt;= 0 ? &#x27;pos&#x27; : &#x27;neg&#x27;) + &#x27;&quot;&gt;&#x27; + (l.retorno &gt;= 0 ? &#x27;+ &#x27; : &#x27;- &#x27;) + &#x27;R$ &#x27; + brl(Math.abs(l.retorno)) + &#x27;&lt;/td&gt;&#x27; +
        &#x27;&lt;td&gt;R$ &#x27; + brl(l.capital) + &#x27;&lt;/td&gt;&#x27; +
        &#x27;&lt;td&gt;&#x27; + brl(l.acerto) + &#x27; %&lt;/td&gt;&#x27; +
        &#x27;&lt;td&gt;&#x27; + l.status + &#x27;&lt;/td&gt;&#x27; +
        &#x27;&lt;/tr&gt;&#x27;;
    }).join(&#x27;&#x27;);
  }
  function cardsHTML(r){
    return &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Lucro&lt;/div&gt;&lt;div class=&quot;v &#x27; + (r.lucro &gt;= 0 ? &#x27;pos&#x27; : &#x27;neg&#x27;) + &#x27;&quot;&gt;&#x27; +
        (r.lucro &gt;= 0 ? &#x27;+&#x27; : &#x27;-&#x27;) + &#x27;R$ &#x27; + brl(Math.abs(r.lucro)) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;WIN&lt;/div&gt;&lt;div class=&quot;v pos&quot;&gt;&#x27; + r.wins + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;LOSS&lt;/div&gt;&lt;div class=&quot;v neg&quot;&gt;&#x27; + r.losses + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Acerto&lt;/div&gt;&lt;div class=&quot;v neu&quot;&gt;&#x27; + brl(r.assert) + &#x27; %&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Seq. loss&lt;/div&gt;&lt;div class=&quot;v neg&quot;&gt;&#x27; + r.seqLossAtual + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Máx. loss seg.&lt;/div&gt;&lt;div class=&quot;v neg&quot;&gt;&#x27; + r.maxLs + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Operações&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;&#x27; + r.ops + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Ciclos fechados&lt;/div&gt;&lt;div class=&quot;v neu&quot;&gt;&#x27; + r.ciclos + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Seq. win&lt;/div&gt;&lt;div class=&quot;v pos&quot;&gt;&#x27; + r.seqWinAtual + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  }

  /* ---------- SIMULAR SEQUÊNCIA ---------- */
  var seqAberto = true, seqTemDados = false, ultimaSeq = &#x27;&#x27;;
  function aplicarToqueSeq(){
    var t = g(&#x27;mgSeqTabela&#x27;);
    if (t) t.style.display = (seqAberto &amp;&amp; seqTemDados) ? &#x27;block&#x27; : &#x27;none&#x27;;
    var ba = g(&#x27;tgMgSeqAberto&#x27;), bf = g(&#x27;tgMgSeqFechado&#x27;);
    if (ba) ba.classList.toggle(&#x27;ativo&#x27;, seqAberto);
    if (bf) bf.classList.toggle(&#x27;ativo&#x27;, !seqAberto);
  }
  if (g(&#x27;tgMgSeqAberto&#x27;)) g(&#x27;tgMgSeqAberto&#x27;).addEventListener(&#x27;click&#x27;, function(){ seqAberto = true; aplicarToqueSeq(); });
  if (g(&#x27;tgMgSeqFechado&#x27;)) g(&#x27;tgMgSeqFechado&#x27;).addEventListener(&#x27;click&#x27;, function(){ seqAberto = false; aplicarToqueSeq(); });

  function rodarSeq(seq){
    var ops = seq.split(&#x27;&#x27;).map(function(ch, i){ return { q: (i + 1), r: ch }; });
    var r = mgSimular(ops);
    g(&#x27;mgSeqOut&#x27;).innerHTML =
      &#x27;&lt;b&gt;SEQUÊNCIA: &#x27; + seq.toUpperCase() + &#x27;&lt;/b&gt;  |  &#x27; +
      &#x27;GANHO REAL: &#x27; + (r.lucro &gt;= 0 ? &#x27;+ &#x27; : &#x27;- &#x27;) + &#x27;R$ &#x27; + brl(Math.abs(r.lucro)) +
      &#x27; (&#x27; + (r.pct &gt;= 0 ? &#x27;+&#x27; : &#x27;-&#x27;) + brl(Math.abs(r.pct)) + &#x27; %)&#x27; +
      &#x27;  |  BANCA TOTAL FINAL R$ &#x27; + brl(r.bancaFinal) +
      &#x27;  |  BANCA DO CICLO R$ &#x27; + brl(r.bancaCiclo) +
      &#x27;  |  OPERAÇÕES: &#x27; + r.ops + &#x27; (&#x27; + r.wins + &#x27; W / &#x27; + r.losses + &#x27; L)&#x27; +
      &#x27; · ASSERTIVIDADE &#x27; + brl(r.assert) + &#x27; %&#x27; +
      &#x27; · Maior racha LOSS: &#x27; + r.maxLs + &#x27; · Maior racha WIN: &#x27; + r.maxWs +
      &#x27; · Ciclos fechados: &#x27; + r.ciclos +
      (r.zerou ? &#x27; · &lt;span class=&quot;neg&quot;&gt;❌ BANCA ZERADA&lt;/span&gt;&#x27; : &#x27;&#x27;);
    g(&#x27;mgSeqBody&#x27;).innerHTML = linhasHTML(r);
    var res = g(&#x27;mgSeqResumo&#x27;);
    if (res){ res.style.display = &#x27;grid&#x27;; res.innerHTML = cardsHTML(r); }
    seqTemDados = true;
    aplicarToqueSeq();
  }

  if (g(&#x27;mgSeqRun&#x27;)) g(&#x27;mgSeqRun&#x27;).addEventListener(&#x27;click&#x27;, function(){
    var seq = (g(&#x27;mgSeq&#x27;).value || &#x27;&#x27;).toLowerCase().replace(/[^wl]/g, &#x27;&#x27;);
    if (!seq){
      g(&#x27;mgSeqOut&#x27;).textContent = &#x27;Digite uma sequência com w (acerto) e l (erro).&#x27;;
      seqTemDados = false; ultimaSeq = &#x27;&#x27;; aplicarToqueSeq();
      return;
    }
    ultimaSeq = seq;
    rodarSeq(seq);
  });
  if (g(&#x27;mgSeqClear&#x27;)) g(&#x27;mgSeqClear&#x27;).addEventListener(&#x27;click&#x27;, function(){
    g(&#x27;mgSeq&#x27;).value = &#x27;&#x27;; g(&#x27;mgSeqOut&#x27;).innerHTML = &#x27;&#x27;; g(&#x27;mgSeqBody&#x27;).innerHTML = &#x27;&#x27;;
    var res = g(&#x27;mgSeqResumo&#x27;);
    if (res){ res.innerHTML = &#x27;&#x27;; res.style.display = &#x27;none&#x27;; }
    seqTemDados = false; ultimaSeq = &#x27;&#x27;; aplicarToqueSeq();
  });

  /* ---------- SIMULAÇÃO DE GANHO REAL ---------- */
  function opsReais(){
    if (Array.isArray(window.__painelOps) &amp;&amp; window.__painelOps.length)
      return { ops: window.__painelOps, fonte: &#x27;PAINEL (dados filtrados)&#x27; };
    var s = window.__painelSeq || &#x27;&#x27;;
    if (s){
      var q = 0, prev = null;
      var ops = s.split(&#x27;&#x27;).map(function(r){
        if (r === &#x27;w&#x27; &amp;&amp; prev !== &#x27;w&#x27;) q++;
        prev = r;
        return { q: Math.max(1, q), r: r };
      });
      return { ops: ops, fonte: &#x27;PAINEL (sequência filtrada)&#x27; };
    }
    return null;
  }

  var realAberto = true, realTemDados = false;
  function aplicarToqueReal(){
    var t = g(&#x27;mgRealTabela&#x27;);
    if (t) t.style.display = (realAberto &amp;&amp; realTemDados) ? &#x27;block&#x27; : &#x27;none&#x27;;
    var ba = g(&#x27;tgMgRealAberto&#x27;), bf = g(&#x27;tgMgRealFechado&#x27;);
    if (ba) ba.classList.toggle(&#x27;ativo&#x27;, realAberto);
    if (bf) bf.classList.toggle(&#x27;ativo&#x27;, !realAberto);
  }
  if (g(&#x27;tgMgRealAberto&#x27;)) g(&#x27;tgMgRealAberto&#x27;).addEventListener(&#x27;click&#x27;, function(){ realAberto = true; aplicarToqueReal(); });
  if (g(&#x27;tgMgRealFechado&#x27;)) g(&#x27;tgMgRealFechado&#x27;).addEventListener(&#x27;click&#x27;, function(){ realAberto = false; aplicarToqueReal(); });
  if (g(&#x27;mgRealLimpar&#x27;)) g(&#x27;mgRealLimpar&#x27;).addEventListener(&#x27;click&#x27;, function(){
    g(&#x27;mgRealOut&#x27;).innerHTML = &#x27;&#x27;; g(&#x27;mgRealBody&#x27;).innerHTML = &#x27;&#x27;;
    var res = g(&#x27;mgRealResumo&#x27;);
    if (res){ res.innerHTML = &#x27;&#x27;; res.style.display = &#x27;none&#x27;; }
    realTemDados = false; aplicarToqueReal();
  });

  if (g(&#x27;mgRealRun&#x27;)) g(&#x27;mgRealRun&#x27;).addEventListener(&#x27;click&#x27;, function(){
    var d = opsReais();
    if (!d || !d.ops.length){
      g(&#x27;mgRealOut&#x27;).innerHTML = &#x27;&lt;span class=&quot;neg&quot;&gt;Sem dados reais ainda.&lt;/span&gt; &#x27; +
        &#x27;Ligue o bot (para carregar as velas da Deriv) ou carregue os *_blocos.json na aba PAINEL (FILTRAR).&#x27;;
      realTemDados = false; aplicarToqueReal();
      return;
    }
    var lim = Math.max(1, parseInt(g(&#x27;mgLimite&#x27;).value, 10) || 300);
    var corte = d.ops.slice(0, lim);
    var r = mgSimular(corte);
    var quad = (window.__painelQuadrantes != null) ? window.__painelQuadrantes : &#x27;—&#x27;;
    var est = window.__painelEstadoFiltro || null;
    var rotuloDia = (est &amp;&amp; est.data) ? est.data.split(&#x27;-&#x27;).reverse().slice(0, 2).join(&#x27;/&#x27;) : &#x27;TODAS&#x27;;
    var filtro = est ? (&#x27;PAR &#x27; + (est.par || &#x27;—&#x27;) + &#x27; · QTD VELAS &#x27; + (est.modoVelas || &#x27;—&#x27;) + &#x27; · GALE &#x27; + (est.gale || &#x27;0&#x27;)) : &#x27;&#x27;;

    g(&#x27;mgRealOut&#x27;).innerHTML =
      &#x27;&lt;div style=&quot;margin-bottom:4px;color:var(--cyan);font-weight:800&quot;&gt;SIMULAÇÃO DE GANHO REAL — DIA FILTRADO (&#x27; + rotuloDia + &#x27;)&lt;/div&gt;&#x27; +
      &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;FONTE: &lt;b&gt;&#x27; + d.fonte + &#x27;&lt;/b&gt;&#x27; + (filtro ? &#x27;  |  &#x27; + filtro : &#x27;&#x27;) +
      &#x27;  |  LINHAS USADAS: &#x27; + corte.length + &#x27; de &#x27; + d.ops.length + &#x27;&lt;/div&gt;&#x27; +
      &#x27;GANHO REAL: &#x27; + (r.lucro &gt;= 0 ? &#x27;+ &#x27; : &#x27;- &#x27;) + &#x27;R$ &#x27; + brl(Math.abs(r.lucro)) +
      &#x27; (&#x27; + (r.pct &gt;= 0 ? &#x27;+&#x27; : &#x27;-&#x27;) + brl(Math.abs(r.pct)) + &#x27; %)&#x27; +
      &#x27;  |  BANCA TOTAL FINAL R$ &#x27; + brl(r.bancaFinal) +
      &#x27;  |  BANCA DO CICLO R$ &#x27; + brl(r.bancaCiclo) +
      &#x27;  |  ESTRATÉGIA MAIORIA DA COR&#x27; +
      &#x27;  |  OPERAÇÕES: &#x27; + r.ops + &#x27; (&#x27; + r.wins + &#x27; W / &#x27; + r.losses + &#x27; L)&#x27; +
      &#x27; · ASSERTIVIDADE &#x27; + brl(r.assert) + &#x27; %&#x27; +
      &#x27; · QUADRANTES: &#x27; + quad +
      &#x27; · Maior racha LOSS: &#x27; + r.maxLs + &#x27; · Maior racha WIN: &#x27; + r.maxWs +
      &#x27; · Ciclos fechados: &#x27; + r.ciclos +
      (r.zerou ? &#x27; · &lt;span class=&quot;neg&quot;&gt;❌ BANCA ZERADA&lt;/span&gt;&#x27; : &#x27;&#x27;);
    g(&#x27;mgRealBody&#x27;).innerHTML = linhasHTML(r);
    var res = g(&#x27;mgRealResumo&#x27;);
    if (res){ res.style.display = &#x27;grid&#x27;; res.innerHTML = cardsHTML(r); }
    realTemDados = true;
    aplicarToqueReal();
  });

  /* ---------- modos: mostra só os campos do modo escolhido ---------- */
  function aplicarModo(){
    var c = cfgMg();
    var isMas = c.modo === &#x27;MASSANIELLO&#x27;;
    function show(id, on){ var el = g(id); if (el) el.parentElement.style.display = on ? &#x27;&#x27; : &#x27;none&#x27;; }
    show(&#x27;mgN&#x27;, isMas); show(&#x27;mgW&#x27;, isMas); show(&#x27;mgOdd&#x27;, isMas); show(&#x27;mgReinv&#x27;, isMas);
    show(&#x27;mgPayout&#x27;, !isMas); show(&#x27;mgEntrada&#x27;, !isMas); show(&#x27;mgLossQtd&#x27;, !isMas);
    show(&#x27;mgMult&#x27;, c.modo === &#x27;MULTIPLO&#x27;); show(&#x27;mgDivisor&#x27;, c.modo === &#x27;DIVISOR&#x27;);
  }

  /* ---------- eventos dos campos ---------- */
  [&#x27;mgModo&#x27;,&#x27;mgPayout&#x27;,&#x27;mgMult&#x27;,&#x27;mgDivisor&#x27;,&#x27;mgEntrada&#x27;,&#x27;mgBanca&#x27;,&#x27;mgLucro&#x27;,&#x27;mgLossQtd&#x27;,&#x27;mgN&#x27;,&#x27;mgW&#x27;,&#x27;mgOdd&#x27;,&#x27;mgReinv&#x27;]
    .forEach(function(id){
      var el = g(id); if (!el) return;
      function upd(){ aplicarModo(); renderTabela(); if (ultimaSeq) rodarSeq(ultimaSeq); }
      el.addEventListener(&#x27;input&#x27;, upd);
      el.addEventListener(&#x27;change&#x27;, upd);
    });

  aplicarModo();
  renderTabela();
  aplicarToqueSeq();
  aplicarToqueReal();
})();
&lt;/script&gt;

&lt;script&gt;
/* =====================================================================
   BOT DERIV — ESTRATÉGIA MAIORIA DA COR
   ---------------------------------------------------------------------
   Sinal  = cor majoritária do BLOCO ANTERIOR (só G/V; D é neutro;
            empate decide pela última vela G/V do bloco).
   Entrada= 1ª vela do bloco seguinte, na cor prevista.
   GALE   = velas seguintes do MESMO bloco até acertar (máx. GALE).
   ===================================================================== */

/* ---------- Símbolos Deriv ---------- */
const SIMBOLOS = [
  [&quot;frxEURUSD&quot;,&quot;EUR/USD&quot;],
  [&quot;cryBTCUSD&quot;,&quot;BTC/USD&quot;],
  [&quot;R_10&quot;,&quot;Volatility 10 Index&quot;],
  [&quot;1HZ5V&quot;,&quot;Volatility 5 (1s)&quot;],
  [&quot;1HZ10V&quot;,&quot;Volatility 10 (1s)&quot;],
  [&quot;1HZ15V&quot;,&quot;Volatility 15 (1s)&quot;],
  [&quot;1HZ25V&quot;,&quot;Volatility 25 (1s)&quot;],
  [&quot;1HZ30V&quot;,&quot;Volatility 30 (1s)&quot;],

/* =====================================================================
   RESULTADO POR BLOCO (igual ao painel)
   ---------------------------------------------------------------------
   O painel conta o QUADRANTE, não a letra: um bloco que perde a entrada
   e também o GALE é 1 LOSS (não 2). WIN/LOSS, &quot;loss seguidos&quot; e
   &quot;máx. losses seguidos&quot; (que é o stop) são todos por bloco.
   ===================================================================== */
let blocoResolvido = null;   // bi do último bloco já contabilizado

function fecharBloco(bi, ganhou){
  if (bi === null || bi === undefined) return;
  if (blocoResolvido === bi) return;              // um resultado por bloco
  blocoResolvido = bi;
  if (ganhou){
    stats.win++;
    stats.streakWin++;
    stats.streakLoss = 0;
    if (stats.streakWin &gt; stats.maxWinStreak) stats.maxWinStreak = stats.streakWin;
  } else {
    stats.loss++;
    stats.streakLoss++;
    stats.streakWin = 0;
    if (stats.streakLoss &gt; stats.maxLossStreak) stats.maxLossStreak = stats.streakLoss;
  }
}

function familiaAtual(cfg){
  return TIPOS.find(t =&gt; t.id === cfg.contrato) || TIPOS[0];
}

/* Monta o pedido de proposta — fonte unica para operar e para testar */
function montarPedido(cfg, cor, stake){
  const f = familiaAtual(cfg);
  const p = {
    proposal: 1, amount: stake, basis: &quot;stake&quot;,
    contract_type: (cor === &quot;G&quot; ? f.g : f.v),
    currency: conta.currency,
    underlying_symbol: cfg.symbol      // ATEN\u00c7\u00c3O: na API nova \u00e9 underlying_symbol, n\u00e3o symbol
  };

  if (f.dur !== &quot;none&quot;){
    // FONTE ÚNICA DE TEMPO: para contratos baseados em velas,
    // a duração do contrato é SEMPRE o TAMANHO DA VELA configurado.
    // Isso elimina a antiga divergência entre &quot;Duração&quot; e &quot;Tamanho da vela&quot;.
    p.duration = cfg.duracao;
    p.duration_unit = cfg.duracaoUnidade;
  }
  if (f.barrier){
    p.barrier = cor === &quot;G&quot; ? (f.barrier.g || cfg.barreira) : (f.barrier.v || cfg.barreira);
  } else if (f.barrAbs || f.barr2){
    if (cfg.barreira !== &quot;&quot;) p.barrier = cfg.barreira;
    if (f.barr2 &amp;&amp; cfg.barreira2 !== &quot;&quot;) p.barrier2 = cfg.barreira2;
  }
  if (f.mult)   p.multiplier = cfg.multContrato;
  if (f.growth) p.growth_rate = cfg.growth;
  return p;
}

    duracaoUnidade: (String($(&quot;cfgUnidadeBloco&quot;).value) === &quot;ticks&quot;) ? &quot;t&quot; : &quot;m&quot;,
    barreira: $(&quot;cfgBarreira&quot;).value.trim(),
    barreira2: $(&quot;cfgBarreira2&quot;).value.trim(),
    multContrato: Math.max(1, parseFloat($(&quot;cfgMultContrato&quot;).value) || 100),
    growth: Math.max(0.01, parseFloat($(&quot;cfgGrowth&quot;).value) || 0.01),
    symbol: $(&quot;cfgSymbol&quot;).value,
    unidadeBloco: $(&quot;cfgUnidadeBloco&quot;).value,
    velaMin: Math.max(1, parseInt($(&quot;cfgVelaMin&quot;) ? $(&quot;cfgVelaMin&quot;).value : 1) || 1),
    bloco: Math.max(2, parseInt($(&quot;cfgBloco&quot;).value) || 5),
    gale: Math.max(0, parseInt($(&quot;cfgGale&quot;).value) || 0),
    entrada: Math.max(0.35, parseFloat($(&quot;cfgEntrada&quot;).value) || 1),
    money: $(&quot;cfgMoney&quot;).value,
    mult: Math.max(1.01, parseFloat($(&quot;cfgMult&quot;).value) || 2.5),
    divisor: Math.min(100, Math.max(1, parseFloat($(&quot;cfgDivisor&quot;).value) || 80)),
    payout: Math.max(1, parseFloat($(&quot;cfgPayout&quot;).value) || 85),
    masBanca: Math.max(0.01, parseFloat($(&quot;cfgMasBanca&quot;) ? $(&quot;cfgMasBanca&quot;).value : 1000) || 1000),
    masN: Math.max(1, parseInt($(&quot;cfgMasN&quot;) ? $(&quot;cfgMasN&quot;).value : 10) || 10),
    masW: Math.max(1, parseInt($(&quot;cfgMasW&quot;) ? $(&quot;cfgMasW&quot;).value : 5) || 5),
    masOdd: Math.max(1.01, parseFloat($(&quot;cfgMasOdd&quot;) ? $(&quot;cfgMasOdd&quot;).value : 1.85) || 1.85),
    masReinv: Math.min(100, Math.max(1, parseFloat($(&quot;cfgMasReinv&quot;) ? $(&quot;cfgMasReinv&quot;).value : 100) || 100)),
    stopWin: Math.max(0, parseFloat($(&quot;cfgStopWin&quot;).value) || 0),
    stopLoss: Math.max(0, parseFloat($(&quot;cfgStopLoss&quot;).value) || 0),
    maxLossStreak: Math.max(0, parseInt($(&quot;cfgMaxLossStreak&quot;).value) || 0),
    ancora: $(&quot;cfgAncora&quot;).value,
    sim: $(&quot;cfgSim&quot;).checked,
    // No modo DIVISOR a recuperação entre blocos é inerente à estratégia:
    // o bloco que perde carrega a perda para o próximo (perda ÷ divisor%).
    recuperar: $(&quot;cfgRecuperar&quot;).checked || $(&quot;cfgMoney&quot;).value === &quot;DIV&quot;,
    allowReal: $(&quot;cfgAllowReal&quot;).checked,
    contaIdx: $(&quot;cfgConta&quot;) ? $(&quot;cfgConta&quot;).value : &quot;&quot;
  };
  // TRAVAS DE SEGURANCA: valores fora da faixa nao podem travar a tela
  // (o HTML tem max=&quot; ou &quot; nos campos, mas o JS precisa garantir).
  c.bloco = Math.min(100, Math.max(2, c.bloco));
  c.gale  = Math.min(10,  Math.max(0, c.gale));
  c.masN  = Math.min(500, Math.max(1, c.masN));
  c.masW  = Math.min(c.masN, Math.max(1, c.masW));

  //   velas -&gt; entradas por vela de 1 min | ticks -&gt; entradas por tick
  c.modo = (c.unidadeBloco === &quot;ticks&quot;) ? &quot;digits&quot; : &quot;risefall&quot;;

function setConnMsg(html, tipo){
  const el = $(&quot;connMsg&quot;);

function erroDe(j, txt, status){
  if (j &amp;&amp; Array.isArray(j.errors) &amp;&amp; j.errors[0]) return j.errors[0].message || j.errors[0].code || txt || (&quot;HTTP &quot; + status);
  if (j &amp;&amp; j.error) return j.error.message || j.error.code || txt || (&quot;HTTP &quot; + status);
  return txt || (&quot;HTTP &quot; + status);
}

async function conectar(){
  if (conectado || conectando) return;
  const cfg = lerConfig();
  parandoManual = false;

  if ($(&quot;cfgRemember&quot;).checked &amp;&amp; cfg.token) localStorage.setItem(&quot;deriv_token&quot;, cfg.token);
  else if (!$(&quot;cfgRemember&quot;).checked) localStorage.removeItem(&quot;deriv_token&quot;);

  // Sem token: so da para assistir o mercado pelo canal publico da API nova.
  if (!cfg.token){
    conta = null; autenticado = false;
    renderConta(); liberarStart();
    setConnMsg(&quot;Sem token: conectando apenas ao &lt;b&gt;mercado público&lt;/b&gt; (leitura, sem saldo e sem ordens). &quot; +
      &quot;Para operar, cole um &lt;b&gt;PAT&lt;/b&gt; criado em &lt;b&gt;developers.deriv.com&lt;/b&gt; com escopo &lt;b&gt;trade&lt;/b&gt;.&quot;, &quot;&quot;);
    abrirSocket(WS_PUBLIC + &quot;?app_id=&quot; + encodeURIComponent(cfg.appId || &quot;1089&quot;), false);
    return;
  }

  conectando = true;
  reconectarTentativas = 0;
  setStatus(&quot;Autenticando…&quot;, &quot;&quot;);

  try {
    // 1) contas
    setConnMsg(&quot;1/3 · Lendo contas em &lt;b&gt;api.derivws.com&lt;/b&gt; …&quot;, &quot;&quot;);
    logBot(&quot;GET &quot; + DERIV_BASE + &quot;/trading/v1/options/accounts&quot;);
    // Conta escolhida no dropdown ANTES de recarregar a lista (a lista é
    // reconstruída a cada conexão e não pode voltar sozinha para a DEMO).
    const prefConta = ($(&quot;cfgConta&quot;) &amp;&amp; $(&quot;cfgConta&quot;).value) ||
                      (contaEscolhida &amp;&amp; contaEscolhida.account_id) ||
                      (conta &amp;&amp; conta.loginid) || null;
    await carregarContas(cfg, prefConta);

    // 2) OTP
    const acc = escolherConta();
    if (!acc) throw new Error(&quot;Nenhuma conta de opções disponível para operar.&quot;);
    setConnMsg(&quot;2/3 · Solicitando OTP para &lt;b&gt;&quot; + acc.account_id + &quot;&lt;/b&gt; …&quot;, &quot;&quot;);
    const url = await pedirOTP(cfg, acc.account_id);

    conta = {
      loginid: acc.account_id,
      is_virtual: String(acc.account_type).toLowerCase() === &quot;demo&quot;,
      currency: acc.currency,
      balance: Number(acc.balance) || 0
    };
    bancaRef = conta.balance;
    renderConta();
    avisarMudancaDeContaSalva();

    // 3) WebSocket autenticado
    setConnMsg(&quot;3/3 · Abrindo WebSocket autenticado …&quot;, &quot;&quot;);
    autenticado = true;
    abrirSocket(url, true);

  } catch(e){
    conectando = false;
    setStatus(&quot;Erro&quot;, &quot;err&quot;);
    setConnMsg(&quot;❌ &quot; + String(e.message).replace(/\n/g, &quot;&lt;br&gt;&quot;), &quot;err&quot;);
    logBot(&quot;Falha na conexão: &quot; + e.message, &quot;err&quot;);
  }
}

/* ---------- REST: contas ---------- */
async function carregarContas(cfg, prefConta){
  const r = await fetch(DERIV_BASE + &quot;/trading/v1/options/accounts&quot;, {
    method: &quot;GET&quot;,
    headers: { &quot;Authorization&quot;: &quot;Bearer &quot; + cfg.token, &quot;Deriv-App-ID&quot;: cfg.appId }
  });
  const texto = await r.text();
  let j = null; try { j = JSON.parse(texto); } catch(e){}
  if (!r.ok){
    let msg = erroDe(j, texto, r.status);
    if (r.status === 401 || /unauthor|credential|Deriv-App-ID/i.test(msg)){
      msg += &quot;\n\n• O token precisa ser um PAT criado em developers.deriv.com com escopo trade (tokens antigos de deriv.com → Configurações não funcionam na API nova).\n• O App ID deve ser o registrado em developers.deriv.com (header Deriv-App-ID).&quot;;
    }
    throw new Error(msg);
  }
  contas = (j &amp;&amp; j.data) || [];
  if (!contas.length) throw new Error(&quot;O token funcionou, mas não há contas de opções disponíveis.&quot;);
  popularContas(prefConta);
}

/* ---------- REST: OTP -&gt; URL do WebSocket ---------- */
async function pedirOTP(cfg, accountId){
  const r = await fetch(DERIV_BASE + &quot;/trading/v1/options/accounts/&quot; + encodeURIComponent(accountId) + &quot;/otp&quot;, {
    method: &quot;POST&quot;,
    headers: { &quot;Authorization&quot;: &quot;Bearer &quot; + cfg.token, &quot;Deriv-App-ID&quot;: cfg.appId, &quot;Content-Type&quot;: &quot;application/json&quot; }
  });
  const texto = await r.text();
  let j = null; try { j = JSON.parse(texto); } catch(e){}
  if (!r.ok) throw new Error(&quot;OTP: &quot; + erroDe(j, texto, r.status));
  const url = j &amp;&amp; j.data &amp;&amp; j.data.url;
  if (!url) throw new Error(&quot;A Deriv respondeu ao OTP sem URL de WebSocket.&quot;);
  return url;
}

/* ---------- Dropdown de contas ---------- */
function popularContas(prefConta){
  const sel = $(&quot;cfgConta&quot;);
  if (!sel) return;
  // value = account_id (estável entre recargas), não o índice do array.
  sel.innerHTML = contas.map(a =&gt;
    &#x27;&lt;option value=&quot;&#x27; + a.account_id + &#x27;&quot;&gt;&#x27; +
      (String(a.account_type).toLowerCase() === &quot;demo&quot; ? &quot;DEMO&quot; : &quot;REAL&quot;) + &quot; · &quot; +
      a.account_id + &quot; · &quot; + (a.currency || &quot;&quot;) + &quot; · &quot; + (a.balance == null ? &quot;&quot; : a.balance) +
    &#x27;&lt;/option&gt;&#x27;
  ).join(&quot;&quot;);
  // Ordem de prioridade: conta já escolhida (por id) &gt; primeira DEMO &gt; primeira da lista.
  const idDemo = (contas.find(a =&gt; String(a.account_type).toLowerCase() === &quot;demo&quot;) || {}).account_id;
  const alvo = prefConta || (contaEscolhida &amp;&amp; contaEscolhida.account_id) || idDemo;
  const existe = alvo &amp;&amp; contas.some(a =&gt; a.account_id === alvo);
  sel.value = existe ? alvo : (contas[0] ? contas[0].account_id : &quot;&quot;);
  contaEscolhida = contas.find(a =&gt; a.account_id === sel.value) || contas[0] || null;
}

function escolherConta(){
  const sel = $(&quot;cfgConta&quot;);
  if (sel &amp;&amp; sel.value !== &quot;&quot;){
    const acc = contas.find(a =&gt; a.account_id === sel.value);
    if (acc) contaEscolhida = acc;
  }
  return contaEscolhida || contas[0] || null;
}

/* ---------- WebSocket ---------- */
function abrirSocket(url, aut){
  conectando = true;
  setStatus(&quot;Conectando…&quot;, &quot;&quot;);
  logBot(&quot;Abrindo WebSocket &quot; + (aut ? &quot;autenticado&quot; : &quot;público&quot;) + &quot; …&quot;);

  try { ws = new WebSocket(url); }
  catch(e){
    conectando = false;
    setStatus(&quot;Erro&quot;, &quot;err&quot;);
    setConnMsg(&quot;Erro ao criar WebSocket: &quot; + e.message, &quot;err&quot;);
    return;
  }

  clearTimeout(timeoutConexao);
  timeoutConexao = setTimeout(() =&gt; {
    if (!conectado){
      try { ws.close(); } catch(e){}
      conectando = false;
      setStatus(&quot;Erro de conexão&quot;, &quot;err&quot;);
      setConnMsg(&quot;❌ O WebSocket não respondeu em 12s. Verifique internet, VPN/firewall, bloqueador de anúncios ou se a página está sendo aberta dentro de uma pré-visualização (iframe).&quot;, &quot;err&quot;);
    }
  }, 12000);

  ws.onopen = () =&gt; {
    clearTimeout(timeoutConexao);
    conectando = false;
    conectado = true;
    reconectarTentativas = 0;
    autorizado = !!aut;
    setStatus(aut ? &quot;Conectado&quot; : &quot;Mercado (público)&quot;, &quot;on&quot;);
    $(&quot;btnDisconnect&quot;).disabled = false;
    setConnMsg(aut
      ? &quot;✅ WebSocket &lt;b&gt;autenticado&lt;/b&gt; conectado&quot; + (conta ? &quot; na conta &lt;b&gt;&quot; + conta.loginid + &quot;&lt;/b&gt;&quot; : &quot;&quot;) + &quot;.&quot;
      : &quot;✅ Conectado ao &lt;b&gt;mercado público&lt;/b&gt; (sem token: só leitura de mercado).&quot;, &quot;ok&quot;);
    logBot(&quot;WebSocket conectado (&quot; + (aut ? &quot;autenticado&quot; : &quot;público&quot;) + &quot;).&quot;, &quot;ok&quot;);
    try { enviar({ ping: 1 }); } catch(e){}
    if (aut) { try { enviar({ balance: 1, subscribe: 1 }); } catch(e){} }
    renderConta();
    liberarStart();
    assinarMercado();
    // RELIGAÇÃO AUTOMÁTICA: se o bot estava rodando quando a conexão caiu,
    // volta a operar sozinho (sem passar pelo painel de confirmação),
    // preservando perda acumulada, estatísticas e modo de stake.
    if (religarAposReconexao &amp;&amp; !parandoManual &amp;&amp; !religarTimer){
      religarTimer = setTimeout(function(){
        religarTimer = null;
        try {
          const c = lerConfig();
          if (religarAposReconexao &amp;&amp; !parandoManual &amp;&amp; !rodando &amp;&amp; conectado &amp;&amp; (c.sim || autorizado) &amp;&amp; !(c.recuperar &amp;&amp; c.bloco &lt; 2)){
            religarAposReconexao = false;
            logBot(&quot;🔌 Conexão restabelecida — religando o bot automaticamente.&quot;, &quot;ok&quot;);
            iniciarBotAgora();
            if (rodando &amp;&amp; typeof ciAbrirRodando === &quot;function&quot;) ciAbrirRodando();
          }
        } catch(e){}
      }, 2500);
    }
  };

  ws.onmessage = ev =&gt; {
    let msg;
    try { msg = JSON.parse(ev.data); } catch(e){ return; }
    tratarMensagem(msg);
  };

  ws.onclose = ev =&gt; {
    clearTimeout(timeoutConexao);
    const eraConectado = conectado;
    conectado = false; autorizado = false; conectando = false;
    $(&quot;btnDisconnect&quot;).disabled = true;
    $(&quot;btnStart&quot;).disabled = true;
    // RELIGAÇÃO AUTOMÁTICA: se o bot estava rodando quando a conexão caiu
    // (queda de rede, não parada manual), marca para religar após reconectar.
    const eraRodando = rodando;
    if (eraRodando) pararBot(&quot;desconexao&quot;);
    if ((eraRodando || religarAposReconexao) &amp;&amp; !parandoManual) religarAposReconexao = true;

    // OTP é de uso único: reconectar exige novo OTP. Reconexao automatica limitada.
    const cfg = lerConfig();
    const podeReconectar = eraConectado &amp;&amp; !parandoManual &amp;&amp; reconectarTentativas &lt; 3 &amp;&amp; (aut ? !!cfg.token : true);
    if (podeReconectar){
      reconectarTentativas++;
      setStatus(&quot;Reconectando…&quot;, &quot;&quot;);
      setConnMsg(&quot;⚠️ Conexão caiu (código &quot; + ev.code + &quot;). Reconectando &quot; + reconectarTentativas + &quot;/3…&quot;, &quot;&quot;);
      setTimeout(conectar, 1500);
      return;
    }

    setStatus(&quot;Desconectado&quot;, &quot;&quot;);
    if (!eraConectado){
      setConnMsg(&quot;❌ Falha ao abrir o WebSocket (código &quot; + ev.code + (ev.reason ? &quot; — &quot; + ev.reason : &quot;&quot;) + &quot;).&lt;br&gt;&quot; +
        &quot;Verifique internet, VPN/firewall, bloqueador de anúncios ou pré-visualização em iframe.&quot;, &quot;err&quot;);
      logBot(&quot;Falha ao conectar: código &quot; + ev.code + (ev.reason ? &quot; (&quot; + ev.reason + &quot;)&quot; : &quot;&quot;), &quot;err&quot;);
    } else {
      setConnMsg(&quot;Conexão encerrada (código &quot; + ev.code + &quot;).&quot;, &quot;&quot;);
    }
  };

  ws.onerror = () =&gt; logBot(&quot;Erro de rede no WebSocket.&quot;, &quot;err&quot;);
}

function desconectar(){
  parandoManual = true;
  religarAposReconexao = false;   // saida manual cancela a religacao automatica
  if (religarTimer){ clearTimeout(religarTimer); religarTimer = null; }
  reconectarTentativas = 99;
  clearTimeout(timeoutConexao);
  conectando = false;
  if (rodando) pararBot(&quot;manual&quot;);
  tradeAtivo = null; colocando = false;
  if (ws){ try { ws.close(); } catch(e){} }
  ws = null; conectado = false; autorizado = false; autenticado = false; conta = null;
  setStatus(&quot;Desconectado&quot;, &quot;&quot;);
  $(&quot;btnDisconnect&quot;).disabled = true;
  $(&quot;btnStart&quot;).disabled = true;
  $(&quot;balanceTxt&quot;).textContent = &quot;—&quot;;
  $(&quot;acctBadges&quot;).innerHTML = &quot;&quot;;
  setConnMsg(&quot;Desconectado.&quot;, &quot;&quot;);
  logBot(&quot;Desconectado.&quot;);
}

function enviar(payload){
  if (!ws || ws.readyState !== 1) throw new Error(&quot;Sem conexão&quot;);
  payload.req_id = reqSeq++;
  ws.send(JSON.stringify(payload));
  return payload.req_id;
}

function requisicao(payload, timeoutMs){
  return new Promise((res, rej) =&gt; {
    const id = enviar(payload);
    pendentes[id] = { res, rej };
    setTimeout(() =&gt; {
      if (pendentes[id]){ delete pendentes[id]; rej(new Error(&quot;Tempo esgotado na resposta da Deriv&quot;)); }
    }, timeoutMs || 10000);
  });
}

/* Na API nova nao existe &quot;authorize&quot;: a autenticacao vem do OTP na URL do WebSocket. */

/* =====================================================================
   ROTEAMENTO DE MENSAGENS
   ===================================================================== */
function tratarMensagem(msg){
  ultimaMsgTs = Date.now();   // marca atividade do WebSocket (watchdog)
  // respostas de requisicao() por req_id
  if (msg.req_id &amp;&amp; pendentes[msg.req_id]){
    const p = pendentes[msg.req_id];
    delete pendentes[msg.req_id];
    if (msg.error) p.rej(new Error(msg.error.message || &quot;erro Deriv&quot;));
    else p.res(msg);
    // nao retorna: msgs de subscribe tambem podem ter req_id
  }

  if (msg.error){
    tratarErro(msg.error);
    return;
  }

  // guarda os IDs de assinatura (necessarios para &quot;forget&quot; ao trocar modo/ativo)
  if (msg.subscription &amp;&amp; msg.subscription.id){
    if (msg.msg_type === &quot;candles&quot; || msg.msg_type === &quot;ohlc&quot;) subIdCandles = msg.subscription.id;
    if (msg.msg_type === &quot;tick&quot;) subIdTicks = msg.subscription.id;
  }

  switch(msg.msg_type){
    case &quot;balance&quot;:   aoSaldo(msg.balance); break;
    case &quot;candles&quot;:   aoHistoricoVelas(msg.candles); break;
    case &quot;ohlc&quot;:      aoOHLC(msg.ohlc); break;
    case &quot;tick&quot;:      aoTick(msg.tick); break;
    case &quot;proposal_open_contract&quot;: aoContrato(msg.proposal_open_contract); break;
    case &quot;buy&quot;:       aoCompra(msg.buy); break;
    case &quot;contracts_for&quot;: aoContractsFor(msg.contracts_for); break;
    case &quot;transaction&quot;: break;
    case &quot;ping&quot;: break;
  }
}

function tratarErro(err){
  const txt = (err.message || &quot;&quot;).toString();
  console.warn(&quot;Deriv error:&quot;, err);
  setConnMsg(&quot;Deriv: &quot; + txt, &quot;err&quot;);
  if (tradeAtivo &amp;&amp; !tradeAtivo.sim &amp;&amp; !tradeAtivo.contratoId){
    tradeAtivo = null; colocando = false;
  }
}

   ASSINATURA DE MERCADO

function assinarMercado(){

  const cfg = lerConfig();

  unidades = []; unidadeAtual = null; ultimoTick = null;
  sinalPendente = null; seq = null;

  // Assinatura/conexao nova: descarta qualquer contrato rastreado no socket
  // anterior. Sem isto o bot continuava com &quot;operacao em andamento&quot; presa e
  // nunca mais entrava depois de uma queda/reconexao.
  tradeAtivo = null; colocando = false;
  ultimaMsgTs = Date.now(); watchdogAvisou = false;
