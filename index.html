function renderBlocos(){
  const cfg = lerConfig();
  const baEl = $(&quot;qcAnterior&quot;), bcEl = $(&quot;qcAtual&quot;), qi = $(&quot;qcInfo&quot;);
  if (!baEl &amp;&amp; !bcEl &amp;&amp; !qi) return;

  if (cfg.modo !== &quot;risefall&quot;){
    if (qi) qi.textContent = &quot;A contagem por quadrante (posição da vela) vale no modo VELAS (&quot; + cfg.velaMin + &quot; min). No modo ticks o índice vem da sessão.&quot;;
    if (baEl) baEl.innerHTML = &quot;&quot;;
    if (bcEl) bcEl.innerHTML = &quot;&quot;;
    return;
  }

  const lista = unidades.map((u, i) =&gt; ({ ...u, cor: corDaUnidade(u, i &gt; 0 ? unidades[i - 1] : null) }));
  const pos   = lista.map(u =&gt; indiceDeBlocoSeConhecido(u.epoch));

  let ultBi = null;
  for (let i = pos.length - 1; i &gt;= 0; i--){ if (pos[i]){ ultBi = pos[i].bi; break; } }

  const atual = [], anterior = [];
  if (ultBi !== null){
    lista.forEach((u, i) =&gt; {
      const p = pos[i]; if (!p) return;
      if (p.bi === ultBi)        atual.push({ ...u, posVela: p.ii });
      else if (p.bi === ultBi-1) anterior.push({ ...u, posVela: p.ii });
    });
  }

  // Onde o bot JÁ entrou neste quadrante (valor da vela -&gt; ENTRADA / GALE n).
  // Deixa claro na tela que a entrada de quadrante novo é SEMPRE a vela 1 e
  // que as velas seguintes são GALE, igual ao painel.
  const marcas = {};
  logs.forEach(l =&gt; {
    if (l.blockIndex === ultBi) marcas[l.index] = (l.gale &gt; 0 ? &quot;GALE &quot; + l.gale : &quot;ENTRADA&quot;);
  });
  if (tradeAtivo &amp;&amp; tradeAtivo.blockIndex === ultBi){
    marcas[tradeAtivo.index] = (tradeAtivo.gale &gt; 0 ? &quot;GALE &quot; + tradeAtivo.gale : &quot;ENTRADA&quot;);
  }
  atual.forEach(u =&gt; { if (marcas[u.posVela]) u.marca = marcas[u.posVela]; });

  if (baEl) baEl.innerHTML = renderUnidades(anterior);
  if (bcEl) bcEl.innerHTML = renderUnidades(atual);

  if (qi){
    if (ultBi === null || !atual.length){
      qi.innerHTML = &quot;aguardando velas… · &lt;b&gt;Qtd. por bloco &quot; + cfg.bloco + &quot;&lt;/b&gt; · vela &lt;b&gt;&quot; + cfg.velaMin + &quot; min&lt;/b&gt; · âncora &quot; +
        (cfg.ancora === &quot;dia&quot; ? &quot;00:00 UTC (igual painel)&quot; : &quot;INÍCIO DA SESSÃO&quot;);
      return;
    }
    const ini = atual[0], fim = atual[atual.length - 1];
    const cRef = anterior.length ? corMaioria(anterior) : null;

    // CONFERÊNCIA DE ALINHAMENTO COM O PAINEL -----------------------------
    // O painel corta as velas do dia (00:00 UTC) de N em N. Logo, com âncora
    // 00:00 UTC o início de um quadrante SÓ pode cair em :00, :05, :10...
    // (múltiplos de N). Se cair fora do grid, a contagem NÃO é a do painel.
    const passo  = Math.max(1, Math.min(60, cfg.bloco));
    const diaIniE = window.__painelDiaInicio ? epochDeTimePainel(window.__painelDiaInicio) : null;
    let noGrid, grid;
    if (diaIniE != null){
      // CONFERE NA GRADE POSICIONAL DO PAINEL: a posicao da vela no dia
      // (a partir da 1ª vela que o painel tem) tem de ser multipla do bloco.
      const posNoDia = Math.round((ini.epoch - diaIniE) / 60);
      noGrid = posNoDia &gt;= 0 &amp;&amp; (posNoDia % passo === 0);
      grid   = &quot;posições &quot; + passo + &quot;·&quot; + (passo*2) + &quot;·&quot; + (passo*3) +
               &quot;… a partir de &quot; + horaUTC(diaIniE) + &quot; UTC (1ª vela do painel)&quot;;
    } else {
      const minDia = minutoDiaUTC(ini.epoch);
      noGrid = (minDia % passo) === 0;
      grid   = &quot;00:&quot; + String(passo).padStart(2, &quot;0&quot;) + &quot;, 00:&quot; + String(passo*2).padStart(2, &quot;0&quot;) + &quot;…&quot;;
    }

    const avisos = [];
    if (cfg.ancora !== &quot;dia&quot;)
      avisos.push(&quot;Âncora = &lt;b&gt;Início da sessão&lt;/b&gt;: o painel corta por &lt;b&gt;dia (00:00 UTC)&lt;/b&gt; — mude para &lt;b&gt;00:00 UTC (igual painel)&lt;/b&gt;.&quot;);
    if (!noGrid)
      avisos.push(&quot;Início do quadrante em &lt;b&gt;&quot; + horaUTC(ini.epoch) + &quot; UTC&lt;/b&gt; está FORA do grid de &quot; + passo +
                  &quot; min do painel (deveria ser :&quot; + String(passo).padStart(2,&quot;0&quot;) + &quot;, :&quot; +
                  String(passo*2).padStart(2,&quot;0&quot;) + &quot;…). Confira &lt;b&gt;Qtd. por bloco&lt;/b&gt; e a &lt;b&gt;âncora&lt;/b&gt; — está desalinhado do painel.&quot;);

    qi.innerHTML =
      &quot;Quadrante &lt;b&gt;&quot; + ultBi + &quot;&lt;/b&gt; · vela &lt;b&gt;&quot; + atual.length + &quot;&lt;/b&gt; de &lt;b&gt;&quot; + cfg.bloco +
      &quot;&lt;/b&gt; · início &lt;b&gt;&quot; + horaUTC(ini.epoch) + &quot; UTC&lt;/b&gt; · última &quot; + horaUTC(fim.epoch) + &quot; UTC&quot; +
      (cRef ? &quot; · padrão do quadrante anterior: &lt;b style=\&quot;color:&quot; +
        (cRef === &quot;G&quot; ? &quot;var(--green)&quot; : &quot;var(--red)&quot;) + &quot;\&quot;&gt;&quot; +
        (cRef === &quot;G&quot; ? &quot;VERDE&quot; : &quot;VERMELHO&quot;) + &quot;&lt;/b&gt;&quot; : &quot;&quot;) +
      &quot;&lt;br&gt;Qtd. por bloco &lt;b&gt;&quot; + cfg.bloco + &quot;&lt;/b&gt; · vela &lt;b&gt;&quot; + cfg.velaMin + &quot; min&lt;/b&gt; · âncora &lt;b&gt;&quot; +
        (cfg.ancora === &quot;dia&quot; ? &quot;00:00 UTC (igual painel)&quot; : &quot;INÍCIO DA SESSÃO&quot;) +

function horaDe(epoch){

/* Horário em UTC - é o relógio do painel (as velas do *_blocos.json vêm em
   UTC), então a conferência do card 5.0 tem de ser feita em UTC. */
function horaUTC(epoch){
  const d = new Date(Number(epoch) * 1000);
  return String(d.getUTCHours()).padStart(2, &quot;0&quot;) + &quot;:&quot; + String(d.getUTCMinutes()).padStart(2, &quot;0&quot;);
}

/* Minuto do dia em UTC (0..1439) - base da conferência do grid do painel. */
function minutoDiaUTC(epoch){
  const d = new Date(Number(epoch) * 1000);
  return d.getUTCHours() * 60 + d.getUTCMinutes();
}

function nomeArquivoPainel(simbolo){
  return NOME_ARQUIVO_PAINEL[simbolo] || (simbolo + &quot;_blocos.json&quot;);
}

function doisDig(n){ return String(n).padStart(2, &quot;0&quot;); }

/* epoch (UTC) -&gt; &quot;AAAA.MM.DD HH:MM&quot; (mesmo formato que o painel ordena) */
function timePainelDoEpoch(epoch){
  const d = new Date(Number(epoch) * 1000);
  return d.getUTCFullYear() + &quot;.&quot; + doisDig(d.getUTCMonth() + 1) + &quot;.&quot; + doisDig(d.getUTCDate()) +
         &quot; &quot; + doisDig(d.getUTCHours()) + &quot;:&quot; + doisDig(d.getUTCMinutes());
}

/* &quot;AAAA.MM.DD HH:MM&quot; (UTC) -&gt; epoch */
function epochDeTimePainel(txt){
  const m = String(txt || &quot;&quot;).match(/(\d{4})\.(\d{2})\.(\d{2})\s+(\d{2}):(\d{2})/);
  if (!m) return null;
  return Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], 0) / 1000);
}

/* Plano de quadrantes publicado pelo PAINEL (grade posicional real).
   O bot casa a vela pelo horário da VELA 1 e usa o SINAL do painel. */
function planoPainelDaVela(epoch){
  if (epoch === null || epoch === undefined || !isFinite(Number(epoch))) return null;
  const plano = window.__painelPlano;
  if (!Array.isArray(plano) || !plano.length) return null;
  const alvo = timePainelDoEpoch(epoch);
  for (let i = 0; i &lt; plano.length; i++){
    if (plano[i] &amp;&amp; plano[i].ini === alvo) return plano[i];
  }
  return null;
}

/* Monta a lista de velas no formato exato do painel. */
function velasParaPainel(){
  return unidades.map(u =&gt; ({
    time: timePainelDoEpoch(u.epoch),
    candle: (u.cor === &quot;V&quot;) ? &quot;V&quot; : &quot;G&quot;   // o painel só entende G/V; empate (D) entra como G
  }));
}

/* =====================================================================
   ESPELHO DO PAINEL TRADING (postMessage)
   ---------------------------------------------------------------------
   O Painel (aba 📊 PAINEL) envia o HTML já renderizado das suas seções
   para o documento pai, que repassa para este bot. Aqui o conteúdo é
   montado dentro de um Shadow DOM — assim os estilos do Painel valem
   exatamente como no painel, sem interferir no visual do bot.
   ===================================================================== */
(function(){
  const host = document.getElementById(&quot;espelhoPainel&quot;);
  if (!host) return;

  let sr = null, conteudo = null, cssAplicado = false;

  function garantir(){
    if (sr) return;
    sr = host.attachShadow({ mode: &quot;open&quot; });
    const base = document.createElement(&quot;style&quot;);
    base.textContent =
      &quot;#conteudoEspelho{display:flex;flex-direction:column;gap:18px;align-items:center;padding:4px 0}&quot; +
      &quot;.espelhoRow{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;align-items:flex-start}&quot; +
      &quot;.espelhoCol{display:flex;flex-direction:column;gap:15px}&quot; +
      &quot;.espelhoScroll{overflow-x:auto;max-width:100%;width:100%}&quot; +
      &quot;.espelhoAviso{color:#9aa0a6;font-family:system-ui,Arial,sans-serif;font-size:13px}&quot;;
    sr.appendChild(base);

    conteudo = document.createElement(&quot;div&quot;);
    conteudo.id = &quot;conteudoEspelho&quot;;
    conteudo.innerHTML = &#x27;&lt;div class=&quot;espelhoAviso&quot;&gt;Aguardando o Painel Trading carregar os .json…&lt;/div&gt;&#x27;;
    sr.appendChild(conteudo);
  }

  window.addEventListener(&quot;message&quot;, function(ev){
    const d = ev.data;
    if (!d || !d.__painelMirror) return;
    garantir();

    if (d.css &amp;&amp; !cssAplicado){
      const st = document.createElement(&quot;style&quot;);
      st.textContent = d.css;
      sr.insertBefore(st, sr.firstChild);
      cssAplicado = true;
    }

    sincronizarFiltro(d.estado);
    if (typeof d.seq === &quot;string&quot;) window.__painelSeq = d.seq;
    if (Array.isArray(d.ops)) window.__painelOps = d.ops;
    if (d.quadrantes != null) window.__painelQuadrantes = d.quadrantes;
    if (d.estado) window.__painelEstadoFiltro = d.estado;
    if (Array.isArray(d.plano)) window.__painelPlano = d.plano;
    if (d.bloco != null) window.__painelBloco = d.bloco;
    if (d.galeCfg != null) window.__painelGale = d.galeCfg;

    // INICIO DO DIA USADO PELO PAINEL: se mudou, reindexa as velas para a
    // grade posicional do painel (a entrada passa a cair na mesma vela).
    if (typeof d.diaInicio === &quot;string&quot; &amp;&amp; d.diaInicio &amp;&amp; d.diaInicio !== window.__painelDiaInicio){
      window.__painelDiaInicio = d.diaInicio;
      try {
        reconstruirIndicesBloco(lerConfig());
        reconstruirSinalDeAbertura();
        renderBlocos();
      } catch(e){}
    }

    const s = d.secs || {};
    const bloco = id =&gt; { const h = s[id]; return (h &amp;&amp; h.trim()) ? h : &quot;&quot;; };

    const quad = bloco(&quot;ultimosQuadrantes&quot;);
    const velas5 = bloco(&quot;ultimasVelas&quot;);

    if (!quad &amp;&amp; !velas5 &amp;&amp; !ultima &amp;&amp; !qtd &amp;&amp; !melhorPar &amp;&amp; !rankAlta &amp;&amp; !rankPares &amp;&amp; !rankDias) return;

    let html = &quot;&quot;;
    if (quad || velas5 || ultima || qtd){
      html += &#x27;&lt;div class=&quot;espelhoRow&quot;&gt;&#x27; + quad +
              velas5 +
              &#x27;&lt;div class=&quot;espelhoCol&quot;&gt;&#x27; + ultima + qtd + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

    if (rankAlta) html += &#x27;&lt;div class=&quot;espelhoScroll espelhoBlocoAlta&quot;&gt;&#x27; + rankAlta + &#x27;&lt;/div&gt;&#x27;;

    if (conteudo.dataset.sig !== html){

    aplicarToquesRank();
  });

  garantir();

  /* ==================================================================
     FILTRO EM CIMA DO ESPELHO — comanda o PRÓPRIO Painel Trading
     ------------------------------------------------------------------
     O bot envia os valores para o documento pai, que repassa ao painel;
     o painel aplica nos seus controles e re-renderiza. O painel devolve
     o estado a cada segundo, então o filtro fica sempre sincronizado.
     ================================================================== */
  const PARES_ESPELHO = [
    [&quot;EURUSD_blocos.json&quot;,&quot;EURUSD&quot;],
    [&quot;BTCUSD_blocos.json&quot;,&quot;BTCUSD&quot;],
    [&quot;Volatility10Index_blocos.json&quot;,&quot;VOLATILITY10INDEX&quot;],
    [&quot;Volatility5(1s)Index_blocos.json&quot;,&quot;VOLATILITY5(1S)INDEX&quot;],
    [&quot;Volatility10(1s)Index_blocos.json&quot;,&quot;VOLATILITY10(1S)INDEX&quot;],
    [&quot;Volatility15(1s)Index_blocos.json&quot;,&quot;VOLATILITY15(1S)INDEX&quot;],
    [&quot;Volatility25(1s)Index_blocos.json&quot;,&quot;VOLATILITY25(1S)INDEX&quot;],
    [&quot;Volatility30(1s)Index_blocos.json&quot;,&quot;VOLATILITY30(1S)INDEX&quot;],
    [&quot;Volatility50(1s)Index_blocos.json&quot;,&quot;VOLATILITY50(1S)INDEX&quot;],
    [&quot;Volatility75(1s)Index_blocos.json&quot;,&quot;VOLATILITY75(1S)INDEX&quot;],
    [&quot;Volatility90(1s)Index_blocos.json&quot;,&quot;VOLATILITY90(1S)INDEX&quot;],
    [&quot;Volatility100(1s)Index_blocos.json&quot;,&quot;VOLATILITY100(1S)INDEX&quot;]
  ];

  const fxPar = $(&quot;fxPar&quot;), fxData = $(&quot;fxData&quot;), fxModo = $(&quot;fxModoVelas&quot;),
        fxGale = $(&quot;fxGale&quot;), fxStatus = $(&quot;fxStatus&quot;);

  if (fxPar &amp;&amp; !fxPar.options.length)
    fxPar.innerHTML = PARES_ESPELHO.map(p =&gt; &#x27;&lt;option value=&quot;&#x27; + p[0] + &#x27;&quot;&gt;&#x27; + p[1] + &#x27;&lt;/option&gt;&#x27;).join(&quot;&quot;);

  if (fxGale &amp;&amp; !fxGale.options.length){
    let gOpts = &#x27;&lt;option value=&quot;0&quot;&gt;SEM GALE&lt;/option&gt;&#x27;;
    for (let gi = 1; gi &lt;= 10; gi++)
      gOpts += &#x27;&lt;option value=&quot;&#x27; + gi + &#x27;&quot;&#x27; + (gi === 1 ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + gi + &#x27; GALE&lt;/option&gt;&#x27;;
    fxGale.innerHTML = gOpts;
  }

  function enviarControle(recarregar){
    if (!fxPar) return;
    const campos = { par: fxPar.value, data: fxData.value, modoVelas: fxModo.value, gale: fxGale.value };
    if (fxStatus) fxStatus.textContent = &quot;aplicando…&quot;;
    try { parent.postMessage({ __painelControle: true, campos: campos, recarregar: !!recarregar }, &quot;*&quot;); } catch(e){}
    setTimeout(() =&gt; { if (fxStatus) fxStatus.textContent = &quot;✔ aplicado&quot;; }, 700);
  }

  [fxPar, fxData, fxModo, fxGale].forEach(el =&gt; {
    if (!el) return;
    el.addEventListener(&quot;change&quot;, () =&gt; {
      if (el === fxModo &amp;&amp; fxModo.value === &quot;&quot;) return;
      enviarControle(el === fxPar || el === fxData);
    });
    if (el === fxModo)
      el.addEventListener(&quot;input&quot;, () =&gt; { if (fxModo.value !== &quot;&quot;) enviarControle(false); });
  });

  const btnFiltrar = $(&quot;fxFiltrar&quot;);
  if (btnFiltrar) btnFiltrar.addEventListener(&quot;click&quot;, () =&gt; enviarControle(true));

  function sincronizarFiltro(est){
    if (!est) return;
    [[fxPar, est.par], [fxData, est.data], [fxModo, est.modoVelas], [fxGale, est.gale]]
      .forEach(par =&gt; {
        const el = par[0], val = par[1];
        if (!el || val === undefined || val === null) return;
        if (document.activeElement === el) return;
        if (String(el.value) !== String(val)) el.value = val;
      });
  }

  /* ==================================================================
     ABERTO / FECHADO dos rankings &quot;ESTRATÉGIA EM ALTA&quot;
     (🏆 RANK — ESTRATÉGIA EM ALTA POR DIA  e  ESTRATÉGIA EM ALTA — POR DIA)
     ================================================================== */
  let mostrarRankAlta = true, mostrarRankDia = true;

  function aplicarToquesRank(){
    if (!sr) return;
    const a = sr.querySelector(&quot;.espelhoBlocoAlta&quot;);
    const b = sr.querySelector(&quot;.espelhoBlocoDia&quot;);
    if (a) a.style.display = mostrarRankAlta ? &quot;&quot; : &quot;none&quot;;
    if (b) b.style.display = mostrarRankDia ? &quot;&quot; : &quot;none&quot;;
  }

  function ligarToque(idAberto, idFechado, set){
    const bA = $(idAberto), bF = $(idFechado);
    function pintar(v){
      if (bA) bA.classList.toggle(&quot;ativo&quot;, v === true);
      if (bF) bF.classList.toggle(&quot;ativo&quot;, v === false);
    }
    if (bA) bA.addEventListener(&quot;click&quot;, () =&gt; { set(true);  pintar(true);  aplicarToquesRank(); });
    if (bF) bF.addEventListener(&quot;click&quot;, () =&gt; { set(false); pintar(false); aplicarToquesRank(); });
  }

  ligarToque(&quot;tgAltaAberto&quot;, &quot;tgAltaFechado&quot;, v =&gt; { mostrarRankAlta = v; });
  ligarToque(&quot;tgDiaAberto&quot;,  &quot;tgDiaFechado&quot;,  v =&gt; { mostrarRankDia  = v; });
})();

/* =====================================================================
   CALCULADORA MASANIELLO
   ---------------------------------------------------------------------
   ALVO  = B / P(X &gt;= W),  X ~ Binomial(N, p),  p = 1/odd
           (mesma conta do &quot;RESULTADO A SER ATINGIDO&quot; do Efraim Traders).
   STAKE = (ALVO - banca) / ( (odd-1) * vitorias_restantes )  *  %reinvestir
           -&gt; atinge o ALVO após exatamente W acertos, em qualquer ordem,
              e nunca resulta em aposta negativa.
   ===================================================================== */
(function(){
  const g = id =&gt; document.getElementById(id);
  if (!g(&quot;msBanca&quot;)) return;

  const brl = v =&gt; (Number(v)||0).toLocaleString(&quot;pt-BR&quot;, {minimumFractionDigits:2, maximumFractionDigits:2});

  /* P(X &gt;= W) para X ~ Binomial(N, p=1/odd) */
  function probSucesso(N, W, odd){
    N = Math.max(1, Math.min(500, Math.floor(N) || 1));
    W = Math.max(0, Math.min(N, Math.floor(W) || 0));
    if (W &lt;= 0) return 1;
    var p = 1 / odd, q = 1 - p;
    if (!(p &gt; 0)) return 0;
    if (!(q &gt; 0)) return 1;
    var lf = new Array(N + 1); lf[0] = 0;
    for (var i = 1; i &lt;= N; i++) lf[i] = lf[i-1] + Math.log(i);
    var lp = Math.log(p), lq = Math.log(q), best = -Infinity, lw = new Array(N + 1);
    for (var k = 0; k &lt;= N; k++){
      lw[k] = lf[N] - lf[k] - lf[N-k] + k * lp + (N-k) * lq;
      if (lw[k] &gt; best) best = lw[k];
    }
    var tot = 0, cauda = 0;
    for (var j = 0; j &lt;= N; j++){
      var w = Math.exp(lw[j] - best); tot += w;
      if (j &gt;= W) cauda += w;
    }
    return Math.max(cauda / tot, 1e-12);
  }

  function cfg(){
    let b = parseFloat(g(&quot;msBanca&quot;).value); if (!isFinite(b) || b &lt;= 0) b = 1000;
    let N = parseInt(g(&quot;msN&quot;).value, 10); if (!isFinite(N) || N &lt; 1) N = 1; N = Math.min(500, N);
    let W = parseInt(g(&quot;msW&quot;).value, 10); if (!isFinite(W) || W &lt; 1) W = 1; W = Math.min(500, W);
    if (W &gt; N) W = N;
    let odd = parseFloat(g(&quot;msOdd&quot;).value); if (!isFinite(odd) || odd &lt;= 1) odd = 1.85;
    let reinv = parseFloat(g(&quot;msReinv&quot;).value); if (!isFinite(reinv) || reinv &lt;= 0) reinv = 100;
    reinv = Math.min(reinv, 100) / 100;
    let modo = g(&quot;msModo&quot;) ? g(&quot;msModo&quot;).value : &quot;MASSANIELLO&quot;;
    let entrada = parseFloat(g(&quot;msEntrada&quot;) ? g(&quot;msEntrada&quot;).value : 10); if (!isFinite(entrada) || entrada &lt;= 0) entrada = 10;
    let mult = parseFloat(g(&quot;msMult&quot;) ? g(&quot;msMult&quot;).value : 2.5); if (!isFinite(mult) || mult &lt; 1) mult = 1;
    let divisor = parseFloat(g(&quot;msDivisor&quot;) ? g(&quot;msDivisor&quot;).value : 80); if (!isFinite(divisor) || divisor &lt;= 0) divisor = 80;
    return { banca: b, N: N, W: W, odd: odd, reinv: reinv, reiniciar: g(&quot;msReiniciar&quot;).value === &quot;SIM&quot;,
             modo: modo, entrada: entrada, mult: mult, divisor: divisor / 100 };
  }

  const st = { base: 0, alvo: 0, banca: 0, wins: 0, erros: 0, ops: 0, ciclos: 0, lucroTotal: 0, det: [], motivo: null };

  function novoCiclo(){
    const c = cfg();
    st.base = c.banca;
    st.alvo = c.banca / probSucesso(c.N, c.W, c.odd);
    st.banca = c.banca;
    st.wins = 0; st.erros = 0; st.ops = 0; st.det = []; st.motivo = null;
  }

  function stakeAtual(){
    const c = cfg();
    const restam = c.W - st.wins;
    if (restam &lt;= 0 || st.banca &lt;= 0) return 0;
    const dist = st.alvo - st.banca;
    if (dist &lt;= 0) return 0;
    const s = (dist / ((c.odd - 1) * restam)) * c.reinv;
    // nunca aposta mais do que a banca do ciclo
    return Math.max(0, Math.min(s, st.banca));
  }

  function aplicarPasso(res){
    const c = cfg();
    const stake = stakeAtual();
    const restamAntes = Math.max(0, c.W - st.wins);
    if (res === &quot;w&quot;){ st.banca += stake * (c.odd - 1); st.wins++; }
    else { st.banca -= stake; st.erros++; }
    if (st.banca &lt; 0) st.banca = 0;
    st.ops++;
    st.det.push({ n: st.ops, restam: restamAntes, stake: stake, res: res, banca: st.banca });

    let motivo = null;
    if (st.banca &lt;= 1e-9) motivo = &quot;BANCA ZERADA&quot;;
    else if (c.reiniciar &amp;&amp; st.banca &gt; st.base) motivo = &quot;FECHOU NO POSITIVO&quot;;
    else if (st.wins &gt;= c.W) motivo = &quot;META ATINGIDA&quot;;

    if (motivo){
      st.ciclos++;
      st.lucroTotal += (st.banca - c.banca);
      st.motivo = motivo;
      const z = st.banca &lt;= 1e-9;
      const det = st.det.slice();
      novoCiclo();
      st.det = z ? det : []; // mantém o histórico quando zerou
    }
    render();
  }

  /* Simulação de uma sequência w/l — devolve o resumo */
  function simular(seq){
    const c = cfg();
    let alvo, base = c.banca, banca = base, cWins = 0, cErros = 0;
    let gWins = 0, gLosses = 0, ops = 0, ciclos = 0, lucroTotal = 0;
    let ws = 0, ls = 0, maxWs = 0, maxLs = 0, zerou = false, ultimoMotivo = null;
    const resumo = [];

    function reiniciarCiclo(){ alvo = base / probSucesso(c.N, c.W, c.odd); banca = base; cWins = 0; cErros = 0; }

    reiniciarCiclo();

    for (let i = 0; i &lt; seq.length; i++){
      const r = seq[i];
      if (r !== &quot;w&quot; &amp;&amp; r !== &quot;l&quot;) continue;
      const restam = c.W - cWins;
      let stake = 0;
      if (restam &gt; 0 &amp;&amp; banca &gt; 0){
        const dist = alvo - banca;
        if (dist &gt; 0) stake = (dist / ((c.odd - 1) * restam)) * c.reinv;
        stake = Math.max(0, Math.min(stake, banca));
      }
      if (r === &quot;w&quot;){ banca += stake * (c.odd - 1); cWins++; gWins++; ws++; ls = 0; }
      else { banca -= stake; cErros++; gLosses++; ls++; ws = 0; }
      if (banca &lt; 0) banca = 0;
      ops++;
      if (ws &gt; maxWs) maxWs = ws;
      if (ls &gt; maxLs) maxLs = ls;

      let motivo = null;
      if (banca &lt;= 1e-9) motivo = &quot;BANCA ZERADA&quot;;
      else if (c.reiniciar &amp;&amp; banca &gt; base) motivo = &quot;FECHOU NO POSITIVO&quot;;
      else if (cWins &gt;= c.W) motivo = &quot;META ATINGIDA&quot;;

      if (motivo){
        ciclos++;
        lucroTotal += (banca - c.banca);
        ultimoMotivo = motivo;
        resumo.push({ op: ops, motivo: motivo, banca: banca });
        if (banca &lt;= 1e-9){ zerou = true; break; }
        reiniciarCiclo();
      }
    }

    // lucro acumulado de TODOS os ciclos fechados + o ciclo ainda aberto
    let lucroAcum = lucroTotal;
    if (!zerou) lucroAcum += (banca - base);
    const bancaTotalFinal = zerou ? 0 : (base + lucroAcum);
    const pct = base ? (lucroAcum / base) * 100 : 0;
    const total = gWins + gLosses;
    return {
      base: base, bancaFinal: bancaTotalFinal, bancaCiclo: (zerou ? 0 : banca),
      lucro: lucroAcum, pct: pct,
      ops: ops, wins: gWins, losses: gLosses, ciclos: ciclos,
      assert: total ? (gWins / total * 100) : 0, maxWs: maxWs, maxLs: maxLs,
      zerou: zerou, ultimoMotivo: ultimoMotivo
    };
  }

  function render(){
    const c = cfg();
    if (Math.abs(c.banca - st.base) &gt; 1e-9 || st.alvo &lt;= 0) novoCiclo();
    const isMas = c.modo === &quot;MASSANIELLO&quot;;
    const set = (id, k, v, cls) =&gt; { const el = g(id); if (!el) return; const lab = el.previousElementSibling; if (lab) lab.textContent = k; el.textContent = v; if (cls != null) el.className = &quot;v &quot; + cls; };
    if (isMas){
      const pct = st.base ? (st.alvo / st.base - 1) * 100 : 0;
      set(&quot;msAlvo&quot;, &quot;Resultado a ser atingido&quot;, &quot;R$ &quot; + brl(st.alvo), &quot;neu&quot;);
      set(&quot;msPct&quot;, &quot;Resultado esperado&quot;, (pct &gt;= 0 ? &quot;+ &quot; : &quot;- &quot;) + brl(Math.abs(pct)) + &quot; %&quot;, pct &gt;= 0 ? &quot;pos&quot; : &quot;neg&quot;);
      set(&quot;msStopWin&quot;, &quot;Stop WIN&quot;, &quot;R$ &quot; + brl(st.alvo - st.base), &quot;pos&quot;);
      set(&quot;msErros&quot;, &quot;Erros aceitos&quot;, (c.N - c.W) + &quot; de &quot; + c.N, &quot;&quot;);
    } else {
      const payout = c.odd - 1;
      let es = [c.entrada], acc = c.entrada, maxG = -1, custo = 0;
      for (let j = 1; j &lt; 80; j++){ const nx = c.modo === &quot;MULTIPLO&quot; ? es[j-1] * c.mult : acc / c.divisor; if (!isFinite(nx) || nx &gt; 1e12) break; es.push(nx); acc += nx; }
      for (let m = 0; m &lt; es.length; m++){ if (custo + es[m] &lt;= c.banca){ custo += es[m]; maxG = m; } else break; }
      set(&quot;msAlvo&quot;, &quot;Entrada inicial&quot;, &quot;R$ &quot; + brl(c.entrada), &quot;neu&quot;);
      set(&quot;msPct&quot;, &quot;Lucro por WIN&quot;, &quot;+ R$ &quot; + brl(c.entrada * payout), &quot;pos&quot;);
      set(&quot;msStopWin&quot;, &quot;Gale máx. pela banca&quot;, maxG &gt;= 0 ? (&quot;GALE &quot; + maxG) : &quot;—&quot;, &quot;pos&quot;);
      set(&quot;msErros&quot;, &quot;Payout %&quot;, brl(payout * 100) + &quot; %&quot;, &quot;&quot;);
    }
  }

  /* ---- eventos ---- */
  const MS_IDS = [&quot;msBanca&quot;,&quot;msN&quot;,&quot;msW&quot;,&quot;msOdd&quot;,&quot;msReinv&quot;,&quot;msReiniciar&quot;,&quot;msModo&quot;,&quot;msEntrada&quot;,&quot;msMult&quot;,&quot;msDivisor&quot;];
  function aplicarModo(){
    const c = cfg();
    const isMas = c.modo === &quot;MASSANIELLO&quot;;
    const show = (id, on) =&gt; { const el = g(id); if (el) el.parentElement.style.display = on ? &quot;&quot; : &quot;none&quot;; };
    show(&quot;msN&quot;, isMas); show(&quot;msW&quot;, isMas); show(&quot;msOdd&quot;, isMas); show(&quot;msReinv&quot;, isMas); show(&quot;msReiniciar&quot;, isMas);
    show(&quot;msEntrada&quot;, !isMas); show(&quot;msMult&quot;, c.modo === &quot;MULTIPLO&quot;); show(&quot;msDivisor&quot;, c.modo === &quot;DIVISOR&quot;);
  }
  MS_IDS.forEach(id =&gt; {
    const e = g(id); if (!e) return;
    e.addEventListener(&quot;input&quot;, () =&gt; { aplicarModo(); novoCiclo(); render(); });
    e.addEventListener(&quot;change&quot;, () =&gt; { aplicarModo(); novoCiclo(); render(); });
  });

  if (g(&quot;msWin&quot;)) g(&quot;msWin&quot;).addEventListener(&quot;click&quot;, () =&gt; aplicarPasso(&quot;w&quot;));
  if (g(&quot;msLoss&quot;)) g(&quot;msLoss&quot;).addEventListener(&quot;click&quot;, () =&gt; aplicarPasso(&quot;l&quot;));
  if (g(&quot;msReset&quot;)) g(&quot;msReset&quot;).addEventListener(&quot;click&quot;, () =&gt; { st.lucroTotal = 0; st.ciclos = 0; novoCiclo(); render(); });
  if (g(&quot;msDet&quot;)) g(&quot;msDet&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const d = g(&quot;msDetalhes&quot;);
    const aberto = d &amp;&amp; d.style.display !== &quot;block&quot;;
    if (d) d.style.display = aberto ? &quot;block&quot; : &quot;none&quot;;
    g(&quot;msDet&quot;).textContent = &quot;DETALHES: &quot; + (aberto ? &quot;FECHAR&quot; : &quot;ABRIR&quot;);
  });

  /* Tabela (mesmo formato da simulação real) */
  function linhasHTML(r){
    return r.linhas.map(l =&gt;
      &quot;&lt;tr&gt;&quot; +
      &quot;&lt;td&gt;&quot; + l.n + &quot;&lt;/td&gt;&quot; +
      &quot;&lt;td&gt;&quot; + l.q + &quot;&lt;/td&gt;&quot; +
      &quot;&lt;td style=&#x27;color:&quot; + (l.r === &quot;w&quot; ? &quot;var(--green)&quot; : &quot;var(--red)&quot;) + &quot;;font-weight:700&#x27;&gt;&quot; +
        (l.r === &quot;w&quot; ? &quot;WIN&quot; : &quot;LOSS&quot;) + (l.fechou ? &quot; *&quot; : &quot;&quot;) + &quot;&lt;/td&gt;&quot; +
      &quot;&lt;td&gt;R$ &quot; + brl(l.stake) + &quot;&lt;/td&gt;&quot; +
      &quot;&lt;td class=&#x27;&quot; + (l.retorno &gt;= 0 ? &quot;pos&quot; : &quot;neg&quot;) + &quot;&#x27;&gt;&quot; + (l.retorno &gt;= 0 ? &quot;+ &quot; : &quot;- &quot;) + &quot;R$ &quot; + brl(Math.abs(l.retorno)) + &quot;&lt;/td&gt;&quot; +
      &quot;&lt;td&gt;R$ &quot; + brl(l.capital) + &quot;&lt;/td&gt;&quot; +
      &quot;&lt;td&gt;&quot; + brl(l.acerto) + &quot; %&lt;/td&gt;&quot; +
      &quot;&lt;td&gt;&quot; + l.status + &quot;&lt;/td&gt;&quot; +
      &quot;&lt;/tr&gt;&quot;).join(&quot;&quot;);
  }

  function cardsHTML(r){
    return &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Lucro&lt;/div&gt;&lt;div class=&quot;v &#x27; + (r.lucro &gt;= 0 ? &quot;pos&quot; : &quot;neg&quot;) + &#x27;&quot;&gt;&#x27; +
        (r.lucro &gt;= 0 ? &quot;+&quot; : &quot;-&quot;) + brl(Math.abs(r.lucro)) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;WIN&lt;/div&gt;&lt;div class=&quot;v pos&quot;&gt;&#x27; + r.wins + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;LOSS&lt;/div&gt;&lt;div class=&quot;v neg&quot;&gt;&#x27; + r.losses + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Acerto&lt;/div&gt;&lt;div class=&quot;v neu&quot;&gt;&#x27; + brl(r.assert) + &#x27; %&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Seq. loss&lt;/div&gt;&lt;div class=&quot;v neg&quot;&gt;&#x27; + r.seqLossAtual + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Máx. loss seg.&lt;/div&gt;&lt;div class=&quot;v neg&quot;&gt;&#x27; + r.maxLs + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Operações&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;&#x27; + r.ops + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Ciclos fechados&lt;/div&gt;&lt;div class=&quot;v neu&quot;&gt;&#x27; + r.ciclos + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;Seq. win&lt;/div&gt;&lt;div class=&quot;v pos&quot;&gt;&#x27; + r.seqWinAtual + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  }

  /* ABERTO / FECHADO da tabela da sequência manual */
  let seqAberto = true, seqTemDados = false;
  function aplicarToqueSeq(){
    const t = g(&quot;msSeqTabela&quot;);
    if (t) t.style.display = (seqAberto &amp;&amp; seqTemDados) ? &quot;block&quot; : &quot;none&quot;;
    const ba = g(&quot;tgSeqAberto&quot;), bf = g(&quot;tgSeqFechado&quot;);
    if (ba) ba.classList.toggle(&quot;ativo&quot;, seqAberto);
    if (bf) bf.classList.toggle(&quot;ativo&quot;, !seqAberto);
  }
  if (g(&quot;tgSeqAberto&quot;)) g(&quot;tgSeqAberto&quot;).addEventListener(&quot;click&quot;, () =&gt; { seqAberto = true; aplicarToqueSeq(); });
  if (g(&quot;tgSeqFechado&quot;)) g(&quot;tgSeqFechado&quot;).addEventListener(&quot;click&quot;, () =&gt; { seqAberto = false; aplicarToqueSeq(); });

  g(&quot;msSeqRun&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const seq = (g(&quot;msSeq&quot;).value || &quot;&quot;).toLowerCase().replace(/[^wl]/g, &quot;&quot;);
    if (!seq){
      g(&quot;msSeqOut&quot;).textContent = &quot;Digite uma sequência com w (acerto) e l (erro).&quot;;
      seqTemDados = false; aplicarToqueSeq();
      return;
    }
    const ops = seq.split(&quot;&quot;).map((c, i) =&gt; ({ q: (i + 1), r: c }));
    const r = simularLinhas(ops);

    g(&quot;msSeqOut&quot;).innerHTML =
      &quot;&lt;b&gt;SEQUÊNCIA: &quot; + seq.toUpperCase() + &quot;&lt;/b&gt;  |  &quot; +
      &quot;GANHO REAL: &quot; + (r.lucro &gt;= 0 ? &quot;+ &quot; : &quot;- &quot;) + &quot;R$ &quot; + brl(Math.abs(r.lucro)) +
      &quot; (&quot; + (r.pct &gt;= 0 ? &quot;+&quot; : &quot;-&quot;) + brl(Math.abs(r.pct)) + &quot; %)&quot; +
      &quot;  |  BANCA TOTAL FINAL R$ &quot; + brl(r.bancaFinal) +
      &quot;  |  BANCA DO CICLO R$ &quot; + brl(r.bancaCiclo) +
      &quot;  |  OPERAÇÕES: &quot; + r.ops + &quot; (&quot; + r.wins + &quot; W / &quot; + r.losses + &quot; L)&quot; +
      &quot; · ASSERTIVIDADE &quot; + brl(r.assert) + &quot; %&quot; +
      &quot; · Maior racha LOSS: &quot; + r.maxLs + &quot; · Maior racha WIN: &quot; + r.maxWs +
      &quot; · Ciclos fechados: &quot; + r.ciclos +
      (r.zerou ? &#x27; · &lt;span class=&quot;neg&quot;&gt;❌ BANCA ZERADA&lt;/span&gt;&#x27; : &quot;&quot;);

    g(&quot;msSeqBody&quot;).innerHTML = linhasHTML(r);
    const res = g(&quot;msSeqResumo&quot;);
    if (res){ res.style.display = &quot;grid&quot;; res.innerHTML = cardsHTML(r); }

    seqTemDados = true;
    aplicarToqueSeq();
  });

  g(&quot;msSeqClear&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    g(&quot;msSeq&quot;).value = &quot;&quot;;
    g(&quot;msSeqOut&quot;).innerHTML = &quot;&quot;;
    g(&quot;msSeqBody&quot;).innerHTML = &quot;&quot;;
    const res = g(&quot;msSeqResumo&quot;);
    if (res){ res.innerHTML = &quot;&quot;; res.style.display = &quot;none&quot;; }
    seqTemDados = false;
    aplicarToqueSeq();
  });

  /* Sequência REAL a partir das velas que o PRÓPRIO bot carregou da Deriv
     (usada como alternativa quando o Painel ainda não tem dados). */
  function opsDoBot(){
    try{
      const c = lerConfig();
      const janela = Math.max(2, c.bloco | 0);
      const gale = Math.max(0, c.gale | 0);
      const lim = Math.min(1 + gale, janela);
      const lista = unidades.map((u, i) =&gt; ({
        cor: u.cor || corDaUnidade(u, i &gt; 0 ? unidades[i - 1] : null)
      }));
      const blocos = [];
      for (let i = 0; i &lt; lista.length; i += janela){
        const b = lista.slice(i, i + janela);
        if (b.length) blocos.push(b);
      }
      const ops = [];
      let q = 0, anterior = null;
      for (const b of blocos){
        if (!anterior){ anterior = b; continue; }
        const cor = corMaioria(anterior);
        if (!cor){ anterior = b; continue; }
        q++;
        let ganhou = false;
        for (let p = 1; p &lt;= lim; p++){
          if (b[p - 1] &amp;&amp; b[p - 1].cor === cor){
            for (let k = 0; k &lt; p - 1; k++) ops.push({ q: q, r: &quot;l&quot; });
            ops.push({ q: q, r: &quot;w&quot; });
            ganhou = true;
            break;
          }
        }
        if (!ganhou &amp;&amp; b.length &gt;= lim){
          for (let k = 0; k &lt; lim; k++) ops.push({ q: q, r: &quot;l&quot; });
        }
        anterior = b;
      }
      return ops;
    }catch(e){ return []; }
  }

  /* Operações REAIS vindas do Painel (com o nº do quadrante). */
  function opsDoPainel(){
    if (Array.isArray(window.__painelOps) &amp;&amp; window.__painelOps.length) return window.__painelOps;
    const s = window.__painelSeq || &quot;&quot;;
    if (!s) return [];
    let q = 0, prev = null;
    return s.split(&quot;&quot;).map(r =&gt; {
      if (r === &quot;w&quot; &amp;&amp; prev !== &quot;w&quot;) q++;
      prev = r;
      return { q: Math.max(1, q), r: r };
    });
  }

  /* Simulação linha a linha -&gt; linhas da tabela + resumo. */
  function simularLinhas(ops){
    const c = cfg();
    const isMas = c.modo === &quot;MASSANIELLO&quot;;
    const base = c.banca;
    const payout = c.odd - 1;
    let alvo = base / probSucesso(c.N, c.W, c.odd);
    let banca = base;
    let cWins = 0, cErros = 0;
    let gWins = 0, gLosses = 0, opsN = 0, ciclos = 0;
    let ws = 0, ls = 0, maxWs = 0, maxLs = 0, zerou = false;
    let lucroFechados = 0;
    let entry = c.entrada, cum = 0, gale = 0;
    const linhas = [];

    function proxima(){
      return c.modo === &quot;MULTIPLO&quot; ? entry * c.mult : cum / c.divisor;
    }

    for (let i = 0; i &lt; ops.length; i++){
      const o = ops[i];
      const r = (o &amp;&amp; o.r) === &quot;w&quot; ? &quot;w&quot; : &quot;l&quot;;
      let stake;
      if (isMas){
        const restam = c.W - cWins;
        stake = 0;
        if (restam &gt; 0 &amp;&amp; banca &gt; 0){
          const dist = alvo - banca;
          if (dist &gt; 0) stake = (dist / ((c.odd - 1) * restam)) * c.reinv;
          stake = Math.max(0, Math.min(stake, banca));
        }
      } else {
        stake = Math.max(0, Math.min(entry, banca));
      }
      let retorno, fechou = false, status;
      if (r === &quot;w&quot;){
        retorno = stake * (isMas ? (c.odd - 1) : payout);
        banca += retorno; cWins++; gWins++; ws++; ls = 0;
        fechou = isMas ? (banca &gt; base || cWins &gt;= c.W) : true;
        status = &quot;Ciclo Lucro&quot;;
      } else {
        retorno = -stake; banca -= stake; cErros++; gLosses++; ls++; ws = 0;
        status = isMas ? (cErros + &quot; de &quot; + (c.N - c.W)) : (&quot;GALE &quot; + gale);
      }
      if (banca &lt; 0) banca = 0;
      opsN++;
      if (ws &gt; maxWs) maxWs = ws;
      if (ls &gt; maxLs) maxLs = ls;

      linhas.push({
        n: opsN, q: (o &amp;&amp; o.q) || &quot;-&quot;, r: r, stake: stake, retorno: retorno,
        capital: lucroFechados + banca,
        acerto: opsN ? (gWins / opsN * 100) : 0,
        fechou: !!fechou,
        status: fechou ? &quot;Ciclo Lucro&quot; : status
      });

      if (fechou){
        ciclos++;
        lucroFechados += (banca - base);
        if (banca &lt;= 1e-9){ zerou = true; lucroFechados = -base; break; }
        alvo = base / probSucesso(c.N, c.W, c.odd);
        banca = base; cWins = 0; cErros = 0; entry = c.entrada; cum = 0; gale = 0;
      } else if (!isMas){
        cum += stake; gale++; entry = proxima();
      }
    }

    const lucroAcum = zerou ? (-base) : (lucroFechados + (banca - base));
    const total = gWins + gLosses;
    return {
      linhas: linhas, base: base, lucro: lucroAcum, pct: base ? (lucroAcum / base) * 100 : 0,
      bancaFinal: zerou ? 0 : (base + lucroAcum), bancaCiclo: zerou ? 0 : banca,
      ops: opsN, wins: gWins, losses: gLosses, ciclos: ciclos,
      assert: total ? (gWins / total * 100) : 0, maxWs: maxWs, maxLs: maxLs,
      seqWinAtual: ws, seqLossAtual: ls, zerou: zerou
    };
  }

  /* ABERTO / FECHADO da tabela da simulação real */
  let realAberto = true, realTemDados = false;
  function aplicarToqueReal(){
    const t = g(&quot;msRealTabela&quot;);
    if (t) t.style.display = (realAberto &amp;&amp; realTemDados) ? &quot;block&quot; : &quot;none&quot;;
    const ba = g(&quot;tgRealAberto&quot;), bf = g(&quot;tgRealFechado&quot;);
    if (ba) ba.classList.toggle(&quot;ativo&quot;, realAberto);
    if (bf) bf.classList.toggle(&quot;ativo&quot;, !realAberto);
  }
  if (g(&quot;tgRealAberto&quot;)) g(&quot;tgRealAberto&quot;).addEventListener(&quot;click&quot;, () =&gt; { realAberto = true; aplicarToqueReal(); });
  if (g(&quot;tgRealFechado&quot;)) g(&quot;tgRealFechado&quot;).addEventListener(&quot;click&quot;, () =&gt; { realAberto = false; aplicarToqueReal(); });

  g(&quot;msRealRun&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    let ops = opsDoPainel();
    let fonte = &quot;PAINEL (dados filtrados)&quot;;
    let quad = (window.__painelQuadrantes != null) ? window.__painelQuadrantes : &quot;—&quot;;

    if (!ops.length){
      ops = opsDoBot();
      fonte = &quot;BOT (velas ao vivo da Deriv)&quot;;
      quad = &quot;—&quot;;
    }
    if (!ops.length){
      g(&quot;msRealOut&quot;).innerHTML = &#x27;&lt;span class=&quot;neg&quot;&gt;Sem dados reais ainda.&lt;/span&gt; &#x27; +
        &quot;Ligue o bot (para carregar as velas da Deriv) ou carregue os *_blocos.json na aba PAINEL (FILTRAR).&quot;;
      realTemDados = false; aplicarToqueReal();
      return;
    }

    const lim = Math.max(1, parseInt(g(&quot;msLimite&quot;).value, 10) || 300);
    const corte = ops.slice(0, lim);
    const r = simularLinhas(corte);

    const est = window.__painelEstadoFiltro || null;
    const rotuloDia = (est &amp;&amp; est.data) ? est.data.split(&quot;-&quot;).reverse().slice(0, 2).join(&quot;/&quot;) : &quot;TODAS&quot;;
    const filtro = est
      ? (&quot;PAR &quot; + (est.par || &quot;—&quot;) + &quot; · QTD VELAS &quot; + (est.modoVelas || &quot;—&quot;) + &quot; · GALE &quot; + (est.gale || &quot;0&quot;))
      : &quot;&quot;;

    g(&quot;msRealOut&quot;).innerHTML =
      &quot;&lt;div style=&#x27;margin-bottom:4px;color:var(--cyan);font-weight:800&#x27;&gt;SIMULAÇÃO DE GANHO REAL — DIA FILTRADO (&quot; + rotuloDia + &quot;)&lt;/div&gt;&quot; +
      &quot;&lt;div style=&#x27;margin-bottom:4px&#x27;&gt;FONTE: &lt;b&gt;&quot; + fonte + &quot;&lt;/b&gt;&quot; + (filtro ? &quot;  |  &quot; + filtro : &quot;&quot;) +
      &quot;  |  LINHAS USADAS: &quot; + corte.length + &quot; de &quot; + ops.length + &quot;&lt;/div&gt;&quot; +
      &quot;GANHO REAL: &quot; + (r.lucro &gt;= 0 ? &quot;+ &quot; : &quot;- &quot;) + &quot;R$ &quot; + brl(Math.abs(r.lucro)) +
      &quot; (&quot; + (r.pct &gt;= 0 ? &quot;+&quot; : &quot;-&quot;) + brl(Math.abs(r.pct)) + &quot; %)&quot; +
      &quot;  |  BANCA TOTAL FINAL R$ &quot; + brl(r.bancaFinal) +
      &quot;  |  BANCA DO CICLO R$ &quot; + brl(r.bancaCiclo) +
      &quot;  |  ESTRATÉGIA MAIORIA DA COR&quot; +
      &quot;  |  OPERAÇÕES: &quot; + r.ops + &quot; (&quot; + r.wins + &quot; W / &quot; + r.losses + &quot; L)&quot; +
      &quot; · ASSERTIVIDADE &quot; + brl(r.assert) + &quot; %&quot; +
      &quot; · QUADRANTES: &quot; + quad +
      &quot; · Maior racha LOSS: &quot; + r.maxLs + &quot; · Maior racha WIN: &quot; + r.maxWs +
      &quot; · Ciclos fechados: &quot; + r.ciclos +
      (r.zerou ? &#x27; · &lt;span class=&quot;neg&quot;&gt;❌ BANCA ZERADA&lt;/span&gt;&#x27; : &quot;&quot;);

    g(&quot;msRealBody&quot;).innerHTML = linhasHTML(r);

    // painel de RESULTADOS da simulação (mesmo estilo do bot)
    const res = g(&quot;msRealResumo&quot;);
    if (res){ res.style.display = &quot;grid&quot;; res.innerHTML = cardsHTML(r); }

    realTemDados = true;
    aplicarToqueReal();
  });

  if (g(&quot;msRealLimpar&quot;)) g(&quot;msRealLimpar&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    g(&quot;msRealOut&quot;).innerHTML = &quot;&quot;;
    g(&quot;msRealBody&quot;).innerHTML = &quot;&quot;;
    g(&quot;msRealResumo&quot;).innerHTML = &quot;&quot;;
    g(&quot;msRealResumo&quot;).style.display = &quot;none&quot;;
    realTemDados = false;
    aplicarToqueReal();
  });

  aplicarModo();
  novoCiclo();
  render();
  aplicarToqueReal();
  aplicarToqueSeq();
})();

/* Relógio da operação: atualiza a cada segundo o tempo restante (card 4 e painel). */
ciIniciarArrasto();
setInterval(ciTick, 1000);
&lt;/script&gt;

<script>
  function mostrar(qual){
    var ehPainel = (qual === 'painel');
    document.getElementById('framePainel').classList.toggle('hidden', !ehPainel);
    document.getElementById('frameBot').classList.toggle('hidden', ehPainel);
    document.getElementById('tabPainel').classList.toggle('active', ehPainel);
    document.getElementById('tabBot').classList.toggle('active', !ehPainel);
  }

  /* ==================================================================
     RELÉ DO ESPELHO (duas mãos)
     - Painel (aba 📊) → bot (aba 🤖): HTML renderizado do quadrante/rankings.
     - Bot (aba 🤖) → Painel (aba 📊): filtro (par, data, qtd velas, gale)
       comandado pelo bot; o painel aplica e re-renderiza.
     ================================================================== */
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if (!d) return;
    if (d.__painelMirror){
      try {
        var fb = document.getElementById('frameBot');
        if (fb && fb.contentWindow) fb.contentWindow.postMessage(d, '*');
      } catch(e){}
      return;
    }
    if (d.__painelControle){
      try {
        var fp = document.getElementById('framePainel');
        if (fp && fp.contentWindow) fp.contentWindow.postMessage(d, '*');
      } catch(e){}
    }
  });
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
let deferredInstallPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstallPrompt = e;
  window.dispatchEvent(new CustomEvent('pwa-install-ready'));
});
window.installTradingApp = async function(){
  if (!deferredInstallPrompt) return false;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  return true;
};
</script>
